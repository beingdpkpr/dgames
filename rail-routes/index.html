<script>
  /* Installable, and playable with no network once a game has been opened. Registered from every page so
     a deep link into one game works offline too, not only a visit that started at the launcher. Over
     file:// there is no service worker and register() rejects; the catch keeps that silent. */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
<meta name="description" content="Rail Routes: build railway lines across an original map of India, collect coloured cards, complete your destination tickets. Two to five players, human or computer.">
<title>Rail Routes</title>
<style>
  :root {
    /* A deep teal frame around a warm paper map. The map is the brightest thing on screen; the panel
       stays dark and quiet so the coloured cards read. */
    --bg: #0f2a33; --panel: #153842; --panel2: #1c4652; --line: #2d5d69; --muted: #9fbdc0; --fg: #f4efe3;
    --gold: #f2c14e; --good: #5fd08e; --bad: #ff7d6b; --paper: #f2e6c9; --ink: #2a2116;
    --c0: #d6463b; --c1: #ee8a2a; --c2: #f0c832; --c3: #3e9f58; --c4: #3876cf; --c5: #8d58b6; --c6: #f4f0e6; --c7: #30343a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  #app { position: fixed; inset: 0; display: grid; grid-template-columns: 100%;
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "map" "panel"; }
  #top { grid-area: top; padding: max(6px, env(safe-area-inset-top)) 8px 0 60px; min-width: 0; }
  #bar { display: flex; align-items: center; gap: 6px; min-height: 44px; }
  .logo { flex: 1; margin: 0; font: 700 19px/1 Georgia, "Times New Roman", serif; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gold); }
  .logo small { display: block; font: 11px/1.3 system-ui, sans-serif; color: var(--muted); letter-spacing: 0; }
  .iconbtn { position: relative; width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--gold); color: #222; font: 700 11px/18px system-ui; padding: 0 4px; }
  #players { display: flex; gap: 4px; padding: 4px 0 2px; }
  .pchip { flex: 1 1 0; min-width: 0; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); padding: 3px 3px 3px 7px; position: relative; overflow: hidden; }
  .pchip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc); }
  .pchip.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .pchip b { display: flex; justify-content: space-between; gap: 4px; font-size: 12.5px; white-space: nowrap; }
  .pchip b span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .pchip i { display: block; font-style: normal; font-size: 10.5px; letter-spacing: -.2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 480px) and (max-aspect-ratio: 1/1) { #players.n5 { display: grid; grid-template-columns: repeat(3, 1fr); } }
  .ic { width: 9px; height: 9px; vertical-align: -1px; margin-left: 2px; }
  .ic:first-child { margin-left: 0; }

  #mapWrap { grid-area: map; position: relative; min-height: 0; overflow: hidden; touch-action: none; background: #e9d9b3; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #zoomOut { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(0,0,0,.25); background: rgba(21, 56, 66, .88); display: grid; place-items: center; padding: 0; }
  #zoomOut svg { width: 22px; height: 22px; }
  #banner { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: calc(100% - 16px); background: rgba(15, 42, 51, .92); color: var(--fg); border: 1px solid var(--gold); border-radius: 10px; padding: 6px 12px; font-size: 13px; text-align: center; pointer-events: none; }

  #panel { grid-area: panel; padding: 4px 8px max(8px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #status { min-height: 20px; font-size: 13.5px; line-height: 1.3; color: var(--fg); }
  #status .who { font-weight: 700; }
  #status .sub { color: var(--muted); }
  #market { display: flex; gap: 4px; justify-content: center; }
  .card { position: relative; width: 44px; height: 60px; flex: none; border-radius: 7px; border: 2px solid rgba(0,0,0,.35); padding: 0; display: grid; place-items: center; background: var(--cc); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .card svg { width: 28px; height: 28px; opacity: .85; }
  .card.c6 svg, .card.c2 svg { color: #3b3b3b; } .card svg { color: rgba(255,255,255,.92); }
  .card.loco { background: conic-gradient(from 200deg, var(--c0), var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c0)); }
  .card.loco svg { color: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .card.back { background: repeating-linear-gradient(45deg, #24525f 0 6px, #1b4350 6px 12px); border-color: var(--gold); }
  .card.back svg { color: var(--gold); }
  .card.tix { background: linear-gradient(160deg, #f6ead0, #e3cf9f); border-color: #8a6a32; }
  .card.tix svg { color: #6b4b1c; }
  .card .n { position: absolute; bottom: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: #111; color: #fff; font: 700 12px/20px system-ui; padding: 0 4px; border: 1px solid rgba(255,255,255,.5); }
  .card.empty { background: transparent; border: 2px dashed var(--line); box-shadow: none; }
  .card:disabled { cursor: default; }
  #market .card.dim { opacity: .38; }
  #market .sep { width: 6px; flex: none; }

  #hand { display: flex; justify-content: center; align-items: flex-end; min-height: 52px; padding-right: 6px; }

  @keyframes pop { 0% { transform: translateY(-8px) scale(1.15); } 100% { transform: none; } }

  /* Landscape: panel on the left (so the back button sits on it, not on the map), map fills the rest. */
  @media (min-aspect-ratio: 1/1) {
    #app { grid-template-columns: clamp(336px, 32vw, 420px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "top map" "panel map"; }
    #players { display: grid; grid-template-columns: 1fr 1fr; }
    #panel { justify-content: flex-start; }
    #market { gap: 2px; } #market .sep { width: 0; }
  }
  @media (min-aspect-ratio: 1/1) and (min-height: 600px) {
    #players { grid-template-columns: 1fr; }
    .pchip { padding: 5px 8px 5px 10px; }

    #market { flex-wrap: wrap; } .card { width: 50px; height: 68px; } #hand .card { width: 42px; height: 58px; }

  /* Sheets: a modal veil for setup, menus and scoring; a dock (no veil) for choices that need the map. */
  .veil { position: fixed; inset: 0; z-index: 60; background: rgba(5, 16, 20, .66); display: grid; place-items: center; padding: 12px; }
  .sheet { width: min(520px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .sheet h2 { margin: 0 0 8px; font: 700 20px/1.2 Georgia, serif; color: var(--gold); }
  .sheet p { margin: 6px 0; color: var(--fg); }
  .dock p { margin: 4px 0; }
  .dock .tk { min-height: 46px; margin: 4px 0; }
  .sheet .muted { color: var(--muted); font-size: 13.5px; }
  .dock { grid-area: panel; position: relative; z-index: 5; min-height: 0; max-height: 52vh; overflow: auto; background: var(--panel); border-top: 2px solid var(--gold); border-radius: 16px 16px 0 0; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); }
  @media (min-aspect-ratio: 1/1) { .dock { max-height: none; border-radius: 16px 16px 0 0; } }
  .dock h3 { margin: 0 0 4px; font: 700 18px/1.2 Georgia, serif; color: var(--gold); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; }
  .btn.primary { background: var(--gold); color: #2a2000; border-color: #c99a2a; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.full { width: 100%; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .pay { display: inline-flex; align-items: center; gap: 3px; min-height: 46px; min-width: 44px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); text-align: left; }
  .pay:hover, .pay:focus-visible { border-color: var(--gold); }
  .dock .small { font-size: 12.5px; }
  .dock .btns { margin-top: 6px; position: sticky; bottom: -10px; background: var(--panel); padding: 4px 0; }

  .pay .mini { width: 18px; height: 26px; border-radius: 4px; border: 1.5px solid rgba(0,0,0,.4); background: var(--cc); flex: none; }
  .pay .mini.loco { background: conic-gradient(var(--c0), var(--c2), var(--c3), var(--c4), var(--c5), var(--c0)); }
  .pay span { margin-left: 5px; font-size: 14px; white-space: nowrap; }
  .why { color: var(--bad); }
  .tk { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; margin: 5px 0; padding: 6px 12px; border-radius: 12px; border: 2px solid #8a6a32; background: linear-gradient(160deg, #f6ead0, #e6d3a6); color: var(--ink); text-align: left; }
  .tk .pts { margin-left: auto; font: 700 20px/1 Georgia, serif; min-width: 30px; text-align: right; }
  .tk.sel { border-color: var(--good); box-shadow: 0 0 0 3px rgba(95, 208, 142, .55); }
  .tk .tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #8a6a32; display: grid; place-items: center; flex: none; font-weight: 700; }
  .tk.sel .tick { background: var(--good); border-color: #2d7d50; color: #fff; }
  .tk.done { background: linear-gradient(160deg, #e2f4df, #bfe3b9); border-color: #3e8f57; }
  .tk.fail { background: linear-gradient(160deg, #f6dcd6, #e8b8ad); border-color: #a5483a; }
  .tk small { display: block; font-size: 12px; opacity: .75; }
  .seat { display: grid; grid-template-columns: 14px 1fr 150px; gap: 8px; align-items: center; margin: 6px 0; }
  .setupBtns .btn.pm { flex: 0 0 48px; font-size: 22px; padding: 0; }
  @media (min-aspect-ratio: 1/1) and (max-height: 560px) {
    .seats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
    .seat { grid-template-columns: 10px 1fr 136px; margin: 4px 0; }
    .sheet .intro { display: none; }
    .sheet h2 { font-size: 18px; margin-bottom: 4px; }
    .sheet { padding: 10px 12px; }
  }
  .seat .sw { width: 14px; height: 30px; border-radius: 4px; }
  .seat input, .seat select { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; padding: 0 10px; width: 100%; min-width: 0; -webkit-user-select: text; user-select: text; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: var(--panel2); }
  .seg button.on { background: var(--gold); color: #2a2000; font-weight: 700; }
  table.score { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
  table.score th, table.score td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  table.score th:first-child, table.score td:first-child { text-align: left; }
  table.score td.win { color: var(--gold); font-weight: 700; }
  table.score .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .pending { opacity: .25; }
  #cover { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; place-items: center; text-align: center; padding: 20px; }
  #cover h2 { font: 700 26px/1.2 Georgia, serif; color: var(--gold); margin: 0 0 6px; }
  .toast { position: fixed; z-index: 80; left: 50%; bottom: 24%; transform: translateX(-50%); max-width: min(92vw, 460px); background: rgba(10, 25, 30, .95); border: 1px solid var(--gold); color: var(--fg); padding: 10px 16px; border-radius: 12px; font-size: 14px; text-align: center; pointer-events: none; animation: toastIn .2s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }
  .fly { position: fixed; z-index: 90; pointer-events: none; margin: 0; }
  .rules h4 { margin: 12px 0 4px; color: var(--gold); }
  .rules ul { margin: 4px 0; padding-left: 20px; } .rules li { margin: 3px 0; }

  /* the map */
  #map .sea { fill: #a9cfd4; }
  #map .land { fill: url(#landGrad); }
  #map .coast { fill: none; stroke: #6f8f8a; stroke-width: 1.6; stroke-linejoin: round; }
  #map .shore { fill: none; stroke: #cfe6e4; stroke-width: 9; stroke-linejoin: round; opacity: .7; }
  #map .river { fill: none; stroke: #8dbfcc; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  #map .mtn { fill: #d2bf96; stroke: #a48e62; stroke-width: 1; }
  #map .snow { fill: #fbf8ef; }
  #map .dune { fill: none; stroke: #d5b67a; stroke-width: 1.6; stroke-linecap: round; }
  #map .ghat { fill: none; stroke: #b6a477; stroke-width: 1.4; stroke-dasharray: 1 5; stroke-linecap: round; }
  #map .wave { fill: none; stroke: #8fbcc3; stroke-width: 1.2; stroke-linecap: round; opacity: .8; }
  #map .seaLabel { font: italic 17px Georgia, serif; fill: #5e8d93; letter-spacing: 3px; }
  #map .areaLabel { font: italic 13px Georgia, serif; fill: #a38c5f; letter-spacing: 4px; }
  #map .slot { stroke-width: 1.3; opacity: .82; }
  #map .slot.car { opacity: 1; stroke-width: 1.5; }
  #map .slot.grey { fill: #a29c90; stroke: #625d54; }
  #map .route.closed .slot { opacity: .28; }
  #map .route.can .slot { stroke: #fff; stroke-width: 2.4; }
  #map .route.can { animation: can 1.6s ease-in-out infinite; }
  @keyframes can { 50% { opacity: .7; } }
  #map .route.sel .slot { stroke: #111; stroke-width: 3.6; opacity: 1; }
  #map .route.sel { animation: can .9s ease-in-out infinite; }
  #map .car { stroke: rgba(0,0,0,.55); stroke-width: 1.2; }
  #map .wheel { fill: rgba(0,0,0,.55); }
  #map .city circle.dot { fill: #fffaf0; stroke: #3d3326; stroke-width: 2; }
  #map .city .ring { fill: none; stroke: none; stroke-width: 3.2; }
  #map .city.tk .ring { stroke: #e2462f; stroke-dasharray: 4 3; }
  #map .city.tkdone .ring { stroke: #2f9e5a; stroke-dasharray: none; }
  #map .city.hl .ring { stroke: #e9a400; stroke-dasharray: none; stroke-width: 4.5; }
  #map .city.pulse .ring { animation: ring 1s ease-out 3; }
  @keyframes ring { 0% { stroke-width: 9; opacity: .2; } 100% { stroke-width: 3; opacity: 1; } }
  #map .label { font: 600 12px system-ui, sans-serif; fill: #2a2116; paint-order: stroke; stroke: #f6ecd2; stroke-width: 3.4px; stroke-linejoin: round; pointer-events: none; }
  #map .flash { fill: none; stroke: #fff6c2; stroke-linecap: round; stroke-width: 12; opacity: 0; }
  #map .flash.on { animation: flash 1.2s ease-in-out; }
  @keyframes flash { 30% { opacity: .9; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #map .route.can { animation: none; } }
</style>
</head>

<style>
  /* dgames: the way back, identical in every game. Four games had no way out at all; the rest used a
     ~16px inline link, and strike-force's sat underneath the touch stick where the pad ate the tap.
     A dark disc with a light ring reads on a bright pastel scene and on a black one without being
     re-themed per game. z-index 50 sits above every game UI here (rush-lane and strike-force both use
     40, ludo game-over 20) and below the high-score prompt at 9999, which is modal and should stay on
     top. It was 15, which grep reported as present and the eye reported as missing in two games. */
  .dg-home { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(8, 18, 30, .72); border: 2px solid rgba(255, 255, 255, .62); color: #fff;
    font-size: 21px; line-height: 1; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .dg-home:hover, .dg-home:focus-visible { background: rgba(8, 18, 30, .92); border-color: #ffd54a; color: #ffd54a; }
</style>
<a class="dg-home" href="../index.html" title="All games" aria-label="Back to all games">&#8592;</a>

<script>
'use strict';
// Rail Routes — pure logic. The map graph, the cards and the decks, the rules of a turn, ticket
// completion, the longest continuous path, final scoring and the computer players. Nothing above the
// UI marker touches the DOM, a clock or Math.random: every shuffle and every computer choice draws from
// the seeded generator kept in the game state, so a seed replays a game exactly and the tests can lift
// this whole section into node's vm.

const VERSION = 1;
const LOCO = 8;                       // card index of the locomotive (wild); 0..7 are the colours
const COLOUR_NAMES = ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple', 'White', 'Black', 'Locomotive'];
const PER_COLOUR = 12, LOCOS = 14;    // 8 x 12 + 14 = 110 cards
const TRAINS = 45, FACE = 5, HAND0 = 4;
const POINTS = [0, 1, 2, 4, 7, 10, 15];   // route points by length 1..6
const LONGEST_BONUS = 10;
const KINDS = ['human', 'easy', 'normal', 'hard'];

// ---- the map. City positions are map units on a stylised projection of India (x east, y south); the
// UI draws the coastline in the same units. Routes and lengths are our own; see README for the method.
const CITY_LIST = [
  ['Jammu', 204, 85],
  ['Amritsar', 192, 135],
  ['Chandigarh', 258, 172],
  ['Dehradun', 318, 176],
  ['Delhi', 278, 238],
  ['Bikaner', 158, 255],
  ['Jaipur', 220, 294],
  ['Jodhpur', 149, 312],
  ['Udaipur', 169, 365],
  ['Agra', 314, 297],
  ['Jhansi', 314, 338],
  ['Lucknow', 384, 293],
  ['Varanasi', 444, 342],
  ['Gorakhpur', 456, 296],
  ['Patna', 509, 333],
  ['Siliguri', 605, 297],
  ['Guwahati', 704, 316],
  ['Dibrugarh', 798, 273],
  ['Kolkata', 604, 430],
  ['Ranchi', 514, 405],
  ['Bhubaneswar', 529, 502],
  ['Raipur', 404, 472],
  ['Visakhapatnam', 445, 584],
  ['Vijayawada', 375, 624],
  ['Chennai', 357, 733],

const CITIES = CITY_LIST.map(([name, x, y], id) => ({ id, name, x, y }));

    if (u < 0) break;
    done[u] = true;
    for (const r of ADJ[u]) {
      const c = cost(r);

function newGame(opts) {

    owner: new Array(ROUTES.length).fill(-1),

function addLog(S, p, msg) { S.log.push({ p, msg }); if (S.log.length > 80) S.log.splice(0, S.log.length - 80); }

// Take the top card of the draw pile, shuffling the discards back in when it runs out. -1 if both are empty.
function drawFromDeck(S, ev) {

// Fill empty face-up slots; three or more locomotives face up and all five are discarded and replaced.
// The reset only repeats while the cards left could actually come up differently.
function refill(S, ev) {

  let guard = 0;
  while (S.face.filter((c) => c === LOCO).length >= 3 && guard++ < 8) {
    const nonLoco = S.deck.filter((c) => c !== LOCO).length + S.disc.filter((c) => c !== LOCO).length + S.face.filter((c) => c >= 0 && c !== LOCO).length;
    if (nonLoco < 3) break;
    for (let i = 0; i < FACE; i++) { if (S.face[i] >= 0) S.disc.push(S.face[i]); S.face[i] = -1; }

}

  if (R.twin >= 0) {

function payOptions(hand, r) {

function components(S, p) {

function longestTrailEdges(edges) {

    const lp = longestTrail(ownedRoutes(S, p));

      plus: tickets.filter((x) => x.ok).reduce((s, x) => s + x.pts, 0),
      minus: tickets.filter((x) => !x.ok).reduce((s, x) => s + x.pts, 0),
      done: tickets.filter((x) => x.ok).length, longest: lp.len, longestRoutes: lp.routes, bonus: 0, total: 0,
    };

  if (best > 0) rows.forEach((r) => { if (r.longest === best) r.bonus = LONGEST_BONUS; });

  const winners = order.filter((p) => cmp(rows[p], rows[order[0]]) === 0);

// ---- applying an action. Returns {ok, ev} with events for the UI to animate, or {ok:false, why}.
function endTurn(S, ev) {
  const P = S.players[S.cur];
  if (S.lastTurns > 0) {
    S.lastTurns--;
    if (S.lastTurns === 0) return finish(S, ev, 'trains');
  } else if (S.lastTurns < 0 && P.trains <= 2) {
    S.lastTurns = S.n;
    ev.push({ e: 'lastRound', p: S.cur });
    addLog(S, S.cur, P.name + ' has ' + P.trains + ' trains left: everyone gets one last turn.');
  }
  S.cur = (S.cur + 1) % S.n;
  S.stage = 'start';
  S.turn++;

}
function finish(S, ev, why) {
  S.phase = 'over';
  S.endReason = why;
  S.final = finalScores(S);
  ev.push({ e: 'over', why });

function apply(S, a) {

    const keep = Array.isArray(a.keep) ? a.keep : [];

    if (keep.length < min) return err('Keep at least ' + min + '.');

    P.tickets.push(...keep);
    S.tdeck.unshift(...back);

    body = '<div class="pays">' + opts2.slice(0, 12).map((o, i) => {
      let minis = '';
      for (let k = 0; k < o.use; k++) minis += `<span class="mini" style="--cc:${CARD_HEX[o.k]}"></span>`;
      for (let k = 0; k < o.loco; k++) minis += '<span class="mini loco"></span>';
      const words = (o.use ? o.use + ' ' + M.COLOUR_NAMES[o.k] : '') + (o.use && o.loco ? ' + ' : '') + (o.loco ? o.loco + ' locomotive' + (o.loco > 1 ? 's' : '') : '');
      return `<button class="pay" data-i="${i}" aria-label="Pay ${words}">${minis}<span>${words.replace(' locomotive', ' loco')}</span></button>`;
    }).join('') + '</div>';
  }
  const twin = R.twin >= 0 ? (S.n <= 3 ? 'Double route: with 2 or 3 players only one track is used.' : 'Double route: each track can go to a different player.') : '';
  const d = openDock('claim', `<h3>${esc(routeName(r))}</h3>
    <p class="row" style="gap:6px">${swatch}<span>${R.len} car${R.len > 1 ? 's' : ''} · ${colourWord(R.c)} · scores ${M.POINTS[R.len]}</span></p>
    ${twin ? `<p class="muted small">${twin}</p>` : ''}
    ${body}
    <div class="btns"><button class="btn" id="clClose">${opts2.length ? 'Cancel' : 'Close'}</button></div>`);
  d.querySelectorAll('.pay').forEach((b) => b.addEventListener('click', () => {
    const o = opts2[+b.dataset.i];
    act({ t: 'claim', r, k: o.k, loco: o.loco });
  }));
  $('clClose').addEventListener('click', closeDock);
}
board.onTap((hit) => {
  if (!S || !hit || dockMode === 'tickets' || dockMode === 'final') {
    if (hit && hit.type === 'city' && S) toast(cityName(hit.c));
    return;
  }
  if (hit.type === 'route') openClaim(hit.r);
  else {
    const v = viewer();
    const mine = v >= 0 ? S.players[v].tickets.filter((t) => M.TICKETS[t].a === hit.c || M.TICKETS[t].b === hit.c) : [];
    toast(cityName(hit.c) + (mine.length ? ': your ticket' + (mine.length > 1 ? 's' : '') + ' to ' + mine.map((t) => cityName(M.TICKETS[t].a === hit.c ? M.TICKETS[t].b : M.TICKETS[t].a)).join(', ') : ''));
  }
});
board.onView((zoomed) => { $('zoomOut').hidden = !zoomed; });
$('zoomOut').addEventListener('click', () => board.resetView());

function showMyTickets() {
  if (!S) return;
  const v = viewer();
  if (v < 0) { toast('Tickets are hidden between turns.'); return; }
  const P = S.players[v], comp = M.components(S, v);
  const list = P.tickets.map((t) => ticketHtml(t, '', M.ticketDone(S, v, t, comp) ? 'done' : '')).join('') || '<p class="muted">No tickets yet.</p>';
  const sh = openSheet(`<h2>${esc(P.name)}'s tickets</h2><p class="muted">Green ones are joined already. Tap one to see its cities on the map.</p>${list}<div class="btns"><button class="btn" id="mtClose">Close</button></div>`);
  sh.querySelectorAll('.tk').forEach((e) => e.addEventListener('click', () => {
    const Tk = M.TICKETS[+e.dataset.t];
    closeSheet();
    board.highlightCities([Tk.a, Tk.b]);
    clearTimeout(hlTimer);
    hlTimer = setTimeout(() => { if (dockMode !== 'tickets') board.highlightCities([]); }, 3500);
  }));
  $('mtClose').addEventListener('click', closeSheet);
}
$('btnTickets').addEventListener('click', showMyTickets);

const RULES = `<div class="rules">
  <h4>Your turn: do one of three things</h4>
  <ul><li><b>Take two cards.</b> From the five face up or the pile. A face-up locomotive counts as both cards, and cannot be your second card.</li>
  <li><b>Claim a route.</b> Tap it on the map and pay as many cards of its colour as it has cars. Grey routes take any one colour. Locomotives stand in for any colour.</li>
  <li><b>Draw destination tickets.</b> Look at three, keep at least one.</li></ul>
  <h4>Scoring</h4>
  <ul><li>Routes score as you claim them: 1, 2, 4, 7, 10 or 15 points for 1 to 6 cars.</li>
  <li>At the end each ticket adds its points if your own routes join its two cities, and takes them away if not.</li>
  <li>The longest continuous path of routes earns 10 more points (ties all score).</li></ul>
  <h4>Details</h4>
  <ul><li>Everyone has 45 trains. When a player ends a turn with 2 or fewer, everyone (them included) gets one last turn.</li>
  <li>Some cities have double routes. With 2 or 3 players only one track of each pair can be used; with 4 or 5 both can, by different players.</li>
  <li>If three locomotives are ever face up, all five face-up cards are replaced.</li>
  <li>At the start everyone keeps at least two of three tickets. Ties are broken by most tickets completed, then the longest path.</li></ul>
  <p class="muted">On the map: dashed red rings mark your ticket cities, green rings those already joined. Routes you can pay for right now glow. Pinch or scroll to zoom.</p></div>`;
function showMenu() {
  const sh = openSheet(`<h2>Rail Routes</h2>
    <p class="muted">Computer speed</p>
    <div class="seg" id="mSpeed"><button data-v="0" class="${opts.fast ? '' : 'on'}">Normal</button><button data-v="1" class="${opts.fast ? 'on' : ''}">Fast</button></div>
    <p class="muted">Glow on routes you can claim</p>
    <div class="seg" id="mHints"><button data-v="1" class="${opts.hints ? 'on' : ''}">On</button><button data-v="0" class="${opts.hints ? '' : 'on'}">Off</button></div>
    <div class="btns"><button class="btn" id="mRules">How to play</button><button class="btn" id="mNew">New game</button></div>
    <div class="btns"><button class="btn primary" id="mClose">Back to the game</button></div>`);
  sh.querySelectorAll('#mSpeed button').forEach((b) => b.addEventListener('click', () => { opts.fast = b.dataset.v === '1'; saveOpts(); showMenu(); }));
  sh.querySelectorAll('#mHints button').forEach((b) => b.addEventListener('click', () => { opts.hints = b.dataset.v === '1'; saveOpts(); renderAll(); showMenu(); }));
  $('mRules').addEventListener('click', () => { openSheet(`<h2>How to play</h2>${RULES}<div class="btns"><button class="btn primary" id="rClose">Back</button></div>`); $('rClose').addEventListener('click', S ? showMenu : showSetup); });
  $('mNew').addEventListener('click', showSetup);
  $('mClose').addEventListener('click', () => { closeSheet(); if (!S) showSetup(); });
}
$('btnMenu').addEventListener('click', showMenu);

// ---- setup
function showSetup(note) {
  let saved = null;
  try { saved = M.deserialize(localStorage.getItem(SAVE_KEY) || ''); } catch (e) { saved = null; }
  const seats = opts.seats.map((s) => Object.assign({}, s));
  const draw = () => {
    const kinds = [['human', 'Human'], ['easy', 'Easy computer'], ['normal', 'Normal computer'], ['hard', 'Hard computer']];
    const rows = '<div class="seats">' + seats.map((s, i) => `<div class="seat"><span class="sw" style="background:${PCOL[i].hex}"></span>
      <input id="nm${i}" value="${esc(s.name)}" maxlength="16" aria-label="Player ${i + 1} name">
      <select id="kd${i}" aria-label="Player ${i + 1} type">${kinds.map(([k, w]) => `<option value="${k}"${k === s.kind ? ' selected' : ''}>${w}</option>`).join('')}</select></div>`).join('') + '</div>';
    const resume = saved ? `<div class="btns"><button class="btn primary" id="suResume">Resume your game (turn ${saved.turn + 1}, ${saved.players.map((P) => esc(P.name)).join(', ')})</button></div><p class="muted" style="text-align:center">or start a new one:</p>` : '';
    const sh = openSheet(`<h2>Rail Routes</h2>
      <p class="muted intro">${note ? esc(note) + ' ' : ''}Build railways across India. Join the cities on your tickets, claim long routes, and keep the longest line.</p>
      ${resume}
      ${rows}
      <div class="btns setupBtns"><button class="btn pm" id="suLess" aria-label="Fewer players" title="Fewer players"${seats.length <= 2 ? ' disabled' : ''}>−</button><button class="btn pm" id="suMore" aria-label="More players" title="More players"${seats.length >= 5 ? ' disabled' : ''}>+</button><button class="btn" id="suRules">How to play</button><button class="btn ${saved ? '' : 'primary'}" id="suGo">Start</button></div>`);
    const read = () => seats.forEach((s, i) => { s.name = ($('nm' + i).value.trim() || DEFAULT_NAMES[i]).slice(0, 16); s.kind = $('kd' + i).value; });
    $('suLess').addEventListener('click', () => { read(); seats.pop(); draw(); });
    $('suMore').addEventListener('click', () => { read(); seats.push({ name: DEFAULT_NAMES[seats.length], kind: 'normal' }); draw(); });
    $('suRules').addEventListener('click', () => { read(); opts.seats = seats; openSheet(`<h2>How to play</h2>${RULES}<div class="btns"><button class="btn primary" id="rClose">Back</button></div>`); $('rClose').addEventListener('click', () => showSetup()); });
    $('suGo').addEventListener('click', () => { read(); opts.seats = seats.map((s) => Object.assign({}, s)); saveOpts(); startGame(seats); });
    if (saved) $('suResume').addEventListener('click', () => { resumeGame(saved); });
    sh.querySelectorAll('input').forEach((inp) => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); }));
  };
  draw();
}
function startGame(seats) {
  gen++; busy = false; shownFor = -1;
  closeSheet(); closeDock();
  S = M.newGame({ seed: (Date.now() ^ Math.floor(performance.now() * 1000)) & 0x7fffffff, players: seats });
  save();
  board.resetView();
  step();
}
function resumeGame(s) {
  gen++; busy = false; shownFor = -1;
  closeSheet(); closeDock();
  S = s;
  board.resetView();
  step();
}

// ---- final scoring, step by step: routes, tickets, the longest path, totals
async function showFinal() {
  if (dockMode === 'final') return;
  const F = S.final, g = gen;
  const rows = F.rows;
  const nameCell = (p) => `<span class="sw" style="background:${PCOL[p].hex}"></span>${esc(S.players[p].name)}`;
  const d = openDock('final', `<h3>Final scores</h3>
    <p class="muted" id="fNote">${S.endReason === 'stalled' ? 'Nobody could move any more, so the game ends here.' : 'Out of trains: the last round is over.'}</p>
    <table class="score"><thead><tr><th>Player</th><th>Routes</th><th>Tickets</th><th>Longest</th><th>Total</th></tr></thead><tbody>
    ${rows.map((r) => `<tr id="fr${r.p}"><td>${nameCell(r.p)}</td><td>${r.routes}</td><td class="pending" id="ft${r.p}">…</td><td class="pending" id="fl${r.p}">…</td><td class="pending" id="fs${r.p}">…</td></tr>`).join('')}
    </tbody></table>
    <div id="fDetail"></div>
    <div class="btns"><button class="btn" id="fMap">Look at the map</button><button class="btn primary" id="fNew">New game</button></div>`);
  $('fNew').addEventListener('click', () => showSetup());
  $('fMap').addEventListener('click', () => { closeDock(); dockMode = ''; toast('Tap the menu for a new game.', 2200); });
  const wait = (ms) => sleep(T(ms));
  board.render(S, -1, []);
  for (const r of rows) {
    if (g !== gen) return;
    const cell = $('ft' + r.p);
    if (!cell) return;
    cell.classList.remove('pending');
    cell.textContent = (r.plus - r.minus >= 0 ? '+' : '−') + Math.abs(r.plus - r.minus);
    cell.title = r.tickets.map((x) => `${cityName(M.TICKETS[x.t].a)}–${cityName(M.TICKETS[x.t].b)} ${x.ok ? '+' : '−'}${x.pts}`).join(', ');
    await wait(450);
  }
  const best = Math.max(...rows.map((r) => r.longest));
  for (const r of rows) {
    if (g !== gen) return;
    const cell = $('fl' + r.p);
    if (!cell) return;
    cell.classList.remove('pending');
    cell.textContent = r.longest + (r.bonus ? ' ★+' + r.bonus : '');
    if (r.bonus && r.longest === best) { await board.flashRoutes(r.longestRoutes, T(160)); await wait(300); }
    else await wait(250);
  }
  for (const r of rows) {
    const cell = $('fs' + r.p);
    if (!cell) return;
    cell.classList.remove('pending');
    cell.textContent = r.total;
    if (F.winners.includes(r.p)) cell.classList.add('win');
  }
  const w = F.winners.map((p) => S.players[p].name).join(' and ');
  const det = $('fDetail');
  if (!det) return;
  det.innerHTML = `<p><b style="color:var(--gold)">${F.winners.length > 1 ? 'Shared win' : 'Winner'}: ${esc(w)}</b></p>` + rows.map((r) => `<p class="muted" style="margin:3px 0">${esc(S.players[r.p].name)}: ${r.tickets.map((x) => `${x.ok ? '✓' : '✗'} ${esc(cityName(M.TICKETS[x.t].a))}–${esc(cityName(M.TICKETS[x.t].b))} ${x.ok ? '+' : '−'}${x.pts}`).join(', ') || 'no tickets'}</p>`).join('');
}

addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('veil').hidden && S) closeSheet();
  else if (dockMode === 'claim') closeDock();
});

// ---- start: a saved game is offered on the setup sheet; a save that cannot be read is dropped
(function boot() {
  let text = null;
  try { text = localStorage.getItem(SAVE_KEY); } catch (e) { text = null; }
  if (text && !M.deserialize(text)) {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    showSetup('Your saved game could not be read, so a new one is ready.');
  } else showSetup();
})();

// Hooks for the browser checks: read the state and let the computer play a human seat.
window.__railRoutesUI = {
  state: () => S,
  busy: () => busy,
  viewer,
  load(text) { const s = M.deserialize(text); if (s) resumeGame(s); return !!s; },
  async autoStep() { if (!S || busy || S.phase === 'over' || S.players[S.cur].kind !== 'human') return false; const a = M.aiMove(S); closeDock(); const r = await perform(a); step(); return r.ok; },
  board,
};
</script>
</body>
</html>
