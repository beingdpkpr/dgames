<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b1a2b">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dgames">
<meta name="mobile-web-app-capable" content="yes">
<script>
  /* Installable, and playable with no network once a game has been opened. Registered from every page so
     a deep link into one game works offline too, not only a visit that started at the launcher. Over
     file:// there is no service worker and register() rejects; the catch keeps that silent. */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
<meta name="description" content="Classic Indian Ludo for two to four players, each seat human or computer.">
<title>Ludo</title>
<style>
  :root {
    --bg: #0b1a2b; --panel: #10233a; --line: #456f9e; --muted: #8fa9c6; --gold: #ffd54a;
    --p1: #e5484d; --p2: #46a758; --p3: #f5d90a; --p4: #3b82f6;
    /* Track was #16304c on a #0e1f33 board: a contrast ratio of 1.24:1, which is invisible — you could
       not follow the route a token takes, and Ludo is a game about counting squares along that route.
       #4d74a3 measures 3.44:1 against the board, clearing the 3:1 that WCAG asks of a non-text element. */
    --board: #0e1f33; --track: #4d74a3; --safe: #c3d6ea;
    --tilt: 15deg;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;
    padding: 10px 10px max(10px, env(safe-area-inset-bottom)); gap: 10px; }
  h1 { font-size: 22px; letter-spacing: 3px; margin: 2px 0 0; }
  h1 span { color: var(--gold); }

  /* The 3D is deliberately mild. Ludo is counted, not flown through: a steep camera shrinks the far rank
     and lets tokens hide behind each other, so the board only leans back far enough to read as a table.
     The depth that sells it lives in the pieces and the die, which stand up off the surface. */
  /* Perspective has to scale with the board. At a fixed 1400px against a 379px phone board the skew was
     about 4% — a flat board with a bevelled frame, not a tilt. Tying it to --s keeps the apparent depth
     the same at every size. 52vh rather than 58vh because the page overflowed 1280x800, scrolling the
     title and the top rank of the board off the screen. */
  #stage { --s: min(94vw, 52vh, 520px); perspective: calc(var(--s) * 2.7); perspective-origin: 50% 42%;
    width: var(--s); aspect-ratio: 1; }
  #board { width: 100%; height: 100%; position: relative; transform: rotateX(var(--tilt));
    transform-style: preserve-3d; display: grid; grid-template: repeat(15, 1fr) / repeat(15, 1fr);
    background: var(--board); border: 2px solid var(--line); border-radius: 10px;
    box-shadow: 0 24px 40px rgba(0,0,0,.55); --s: min(94vw, 52vh, 520px); }
  /* preserve-3d and overflow:hidden cannot coexist — clipping forces a flat plane — so the four corner
     cells round themselves instead of letting the board clip them. */
  .cell:nth-child(1) { border-radius: 8px 0 0 0; }
  .cell:nth-child(15) { border-radius: 0 8px 0 0; }
  .cell:nth-child(211) { border-radius: 0 0 0 8px; }
  .cell:nth-child(225) { border-radius: 0 0 8px 0; }

  .cell { position: relative; }
  /* A visible grid line matters more once the board is tilted: it is the only cue left for how far a
     token has to travel. The old 5%-white inset was not perceptible. */
  .cell.track { background: var(--track); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .cell.safe { background: var(--safe); }
  .cell.safe::after { content: "\2605"; position: absolute; inset: 0; display: grid; place-items: center;
    font-size: calc(var(--s) / 26); color: rgba(8,19,31,.62); }
  /* The entry square is FILLED with its owner's colour, not outlined in it. As an outline the four
     colours measured 1.24, 1.60, 3.41 and 1.31 against the track — three of them invisible. Filled,
     the hue carries the ownership and an opaque #08131f keyline carries the edge at 3.87:1 against
     the track, which is what actually clears the bar — the fill colours themselves do not, because
     WCAG measures luminance and red, green and blue all sit at roughly the track's lightness. */
  .cell.start { background: currentColor; box-shadow: inset 0 0 0 2px #08131f; }
  .cell.home-run { background: currentColor; opacity: .85; }
  /* Yards were opacity .16, which left the four bases as faint tints barely separable from the board.
     .34 plus an owned border makes each corner read as that player's territory at a glance. */
  .cell.yard { background: currentColor; opacity: .34; }
  .cell.centre { background: currentColor; opacity: .7; }

  /* Tokens stand up off the board: lifted on Z, then counter-rotated by the board's own tilt so they
     face the player like real pieces rather than lying flat as discs. */
  .tok { position: absolute; width: calc(var(--s) / 15 * .8); height: calc(var(--s) / 15 * .8);
    margin: calc(var(--s) / 15 * -.4) 0 0 calc(var(--s) / 15 * -.4);
    border-radius: 50%; background: currentColor; border: 2px solid rgba(0,0,0,.6);
    transform-style: preserve-3d; transform: translateZ(calc(var(--s) / 15 * .42)) rotateX(calc(var(--tilt) * -1));
    box-shadow: 0 calc(var(--s) / 15 * .12) calc(var(--s) / 15 * .2) rgba(0,0,0,.55);
    transition: left .18s ease, top .18s ease; z-index: 2;
    display: grid; place-items: center; font-size: calc(var(--s) / 40); font-weight: 700; color: #08131f; }
  /* .tok sets display:grid, and an author rule beats the UA stylesheet's [hidden]{display:none} — so a
     2-player game still painted all sixteen tokens even though render() had hidden twelve of them. A DOM
     check reported them hidden, which is why this survived a check. .over[hidden] already does this. */
  .tok[hidden] { display: none; }
  /* The shadow the piece casts on the square below it, which is what actually reads as height. */
  .tok::after { content: ""; position: absolute; left: 50%; top: 50%; width: 96%; height: 96%;
    border-radius: 50%; background: rgba(0,0,0,.42); z-index: -1;
    transform: translate(-50%, -50%) rotateX(var(--tilt)) translateZ(calc(var(--s) / 15 * -.42)); }
  /* A movable token keeps a 44px hit area whatever the board size, so small screens stay tappable. */
  .tok.can { cursor: pointer; z-index: 3; animation: pulse 1.1s ease-in-out infinite; }
  .tok.can::before { content: ""; position: absolute; left: 50%; top: 50%; width: max(44px, 100%); height: max(44px, 100%);
    transform: translate(-50%, -50%); border-radius: 50%; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 calc(var(--s) / 130) #fff, 0 calc(var(--s) / 15 * .12) calc(var(--s) / 15 * .2) rgba(0,0,0,.55); } }

  .bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    width: min(94vw, 520px); }
  #turn { font-size: 15px; min-height: 22px; text-align: center; flex: 1 1 100%; }
  #turn b { letter-spacing: 1px; }
  #note { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; flex: 1 1 100%; }

  /* A real tumbling cube. Six faces at half the cube's width on Z, the whole thing spun to bring the
     rolled face to the front — the one place a board game genuinely wants 3D. */
  /* Margin, because a cube under perspective draws well outside its own 72px box -- the rotated corners
     reached about 94px and landed on the "Tap to roll" line below it. */
  #die { width: 72px; height: 72px; margin: 8px 0 20px; border: 0; background: none; padding: 0; perspective: 420px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #die:disabled { opacity: .5; cursor: default; }
  #cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2,.8,.3,1); transform: rotateX(-18deg) rotateY(22deg); }
  /* Faces are CSS pips on a 3x3 grid. They used to be the Unicode die characters U+2680..2685, each of
     which draws its OWN square outline — so every face of the cube was a die rendered inside a die.
     Nothing measurable was wrong with it; it just looked absurd, which is why it took a screenshot. */
  #cube .f { position: absolute; inset: 0; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    gap: 7%; padding: 15%; background: #f3f6fa; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }
  #cube .f i { background: #12263d; border-radius: 50%; width: 100%; height: 100%; align-self: center; justify-self: center; }
  #cube .f1 { transform: translateZ(36px); }
  #cube .f6 { transform: rotateY(180deg) translateZ(36px); }
  #cube .f2 { transform: rotateY(90deg) translateZ(36px); }
  #cube .f5 { transform: rotateY(-90deg) translateZ(36px); }
  #cube .f3 { transform: rotateX(90deg) translateZ(36px); }
  #cube .f4 { transform: rotateX(-90deg) translateZ(36px); }
  #dieHint { font-size: 12px; color: var(--muted); }

  /* Move chips duplicate the on-board tokens as full-size buttons. On a phone the board cells are ~24px,
     which is below any sane tap target, so these are the reliable way to play. */
  #moves { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid currentColor;
    background: var(--panel); font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .chip i { width: 14px; height: 14px; border-radius: 50%; background: currentColor; display: inline-block; }
  .chip span { color: #fff; }

  /* Each seat is its own bordered pill. Before, the colour labels and the dropdowns ran together in one
     wrapping row, so "Red You Green [Computer]" read as though the dropdown might belong to Red. */
  .seats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  /* The pills wrapped raggedly on a phone -- Red and Green, then Yellow, then Blue -- because each is a
     different width and flex-wrap packs by whatever fits. One per row reads as a list of seats. */
  @media (max-width: 560px) { .seats { flex-direction: column; align-items: stretch; } .seat select { margin-left: auto; } }
  .seat { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid currentColor;
    border-radius: 10px; padding: 4px 8px 4px 7px; min-height: 44px; }
  .seat .sw { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  .seat select { min-height: 36px; padding: 4px 6px; }
  .seat .you { color: var(--gold); font-weight: 700; }
  select, .btn { background: var(--panel); color: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 13px; min-height: 44px; }
  .btn { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #record { font-size: 12px; color: var(--muted); text-align: center; }
  #record b { color: var(--gold); }
  .over { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(4,10,20,.8); }
  .over[hidden] { display: none; }
  .over > div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px;
    text-align: center; width: min(340px, 90vw); }
  .over h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: 2px; }

  /* #side only exists for this layout: everywhere else it is display:contents, so its children are laid
     out as the body's own flex items exactly as before it was added. */
  #side { display: contents; }

  /* A phone turned sideways. The column above sized the board at 52vh, which on 844x390 was a 203px board
     — 13% of the screen — with the die below it and the page scrolling 315-376px to reach it. Here the
     board takes the full height on the right and everything else is a column on its left, so nothing
     scrolls in play. The board box stays square; it only measures 213x198 in a DOM rect because rotateX
     under perspective widens the near edge and foreshortens the height, which is why the right padding is
     wider than the left: the near edge overhangs the box by about 3% of --s. */
  @media (orientation: landscape) and (max-height: 500px) {
    body { display: grid; min-height: 0; height: 100vh; height: 100dvh; align-items: start;
      grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 44px minmax(0, 1fr); gap: 6px 12px;
      padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
    /* The title shares the fixed back button's row, starting past it (44px button + 8px). */
    h1 { grid-area: 1 / 1; align-self: center; justify-self: start; margin: 0 0 0 52px; font-size: 18px; }
    /* 24px is the 16px of vertical padding plus the ~1% the tilted far edge drops below the box. The vw
       term keeps a side column of at least ~250px on the narrowest phones (568x320). */
    #stage, #board { --s: min(calc(100vh - 24px), calc(100vw - 300px), 520px); }
    #stage, #board { --s: min(calc(100dvh - 24px), calc(100vw - 300px), 520px); }
    #stage { grid-area: 1 / 2 / 3 / 3; align-self: center; }
    /* The play controls come first and fit in the 309px a 375px-tall screen leaves: turn line 22, the
       worst case of four move chips 4x44 + gaps = 194, the note 18. The seat settings follow and scroll
       inside this column, never the page — they are for between games, not for a turn. */
    #side { grid-area: 2 / 1; display: grid; grid-template-columns: 96px minmax(0, 1fr); align-content: start;
      gap: 6px 8px; min-height: 0; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }
    #side > .bar { width: auto; grid-column: 1 / -1; }
    #rollBar, #hintBar { display: contents; }
    #side > .bar:first-child { grid-row: 1; }
    /* The cube draws outside its 72px box under perspective — most in the unrolled corner-on pose, where
       it reached 16px below it and sat on "Tap to roll". The 96px column and these margins keep it off the
       chips beside it and the hint below it. */
    #die { grid-area: 2 / 1; margin: 10px 12px 22px; }
    #dieHint { grid-area: 3 / 1; align-self: start; text-align: center; }
    #moves { grid-area: 2 / 2 / 4 / 3; flex-direction: column; flex-wrap: nowrap; align-items: flex-start; gap: 6px; }
    /* A chip may wrap to two lines in the 180px it gets on a 667px screen; it still stands 44px tall. */
    .chip { font-size: 13px; padding: 4px 12px; text-align: left; line-height: 1.2; max-width: 100%; }
    .chip i { flex: none; }
    .seats { flex-direction: column; align-items: stretch; }
    .seat select { margin-left: auto; min-height: 44px; min-width: 44px; }
  }

  /* ---- 3D view (body.v3d), drawn by ../lib/tabletop.js. The 2D board above stays the fallback when WebGL
     is missing and the choice for anyone who prefers it; nothing in this block applies without .v3d. ---- */
  #c3d { display: none; }
  #view3 { display: none; }
  #to3d[hidden] { display: none; }
  body.v3d { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; display: grid;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: 44px auto minmax(0, 1fr); justify-items: center; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  body.v3d h1 { grid-area: 1 / 1; margin: 0; align-self: center; }
  /* Portrait: a square window as wide as the phone — the board's own shape, so top-down fills it. */
  body.v3d #stage { grid-area: 2 / 1; width: 100%; height: min(calc(100vw - 20px), 62vh); aspect-ratio: auto; perspective: none; position: relative; min-height: 0; }
  body.v3d #board { display: none; }
  body.v3d #c3d { display: block; width: 100%; height: 100%; border-radius: 14px; touch-action: none; outline: none; }
  body.v3d #view3 { display: flex; grid-area: 1 / 1; justify-self: end; align-self: center; gap: 6px; }
  #view3 button { min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid rgba(43,47,92,.25);
    background: rgba(251,250,245,.92); color: #2b2f5c; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 8px rgba(43,47,92,.18); -webkit-tap-highlight-color: transparent; }
  /* The settings scroll inside this panel, never the page. Play controls come first, so a turn never
     needs a scroll; the seats are for between games. */
  body.v3d #side { grid-area: 3 / 1; display: block; width: min(100%, 520px); min-height: 0; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  body.v3d #side > .bar + .bar { margin-top: 8px; }
  body.v3d #rollBar { gap: 8px; }
  /* Two chips a row: four of them in one column pushed the fourth and the note out of a 640px screen. */
  body.v3d #moves { flex: 1 1 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
  body.v3d .chip { font-size: 13px; padding: 2px 10px; line-height: 1.2; text-align: left; }
  body.v3d .chip i { flex: none; }
  /* The 2D page lets these be 36px tall; here every control reaches 44. */
  body.v3d .seat select, body.v3d #players { min-height: 44px; }
  body.v3d #players { min-width: 56px; }
  body.v3d #cube { display: none; }
  /* The cube is the 3D die on the board now; this is the same button as a plain "Roll" pill. */
  body.v3d #die { width: auto; min-width: 88px; height: 44px; margin: 0; padding: 0 18px; border-radius: 22px; perspective: none;
    background: var(--gold); color: #0b1a2b; font: inherit; font-size: 15px; font-weight: 700; }
  body.v3d #die::after { content: "Roll"; }
  body.v3d #die:disabled { opacity: .4; }
  @media (orientation: landscape) {
    /* 40vw keeps a 667px-wide phone's board window near square instead of 295px wide by 359px tall. */
    body.v3d { grid-template-columns: min(340px, 40vw) minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr); gap: 6px 12px; justify-items: stretch; }
    body.v3d h1 { grid-area: 1 / 1; justify-self: start; margin-left: 52px; font-size: 18px; }
    body.v3d #stage { grid-area: 1 / 2 / 3 / 3; height: 100%; }
    body.v3d #side { grid-area: 2 / 1; width: auto; max-height: none; min-height: 0; height: 100%; }
    body.v3d #view3 { grid-area: 1 / 1; }
    body.v3d .bar { width: auto; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body.v3d #side { display: grid; }
    body.v3d #side > .bar + .bar { margin-top: 0; }
    body.v3d #die { grid-area: 2 / 1; min-width: 84px; padding: 0 10px; margin: 0; align-self: start; }
    body.v3d #moves { display: flex; }
  }

  /* Someone who gets motion sick from a tilted plane can have it flat; the game is identical either way. */
  @media (prefers-reduced-motion: reduce) {
    :root { --tilt: 0deg; }
    #cube { transition: none; }
    .tok { transition: none; }
    .tok.can { animation: none; box-shadow: 0 0 0 3px #fff; }
  }
</style>
</head>
<body>
<style>
  /* dgames: the way back, identical in every game. Four games had no way out at all; the rest used a
     ~16px inline link, and strike-force's sat underneath the touch stick where the pad ate the tap.
     A dark disc with a light ring reads on a bright pastel scene and on a black one without being
     re-themed per game. z-index 50 sits above every game UI here (rush-lane and strike-force both use
     40, ludo game-over 20) and below the high-score prompt at 9999, which is modal and should stay on
     top. It was 15, which grep reported as present and the eye reported as missing in two games. */
  .dg-home { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(8, 18, 30, .72); border: 2px solid rgba(255, 255, 255, .62); color: #fff;
    font-size: 21px; line-height: 1; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .dg-home:hover, .dg-home:focus-visible { background: rgba(8, 18, 30, .92); border-color: #ffd54a; color: #ffd54a; }
</style>
<a class="dg-home" href="../index.html" title="All games" aria-label="Back to all games">&#8592;</a>
<h1>LU<span>DO</span></h1>
<div id="view3"><button id="camBtn" type="button" aria-label="Switch camera">Top</button><button id="dimBtn" type="button" title="Flat 2D board" aria-label="Switch to the flat 2D board">2D</button></div>
<div id="stage"><div id="board"></div><canvas id="c3d" aria-label="The Ludo board in 3D: tap a highlighted token to move it, tap the die to roll"></canvas></div>
<div id="side">
<div class="bar"><div id="turn"></div></div>
<div class="bar" id="rollBar">
  <button id="die" title="Roll the die" aria-label="Roll the die"><div id="cube">
    <div class="f f1">&#9856;</div><div class="f f2">&#9857;</div><div class="f f3">&#9858;</div>
    <div class="f f4">&#9859;</div><div class="f f5">&#9860;</div><div class="f f6">&#9861;</div>
  </div></button>
  <div id="moves"></div>
</div>
<div class="bar" id="hintBar"><div id="dieHint"></div></div>
<div class="bar"><div id="note"></div></div>
<div class="bar seats" id="seats"></div>
<div class="bar">
  <label class="seat">Players
    <select id="players"><option>2</option><option>3</option><option>4</option></select>
  </label>
  <button class="btn" id="newGame">New game</button>

</div>

</div>

<div class="over" id="over" hidden><div>
  <h2 id="overTitle">Game over</h2>
  <p id="overText"></p>
  <button class="btn" id="overAgain">Play again</button>
</div></div>

<script src="../lib/three.min.js"></script>
<script src="../lib/tabletop.js"></script>
<script>
'use strict';
// ---------- RULES (pure: no DOM and no randomness anywhere in this section) ----------
// A token's position is a single "progress" number along its own path, which keeps every rule a
// comparison rather than a coordinate lookup:
//   -1            in the yard
//   0 .. 50       on the shared 52-square ring, at ring index (START[player] + progress) % 52
//   51 .. 55      in that player's five-square home run, which no other player can enter
//   56            home
// A lap is 51 ring squares, not 52: the 52nd square of the loop is the one the player diverts off.
const YARD = -1, HOME = 56, RING_LEN = 52, LAST_RING = 50, PLAYERS_MAX = 4, TOKENS = 4;

// One arm of the cross, listed in travel order; rotating it 90 degrees three times gives the whole ring.
// The track turns diagonally at each of the four corners because the corner square belongs to the
// centre triangle, so consecutive ring cells are not always orthogonally adjacent.
const ARM = [[5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8], [0, 7], [0, 6], [1, 6], [2, 6], [3, 6], [4, 6], [5, 6]];
const rot = ([c, r]) => [14 - r, c];
const RING = [];
for (let i = 0, arm = ARM; i < 4; i++, arm = arm.map(rot)) RING.push(...arm);

  if (!window.Tabletop) return null;
  let q = null;
  try { q = new URLSearchParams(location.search).get('q'); } catch (e) { /* ignore */ }
  const kit = Tabletop.create({ canvas: $('c3d'), quality: q || 'auto', onTap: tap3d, onLost: () => setDim('2d', false) });
  if (!kit.ok) return { ok: false, reason: kit.reason };
  const THREE = kit.THREE, col = Tabletop.col;
  const N = 15, CELL = 2.8, B = N * CELL, BH = 1.8;
  // Print colours for the board face and the lacquer of the tokens: the four Ludo colours, kept saturated
  // enough to tell apart at a glance and pulled towards Penfight's pastels.
  const PRINT = ['#F07B7E', '#57BE8E', '#F6CB4B', '#6B97EC'];
  const LACQ = ['#E8474E', '#2FA36C', '#F4BC1C', '#3B76E0'];
  const INK = Tabletop.PALETTE.ink;
  kit.setDesk({ w: 70, d: 62 });

  const drawFace = (x, w, h, ppc) => {
    const cs = w / N, at = (c) => c * cs;
    x.fillStyle = '#FBF8F0'; x.fillRect(0, 0, w, h);
    const cell = (c, r, fill) => { x.fillStyle = fill; x.fillRect(at(c), at(r), cs, cs); };
    const line = Math.max(1.5, cs * 0.045);
    // yards: the owner's colour, a white court, four token circles
    YARD_AT.forEach(([yc, yr], p) => {
      x.fillStyle = PRINT[p]; x.fillRect(at(yc), at(yr), cs * 6, cs * 6);
      x.fillStyle = '#FFFDF7'; roundRect(x, at(yc + 0.8), at(yr + 0.8), cs * 4.4, cs * 4.4, cs * 0.5); x.fill();
      for (let t = 0; t < 4; t++) {
        const [sx, sy] = spotOf(p, t, YARD);
        x.beginPath(); x.arc(at(sx), at(sy), cs * 0.62, 0, Math.PI * 2);
        x.fillStyle = PRINT[p]; x.globalAlpha = 0.35; x.fill(); x.globalAlpha = 1;
        x.lineWidth = line; x.strokeStyle = PRINT[p]; x.stroke();
      }
    });
    // the ring, start squares, home runs
    RING.forEach(([c, r], i) => { const o = START.indexOf(i); cell(c, r, o >= 0 ? PRINT[o] : '#FFFFFF'); });
    HOME_RUN.forEach((run, p) => run.forEach(([c, r]) => cell(c, r, PRINT[p])));
    x.strokeStyle = 'rgba(43,47,92,.42)'; x.lineWidth = line;
    for (const [c, r] of RING) x.strokeRect(at(c), at(r), cs, cs);
    HOME_RUN.forEach((run) => run.forEach(([c, r]) => x.strokeRect(at(c), at(r), cs, cs)));
    // safe stars
    RING.forEach(([c, r], i) => {
      if (!SAFE.has(i)) return;
      star(x, at(c + 0.5), at(r + 0.5), cs * 0.36);
      x.fillStyle = START.indexOf(i) >= 0 ? 'rgba(255,255,255,.9)' : 'rgba(43,47,92,.55)'; x.fill();
    });
    // centre: four triangles, each in the colour of the run that finishes into it
    const C = [[6, 6], [9, 6], [9, 9], [6, 9]], mid = [at(7.5), at(7.5)];
    const tri = [[C[0], C[3]], [C[0], C[1]], [C[1], C[2]], [C[3], C[2]]];
    tri.forEach(([a, b], p) => {
      x.beginPath(); x.moveTo(at(a[0]), at(a[1])); x.lineTo(at(b[0]), at(b[1])); x.lineTo(mid[0], mid[1]); x.closePath();
      x.fillStyle = PRINT[p]; x.fill(); x.strokeStyle = 'rgba(43,47,92,.42)'; x.stroke();
    });
    // outer keyline and the yard borders
    x.lineWidth = line * 1.6; x.strokeStyle = 'rgba(43,47,92,.6)';
    x.strokeRect(line, line, w - 2 * line, h - 2 * line);
    YARD_AT.forEach(([yc, yr]) => x.strokeRect(at(yc), at(yr), cs * 6, cs * 6));
  };
  function roundRect(x, l, t, w, h, r) {
    x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
    x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
  }
  function star(x, cx, cy, R) {
    x.beginPath();
    for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * 0.45 : R; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    x.closePath();
  }
  const board = kit.board({ w: B, d: B, h: BH, radius: 1.2, bevel: 0.3, draw: drawFace, side: Tabletop.mat.paintedWood('#E2B987') });
  kit.add(board);

  // A token: one lathe — a flared base, a waisted body, a collar and a round head.
  const segs = kit.quality === 'high' ? 32 : 20;
  const prof = [[0, 0], [0.98, 0], [1.04, 0.1], [1.02, 0.26], [0.86, 0.42], [0.62, 0.66], [0.48, 1.05], [0.4, 1.45], [0.38, 1.62], [0.56, 1.7], [0.58, 1.8], [0.4, 1.9]];
  const HR = 0.56, HY = 2.36;
  for (let i = 1; i <= 8; i++) { const a = -Math.PI / 2 + Math.PI * (i / 8) * 0.92 - 0.25; prof.push([Math.max(0.001, Math.cos(a) * HR), HY + Math.sin(a) * HR]); }
  prof.push([0.001, HY + HR]);
  const tokGeo = new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r * 1.1, y * 1.08)), segs);
  const tokMat = LACQ.map((c) => Tabletop.mat.lacquer(c));
  const tok = [], at = [];
  for (let p = 0; p < PLAYERS_MAX; p++) {
    tok.push([]); at.push([]);
    for (let t = 0; t < TOKENS; t++) {
      const m = new THREE.Mesh(tokGeo, tokMat[p]);
      m.castShadow = true; m.receiveShadow = true;
      m.userData = { p, t, anim: false };
      kit.add(m); kit.pick.add(m, { p, t });
      tok[p].push(m); at[p].push(undefined);
    }
  }
  // Movable markers: a gold ring printed round the token's foot. Never more than four are needed.
  const ringGeo = new THREE.TorusGeometry(1.36, 0.14, 8, 36); ringGeo.rotateX(-Math.PI / 2);
  const ringMat = Tabletop.mat.lacquer('#FFD54A', { emissive: col('#FFB400'), emissiveIntensity: 0.35 });
  const rings = [0, 1, 2, 3].map(() => { const r = new THREE.Mesh(ringGeo, ringMat); r.visible = false; kit.add(r); return r; });

  const die = kit.makeDie({ size: 2.3, baseY: BH });
  die.show(1, 0.4);
  kit.add(die.mesh);
  kit.pick.add(die.mesh, { die: true });

  const world = ([sx, sy]) => [(sx - 7.5) * CELL, BH, (sy - 7.5) * CELL];
  const YAW = -Math.PI / 2;           // seat 1 (red, you) in the near-left corner
  kit.rig.setYaw(YAW, true);
  kit.rig.fit({ w: B + 1, d: B + 1, h: 3, instant: true });

  let animEnd = 0;
  const now = () => performance.now();
  const busyUntil = (ms) => { animEnd = Math.max(animEnd, now() + ms); };
  const stepMs = () => (isAiTurn() ? 105 : 125);

  // Finished tokens: spotOf fans them within a fifth of a square, which suits a flat disc with a tick on
  // it but would push four standing pieces into each other. Here they stand in a row along their wedge's
  // outer edge, at a little over half size, clear of the die in the middle.
  const HOME_SCALE = 0.6;
  function homeSpot(p, t) {
    const o = [-0.9, -0.3, 0.3, 0.9][t], e = 0.45;
    const xy = [[6 + e, 7.5 + o], [7.5 + o, 6 + e], [9 - e, 7.5 + o], [7.5 + o, 9 - e]][p];
    return world(xy);
  }
  function targetOf(p, t, g, seen) {
    if (g === HOME) return homeSpot(p, t);
    let [x, y] = spotOf(p, t, g);
    if (onRing(g)) { const k = ringIndexOf(p, g); const n = seen.get(k) || 0; seen.set(k, n + 1); if (n) { x += n * 0.18; y += n * 0.18; } }
    return world([x, y]);
  }
  function sync(movable, instant) {
    const seen = new Map(), captured = [];
    let moverMs = 0;
    for (let p = 0; p < PLAYERS_MAX; p++) for (let t = 0; t < TOKENS; t++) {
      const m = tok[p][t];
      if (p >= S.players) { m.visible = false; at[p][t] = undefined; continue; }
      m.visible = true;
      const g = S.tokens[p][t], prev = at[p][t], dest = targetOf(p, t, g, seen);
      m.userData.dest = dest;
      if (instant || prev === undefined) { m.position.set(dest[0], dest[1], dest[2]); m.scale.setScalar(g === HOME ? HOME_SCALE : 1); }
      else if (prev !== g) {
        if (g === YARD) captured.push(m);
        else {
          const pts = [[m.position.x, m.position.y, m.position.z]];
          if (prev === YARD) pts.push(dest);
          else { for (let k = prev + 1; k < g; k++) pts.push(world(spotOf(p, t, k))); pts.push(dest); }
          const ms = stepMs() * (pts.length - 1) * (prev === YARD ? 2.2 : 1);
          moverMs = Math.max(moverMs, ms);
          m.userData.anim = true;
          kit.hop(m, pts, { height: prev === YARD ? 3.2 : 1.5, stepMs: ms / (pts.length - 1) }).then(() => {
            m.userData.anim = false;
            if (g === HOME) kit.tween({ ms: 220, ease: 'outBack', update: (k) => m.scale.setScalar(1 + (HOME_SCALE - 1) * k) });
          });
        }
      } else if (!m.userData.anim && m.position.distanceTo(new THREE.Vector3(dest[0], dest[1], dest[2])) > 0.01) {
        const a = m.position.clone();
        kit.tween({ ms: 160, ease: 'outCubic', update: (k) => m.position.set(a.x + (dest[0] - a.x) * k, a.y, a.z + (dest[2] - a.z) * k) });
      }
      at[p][t] = g;
    }
    // A captured token waits for the capturing hop to land, shivers, then arcs back to its yard.
    if (captured.length) {
      const flyMs = 620;
      busyUntil(moverMs + 260 + flyMs);
      setTimeout(() => {
        for (const m of captured) {
          m.userData.anim = true;
          kit.shake(m, { amp: 0.35, ms: 220 })
            .then(() => kit.fly(m, m.userData.dest, { ms: flyMs, height: 9, spin: 1 }))
            .then(() => { m.rotation.y = 0; m.userData.anim = false; });
        }
      }, kit.reducedMotion ? 0 : moverMs);
    }
    busyUntil(moverMs);
    // markers under the tokens that can move, only on a human turn
    let i = 0;
    if (movable && !isAiTurn()) for (const key of movable.keys()) {
      const [p, t] = key.split(':').map(Number), d = tok[p][t].userData.dest;
      rings[i].position.set(d[0], BH + 0.05, d[2]); rings[i].visible = true; i++;
    }
    for (; i < rings.length; i++) rings[i].visible = false;
    kit.invalidate();
  }
  // The die is thrown from the corner of whoever is rolling and lands in the middle of the board.
  function roll(n) {
    const [yc, yr] = YARD_AT[S.player];
    const from = world([yc + 3, yr + 3]);
    const ms = 640;
    busyUntil(ms);
    die.roll(n, { from: [from[0] * 0.75, from[2] * 0.75], to: [(Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.6], ms, yaw: YAW + (Math.random() - 0.5) * 0.5, height: 5 })
;
  }
  function screenOf(obj) {
    const v = obj.getWorldPosition(new THREE.Vector3()); v.y += 1.2; v.project(kit.camera);
    const r = kit.canvas.getBoundingClientRect();
    return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
  }
  return {
    ok: true, kit, die, tok, rings, sync, roll, screenOf,
    reset() { kit.finishAll(); for (let p = 0; p < PLAYERS_MAX; p++) for (let t = 0; t < TOKENS; t++) at[p][t] = undefined; animEnd = 0; },
    busyMs: () => Math.max(0, animEnd - now()),
    finish() { kit.finishAll(); animEnd = 0; },
    setCam(name, instant) { kit.rig.setView(name, { instant }); },
  };
}

// A tap on the board: the token under the finger if it can move, else the die if it can be rolled.
function tap3d(x, y) {
  if (!V3) return;
  const hit = V3.kit.pick.at(x, y, { filter: (d) => d.die ? !$('die').disabled : (d.p === S.player && pending.some((m) => m.token === d.t) && !isAiTurn()) });
  if (!hit) return;
  if (hit.die) doRoll(); else onTokenTap(hit.p, hit.t);
}

let view3d = null;     // the built view, kept while switching back and forth
function setDim(dim, remember) {
  if (dim === '3d' && !view3d) {
    // Anything that goes wrong building the scene leaves the 2D game playable rather than a blank page.
    try { view3d = makeView3d(); } catch (e) { view3d = { ok: false, reason: String(e) }; try { console.warn('3D view failed, using 2D:', e); } catch (e2) { /* ignore */ } }
    if (!view3d || !view3d.ok) {
      // No WebGL (or ?no3d): the 2D board is the game, and the 3D button goes away rather than failing.
      $('to3d').hidden = true;
      V3 = null; document.body.classList.remove('v3d');
      return;
    }
  }
  const on = dim === '3d' && view3d && view3d.ok;
  document.body.classList.toggle('v3d', !!on);
  V3 = on ? view3d : null;
  $('to3d').hidden = on || (view3d && !view3d.ok);
  if (remember) { viewPref.dim = on ? '3d' : '2d'; saveView(); }
  if (on) {
    V3.kit.resize();
    setCam(camDefault(), false, true);
    V3.reset(); render();
  }
}
function setCam(name, remember, instant) {
  if (!V3) return;
  V3.setCam(name, instant);
  if (remember) { viewPref.cam = name; saveView(); }
  $('camBtn').textContent = name === 'top' ? 'Angled' : 'Top';
  $('camBtn').setAttribute('aria-label', name === 'top' ? 'Tilt the camera to an angled view' : 'Look straight down at the board');
}
$('camBtn').addEventListener('click', () => setCam(V3 && V3.kit.rig.view === 'top' ? 'angled' : 'top', true));
$('dimBtn').addEventListener('click', () => setDim('2d', true));
$('to3d').addEventListener('click', () => setDim('3d', true));
// Turning a phone over changes the default camera, unless someone picked one.
addEventListener('resize', () => { if (V3 && !viewPref.cam) setCam(camDefault(), false); });
// For the browser checks: read the state, force the dice, drive a turn. Nothing in the game uses it.
globalThis.__ludo3d = { get V3() { return V3; }, get S() { return S; }, get pending() { return pending; }, setDim, setCam, render, doRoll, choose,
  setRnd(f) { rnd = f; } };

buildBoard();
$('die').addEventListener('click', doRoll);
$('newGame').addEventListener('click', newGame);
$('overAgain').addEventListener('click', newGame);
$('players').addEventListener('change', newGame);
$('to3d').hidden = !window.Tabletop;
if (viewPref.dim !== '2d') setDim('3d', false);
newGame();
</script>
</body>
</html>
