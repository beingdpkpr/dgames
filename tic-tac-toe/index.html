<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b1a2b">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dgames">
<meta name="mobile-web-app-capable" content="yes">
<script>
  /* Installable, and playable with no network once a game has been opened. Registered from every page so
     a deep link into one game works offline too, not only a visit that started at the launcher. Over
     file:// there is no service worker and register() rejects; the catch keeps that silent. */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
<title>Tic-tac-toe</title>
<style>
  :root { --bg: #0b1a2b; --panel: #10233a; --line: #456f9e; --gold: #ffd54a; --x: #4fc3f7; --o: #ff8a65; --win: #66bb6a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
  main { width: min(440px, 94vw); display: flex; flex-direction: column; gap: 14px; padding: 16px 0; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 30px; letter-spacing: 2px; margin: 0; }
  h1 span { color: var(--gold); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  .row label { opacity: .8; font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; color: #fff; border: 0; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 14px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--gold); color: #0b1a2b; font-weight: 600; }
  #status { text-align: center; font-size: 18px; min-height: 26px; }
  #status .x { color: var(--x); font-weight: 700; }
  #status .o { color: var(--o); font-weight: 700; }
  #board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; aspect-ratio: 1; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font-size: clamp(48px, 14vw, 84px); line-height: 1; font-weight: 700; cursor: pointer; color: #fff; display: grid; place-items: center; transition: background .12s, transform .08s; user-select: none; }
  .cell:hover:not(:disabled) { border-color: var(--gold); }
  .cell:active:not(:disabled) { transform: scale(.96); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: #1c3b2a; border-color: var(--win); }
  .cell.last { box-shadow: inset 0 0 0 2px rgba(255,213,74,.5); }
  .cell.pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #score { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; }
  #score b { display: block; font-size: 24px; }
  #score small { opacity: .7; }
  #streak { font-size: 13px; opacity: .8; text-align: center; margin-bottom: 8px; }
  #streak b { color: var(--gold); }
  .btns { display: flex; gap: 8px; justify-content: center; }
  .btn { background: var(--gold); color: #0b1a2b; border: 0; border-radius: 10px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid var(--line); font-weight: 400; }
  .btn:hover { filter: brightness(1.08); }
  .hint { text-align: center; font-size: 12px; opacity: .55; }
  @media (prefers-reduced-motion: reduce) {
    .cell, .cell span { animation-duration: .01ms !important; }
  }
  /* The back button is a fixed 44px circle at top-left. Below 700px the title starts at the screen edge, so the button landed on
     top of it. Reserve the space rather than moving the button — it is the same control in all nine
     games and that is worth more than any one layout. */
  @media (max-width: 700px) { h1 { padding-left: 56px; } }
  /* The two wrappers exist only for the landscape layout below; everywhere else they are not boxes at all, so
     portrait and desktop lay out exactly as they did before the wrappers were added. */
  .side-a, .side-b { display: contents; }
  /* A phone on its side. The board was sized from width and capped at 440px, so on 844x390 and 667x375
     it was 440 tall under ~270px of title and settings: 73-76% of it below the fold, ~650px of page scroll,
     only the top edge of the first row showing. Here the board is sized from the height instead
     (100dvh less the 8px top and bottom padding: 374px at 844x390, 359px at 667x375) and sits on the right;
     title, status and settings take the column on its left. The rest (buttons, score, streak, high-score
     table) goes underneath and that part scrolls inside its own box, so the page itself never does and
     New game stays on screen. Right, not left, because the back button owns the top-left corner.
     Every control is lifted to 44px here: the segmented buttons were 33px tall, New game 41. */
  /* Everywhere but a sideways phone (which has its own layout below): New game goes straight under the board. It used to sit after the score and the
     streak / high-score panel, at y=858 on a 667px screen, so every rematch began with a scroll. Moving it
     up alone was not enough -- it would still end 12px (375x667) and 24px (360x640) off the bottom -- so
     the board is also capped by height: everything above it is 271px, the button row and gaps below it
     63px. At 360x640 that takes the board from 338 to 306px, cells 112 -> 102px, which a 3x3 grid does
     not miss; wherever width was already the limit (390x844 and up) nothing changes. Score, streak and
     high scores stay below the fold, where reaching them by scrolling costs nothing. */
  @media not all and (orientation: landscape) and (max-height: 500px) {
    .btns { order: 1; }
    #score, .side-b > .panel, .hint { order: 2; }
    #board { width: min(100%, calc(100vh - 334px)); align-self: center; }
    @supports (height: 100dvh) { #board { width: min(100%, calc(100dvh - 334px)); } }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body { display: block; min-height: 0; }
    main { --bd: min(calc(100vh - 16px), calc(100vw - 290px)); width: auto; height: 100vh;
      padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      display: grid; grid-template-columns: minmax(0, 440px) var(--bd); grid-template-rows: auto minmax(0, 1fr);
      justify-content: center; gap: 8px 16px; }
    @supports (height: 100dvh) {
      main { --bd: min(calc(100dvh - 16px), calc(100vw - 290px)); height: 100dvh; }
    }
    .side-a, .side-b { display: flex; flex-direction: column; gap: 6px; grid-column: 1; min-width: 0; }
    .side-a { grid-row: 1; }
    .side-b { grid-row: 2; min-height: 0; overflow-y: auto; }
    #board { grid-column: 2; grid-row: 1 / 3; width: var(--bd); height: var(--bd); align-self: center; gap: 6px; }
    .cell { font-size: clamp(36px, 19vh, 84px); }
    header { order: -2; min-height: 44px; align-items: center; }
    h1 { font-size: 24px; padding-left: 56px; }
    #status { order: -1; font-size: 16px; min-height: 22px; text-align: left; }
    .panel { padding: 6px 10px; }
    /* At 667x375 the side column is 268px: "First move" plus its three buttons wants ~255 inside a 246px panel,
       and the buttons were the ones squeezed, text touching the dividers. Let the label break onto two
       lines instead; the row is 44px tall for the buttons anyway, so that costs no height. */
    .row { flex-wrap: nowrap; gap: 8px; }
    .seg { flex-shrink: 0; }
    .row + .row { margin-top: 4px; }
    .row label { font-size: 13px; line-height: 1.2; min-width: 0; }
    .seg button { min-width: 44px; min-height: 44px; padding: 0 9px; font-size: 13px; }
    .btns { order: -1; }
    .btn { min-height: 44px; }
    #score b { font-size: 18px; }
    #score small { font-size: 12px; }
  }
  /* ---- 3D table (body.v3d), drawn by ../lib/tabletop.js. The 2D grid stays the fallback when WebGL is
     missing and the choice for anyone who prefers it; nothing in this block applies without .v3d. The
     stage is the board's own square, so every layout above (portrait, a phone on its side, desktop) sizes
     the 3D board exactly as it sizes the 2D one: the grid's cells stay in place, invisible, and the canvas
     covers them. */
  #c3d, #view3 { display: none; }
  body.v3d #board { position: relative; }
  body.v3d .cell { visibility: hidden; }
  body.v3d #c3d { display: block; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 14px; touch-action: none; outline: none;
    cursor: pointer; z-index: 1; }
  body.v3d #view3 { display: flex; position: absolute; top: 8px; right: 8px; gap: 6px; z-index: 2; }
  #view3 button { min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid rgba(43, 47, 92, .25);
    background: rgba(255, 255, 255, .82); color: #2B2F5C; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  #view3 button:hover { background: #fff; }
  /* In 2D, a 3D button at the right of the title. Taken out of the flow so the header is exactly as tall
     as it was and the height-capped board above loses nothing. */
  header { position: relative; }
  #to3d { position: absolute; right: 0; top: 50%; transform: translateY(-50%); min-width: 44px; min-height: 44px; padding: 0 10px;
    border-radius: 22px; border: 1px solid var(--line); background: transparent; color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  #to3d:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
<style>
  /* dgames: the way back, identical in every game. Four games had no way out at all; the rest used a
     ~16px inline link, and strike-force's sat underneath the touch stick where the pad ate the tap.
     A dark disc with a light ring reads on a bright pastel scene and on a black one without being
     re-themed per game. z-index 50 sits above every game UI here (rush-lane and strike-force both use
     40, ludo game-over 20) and below the high-score prompt at 9999, which is modal and should stay on
     top. It was 15, which grep reported as present and the eye reported as missing in two games. */
  .dg-home { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(8, 18, 30, .72); border: 2px solid rgba(255, 255, 255, .62); color: #fff;
    font-size: 21px; line-height: 1; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .dg-home:hover, .dg-home:focus-visible { background: rgba(8, 18, 30, .92); border-color: #ffd54a; color: #ffd54a; }
</style>
<a class="dg-home" href="../index.html" title="All games" aria-label="Back to all games">&#8592;</a>
<main>
  <div class="side-a">
  <header>
    <h1>TIC<span>TAC</span>TOE</h1>
    <button id="to3d" type="button" title="3D board" aria-label="Show the 3D board" hidden>3D</button>
  </header>

  <div class="panel">
    <div class="row">
      <label>You play</label>
      <div class="seg" id="segSide"><button data-v="X" class="on">X</button><button data-v="O">O</button></div>
    </div>
    <div class="row">
      <label>First move</label>
      <div class="seg" id="segFirst"><button data-v="you" class="on">You</button><button data-v="ai">Computer</button><button data-v="alt">Alternate</button></div>
    </div>
    <div class="row">
      <label>Computer</label>
      <div class="seg" id="segLevel"><button data-v="easy">Easy</button><button data-v="normal" class="on">Normal</button><button data-v="hard">Hard</button></div>
    </div>
  </div>

  <div id="status"></div>
  </div>
  <div id="board"><canvas id="c3d" aria-label="The board in 3D: tap a square to play. Drag to tilt, pinch to zoom."></canvas><div id="view3"><button id="camBtn" type="button" aria-label="Look straight down at the board">Top</button><button id="dimBtn" type="button" title="Flat 2D board" aria-label="Switch to the flat 2D board">2D</button></div></div>

  <div class="side-b">
  <div class="panel" id="score">
    <div><b id="sYou">0</b><small>You</small></div>
    <div><b id="sDraw">0</b><small>Draws</small></div>
    <div><b id="sAi">0</b><small>Computer</small></div>
  </div>
  <div class="panel"><div id="streak"></div><div id="hiscores"></div></div>

  <div class="btns">
    <button class="btn" id="newGame">New game</button>
    <button class="btn ghost" id="resetScore">Reset score</button>
  </div>
  <div class="hint">Keys 1&ndash;9 play a square (numpad layout), N starts a new game.</div>
  </div>
</main>

<script src="../lib/three.min.js"></script>
<script src="../lib/tabletop.js"></script>
<script>
'use strict';
// ---------- dgames high scores ----------
// Shared snippet, pasted verbatim into every game (games stay self-contained). Keeps a top-N table per
// key in localStorage against the player's name, which is shared by every game. Usage:
//   const hs = makeHiScores({ key: 'duck-hunt', order: 'desc', max: 10, label: v => v + ' pts' });
//   if (hs.rank(score) >= 0) hs.prompt(score, 'round 7').then(() => hs.render(document.getElementById('scores')));
//   hs.render(el)                       // table of the current list
// `order` is 'desc' (bigger is better) or 'asc' (smaller is better, e.g. shots or seconds).
// The overlay keeps key events away from the game while it is open. Styling comes from the hs-* classes
// below; override the --hs-* custom properties to match a game's palette.
// The name lives at `dgames.player` and is asked for once, then reused everywhere. It used to be three
// letters read by a window keydown listener into three spans, with nothing focusable on the card -- so a
// phone had no keyboard to summon and no way to enter a name at all, and every mobile score saved "AAA".
// One name for the whole collection rather than one per game.
const HS_PLAYER_KEY = 'dgames.player';
const hsPlayer = () => { try { return (localStorage.getItem(HS_PLAYER_KEY) || '').trim().slice(0, 12); } catch (e) { return ''; } };
const hsSetPlayer = (n) => { try { localStorage.setItem(HS_PLAYER_KEY, n); } catch (e) {} };

function makeHiScores({ key, order = 'desc', max = 10, label = v => String(v), title = 'High scores' }) {
  const KEY = 'dgames.hiscores.' + key;
  const load = () => { try { const l = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } };
  const save = (l) => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} };
  const cmp = (a, b) => (order === 'desc' ? b.value - a.value : a.value - b.value) || a.time - b.time;
  const sorted = (l) => l.slice().sort(cmp);
  const better = (v, e) => order === 'desc' ? v > e.value : v < e.value;
  // 0-based position a value would take, or -1 if it misses the table
  function rank(value) { const l = sorted(load()); let i = 0; while (i < l.length && !better(value, l[i])) i++; return i < max ? i : -1; }
  // The field is still called `initials`: entries saved before this held three letters under that key,
  // and renaming it would orphan every score already on someone's device.
  function add(value, initials, detail) {
    const e = { value, initials: String(initials || 'Player').trim().slice(0, 12).trim() || 'Player', detail: detail || '', time: Date.now() };
    const l = sorted(load().concat([e])).slice(0, max); save(l); return e;
  }
  const list = () => sorted(load());
  const clear = () => save([]);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function ensureStyle() {
    if (document.getElementById('hs-style')) return;
    const st = document.createElement('style'); st.id = 'hs-style';
    st.textContent = `
      .hs-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(3,10,20,.72);font-family:var(--hs-font,"Segoe UI",system-ui,sans-serif);color:var(--hs-fg,#fff)}
      .hs-card{background:var(--hs-bg,#10233a);border:1px solid var(--hs-line,#2c4a6e);border-radius:16px;padding:22px 26px;width:min(360px,92vw);text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.45)}
      .hs-card h2{margin:0 0 4px;font-size:22px;letter-spacing:2px;color:var(--hs-accent,#ffd54a)}
      .hs-card .hs-val{font-size:30px;font-weight:700;margin:6px 0 2px}
      .hs-card .hs-detail,.hs-card .hs-hint{opacity:.7;font-size:13px}
      .hs-card .hs-rank{margin:4px 0 14px;font-size:14px}
      .hs-name{display:block;width:100%;margin:8px 0 16px;padding:12px 14px;min-height:48px;box-sizing:border-box;text-align:center;
        border:2px solid var(--hs-line,#2c4a6e);border-radius:10px;background:rgba(0,0,0,.25);color:inherit;font:inherit;font-size:22px;font-weight:700}
      .hs-name:focus{outline:none;border-color:var(--hs-accent,#ffd54a)}
      .hs-btns{display:flex;gap:8px;justify-content:center}
      .hs-btns button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;background:var(--hs-accent,#ffd54a);color:#0b1a2b}
      .hs-btns button.hs-ghost{background:transparent;color:var(--hs-fg,#fff);border:1px solid var(--hs-line,#2c4a6e);font-weight:400}
      .hs-btns button:focus-visible{outline:2px solid var(--hs-fg,#fff);outline-offset:2px}
      .hs-table{width:100%;border-collapse:collapse;font-family:var(--hs-font,"Segoe UI",system-ui,sans-serif);color:var(--hs-fg,#fff);font-variant-numeric:tabular-nums}
      .hs-table caption{text-align:left;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7;padding:0 0 6px}
      .hs-table td{padding:4px 6px;border-top:1px solid var(--hs-line,#2c4a6e);font-size:14px}
      .hs-table td:first-child{opacity:.6;width:2em;text-align:right}
      .hs-table td.hs-ini{font-weight:700;max-width:9ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .hs-table td.hs-score{text-align:right;color:var(--hs-accent,#ffd54a);font-weight:600}
      .hs-table td.hs-d{opacity:.65;font-size:12px}
      .hs-table tr.hs-new td{background:rgba(255,213,74,.12)}
      .hs-table td.hs-empty{opacity:.55;text-align:center;padding:10px}`;
    document.head.appendChild(st);
  }
  // Modal asking for the player's name, prefilled from `dgames.player` so it is typed once, ever.
  // Resolves with the saved entry, or null if skipped. Only call when rank(value) >= 0.
  function prompt(value, detail) {
    ensureStyle();
    return new Promise((resolve) => {
      const r = rank(value);
      const known = hsPlayer();
      const ov = document.createElement('div'); ov.className = 'hs-overlay';
      ov.innerHTML = `<div class="hs-card" role="dialog" aria-label="New high score"><h2>NEW HIGH SCORE</h2>
        <div class="hs-val">${esc(label(value))}</div><div class="hs-detail">${esc(detail || '')}</div>
        <div class="hs-rank">#${r + 1} on this device</div>
        <label class="hs-hint" for="hs-name-input">Your name</label>
        <input class="hs-name" id="hs-name-input" type="text" maxlength="12" autocomplete="nickname" autocapitalize="words" spellcheck="false" placeholder="Player" value="${esc(known)}">
        <div class="hs-btns"><button class="hs-ok" type="button">Save</button><button class="hs-ghost hs-skip" type="button">Skip</button></div></div>`;
      document.body.appendChild(ov);
      const input = ov.querySelector('.hs-name');
      const done = (ok) => {
        window.removeEventListener('keydown', outside, true); window.removeEventListener('keyup', outside, true); window.removeEventListener('keypress', outside, true);
        const name = (input.value || '').trim().slice(0, 12);
        ov.remove();
        if (ok && name) hsSetPlayer(name);
        resolve(ok ? add(value, name || known || 'Player', detail) : null);
      };
      // Game key handlers sit on window in the bubble phase, so stopping the event at the field lets the
      // character land while keeping the player from also jumping or firing as they type their name.
      const field = (e) => {
        e.stopPropagation();
        if (e.type !== 'keydown') return;
        if (e.key === 'Enter') { e.preventDefault(); done(true); }
        else if (e.key === 'Escape') { e.preventDefault(); done(false); }
      };
      input.addEventListener('keydown', field); input.addEventListener('keyup', field); input.addEventListener('keypress', field);
      // Anything typed while the field is not focused still must not reach the game underneath.
      const outside = (e) => {
        if (e.target === input) return;
        e.stopPropagation(); e.preventDefault();
        if (e.type !== 'keydown') return;
        if (e.key === 'Enter') done(true); else if (e.key === 'Escape') done(false);
      };
      window.addEventListener('keydown', outside, true); window.addEventListener('keyup', outside, true); window.addEventListener('keypress', outside, true);
      ov.querySelector('.hs-ok').addEventListener('click', () => done(true));
      ov.querySelector('.hs-skip').addEventListener('click', () => done(false));
      // A name already known means there is nothing to type, so focus Save and leave the on-screen
      // keyboard shut; a first-time player gets the field focused and selected instead.
      if (known) ov.querySelector('.hs-ok').focus(); else { input.focus(); input.select(); }
    });
  }
  // Renders the table into el; the entry whose time equals `newTime` is highlighted.
  function render(el, newTime) {
    ensureStyle();
    const l = list();
    const rows = l.length ? l.map((e, i) => `<tr${e.time === newTime ? ' class="hs-new"' : ''}><td>${i + 1}</td><td class="hs-ini">${esc(e.initials)}</td><td class="hs-score">${esc(label(e.value))}</td><td class="hs-d">${esc(e.detail)}</td></tr>`).join('')
      : `<tr><td class="hs-empty" colspan="4">No scores yet. Be the first.</td></tr>`;
    el.innerHTML = `<table class="hs-table"><caption>${esc(title)}</caption><tbody>${rows}</tbody></table>`;
  }
  return { key, rank, add, list, clear, prompt, render };
}

// ---------- pure game logic (no DOM; exported for tests at the bottom) ----------
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const other = (p) => (p === 'X' ? 'O' : 'X');
function winLine(b) { for (const L of LINES) { const [a, c, d] = L; if (b[a] && b[a] === b[c] && b[a] === b[d]) return L; } return null; }
function winner(b) { const L = winLine(b); return L ? b[L[0]] : null; }
function empties(b) { const r = []; for (let i = 0; i < 9; i++) if (!b[i]) r.push(i); return r; }
function isOver(b) { return !!winner(b) || empties(b).length === 0; }

    warmed = true;
    const tmp = [makePiece(0, 'X'), makePiece(1, 'O')], was = [glow.visible, core.visible, lastMark.visible];
    glow.visible = core.visible = lastMark.visible = true;
    try { kit.renderer.compile(kit.scene, kit.camera); } catch (e) { /* only a warm-up */ }
    [glow.visible, core.visible, lastMark.visible] = was;
    for (const pc of tmp) kit.scene.remove(pc.outer);
  }
  // The camera frames the board with a strip of desk above it, so the view buttons in the stage's top
  // corner sit on the desk rather than on the far squares.
  function fit(instant) {
    const top = kit.rig.view === 'top', strip = top ? 2.6 : 0.6;
    kit.rig.fit({ w: B + 0.6, d: B + 0.6 + strip, cz: -strip / 2, h: PH + 0.6, margin: 0.97, instant });
    if (instant) kit.rig.step(1 / 60);
  }

  return {
    ok: true, kit, reset, placed, won, drew, cleared, cellAt, screenOf,
    resize() { kit.resize(); fit(true); },
    setCam(name, instant) { kit.rig.setView(name, { instant }); fit(!!instant); },
    get cam() { return kit.rig.view; },
    probe: { get pieces() { return pieces; }, gone, glow, core, lastMark, TOP, B },
  };
}

// A tap on the 3D board: the same as a press on that square of the 2D grid.
function tap3d(x, y) {
  if (!V3) return;
  const i = V3.cellAt(x, y);
  if (i < 0) return;
  // The kit reports a tap on pointer-up, and the browser still sends that press's click afterwards, to
  // whatever is under the finger by then. The one click this tap still owes is dropped.
  const kill = (e) => { e.stopPropagation(); e.preventDefault(); off(); };
  const off = () => { removeEventListener('click', kill, true); clearTimeout(t); };
  addEventListener('click', kill, true);
  const t = setTimeout(off, 600);
  humanPlay(i);
}

function setDim(dim, remember) {
  if (dim === '3d' && !view3d && can3d()) {
    // Anything that goes wrong building the scene leaves the 2D game playable rather than a blank board.
    try { view3d = makeView3d(); } catch (e) { view3d = { ok: false, reason: String(e) }; try { console.warn('3D board failed, using 2D:', e); } catch (e2) { /* ignore */ } }
  }
  const on = dim === '3d' && !!view3d && view3d.ok && !lost3d;
  document.body.classList.toggle('v3d', on);
  V3 = on ? view3d : null;
  if (remember) { viewPref.dim = on ? '3d' : '2d'; saveView(); }
  $('to3d').hidden = on || !can3d();
  if (on) { setCam(camDefault(), false, true); V3.reset(); }
}
function setCam(name, remember, instant) {
  if (!V3) return;
  V3.setCam(name, instant);
  if (remember) { viewPref.cam = name; saveView(); }
  $('camBtn').textContent = name === 'top' ? 'Angled' : 'Top';
  $('camBtn').setAttribute('aria-label', name === 'top' ? 'Tilt the camera to an angled view' : 'Look straight down at the board');
}
$('camBtn').addEventListener('click', () => setCam(V3 && V3.cam === 'top' ? 'angled' : 'top', true));
$('dimBtn').addEventListener('click', () => setDim('2d', true));
$('to3d').addEventListener('click', () => setDim('3d', true));
// Two quick taps on the board are two taps, not the kit's "reset the camera": that stays for a double
// click off the squares.
$('board').addEventListener('dblclick', (e) => { if (V3 && V3.cellAt(e.clientX, e.clientY) >= 0) e.stopPropagation(); }, true);
// Turning a phone over changes the default camera, unless someone picked one.
addEventListener('resize', () => { if (V3 && !viewPref.cam) setCam(camDefault(), false); });
// For the Playwright checks: read-only views and the entry points they drive.
window.__ttt3 = { get V3() { return V3; }, get view3d() { return view3d; }, setDim, setCam };

// ---------- boot ----------
newGame();
renderHiScores();
// 3D by default wherever WebGL works; 2D if that was the last choice, or as the fallback.
$('to3d').hidden = !can3d();
if (viewPref.dim !== '2d' && can3d()) setDim('3d', false);

globalThis.__ttt = { LINES, winner, winLine, empties, isOver, completing, minimax, bestMoves, aiMove, other, applyStreak };
</script>
</body>
</html>
