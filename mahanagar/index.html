<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b1a2b">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dgames">
<meta name="mobile-web-app-capable" content="yes">
<script>
  /* Installable, and playable with no network once a game has been opened. Registered from every page so
     a deep link into one game works offline too, not only a visit that started at the launcher. Over
     file:// there is no service worker and register() rejects; the catch keeps that silent. */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
<meta name="description" content="Mahanagar: a property-trading board game across eight Indian cities. Two to six players, each seat human or computer.">
<title>Mahanagar</title>
<!-- Rozha One for the logo, the deed titles and the card faces only. Offline or blocked it falls back to
     Georgia, and every size still fits: the layout is computed from the board size, not the font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
<style>
  :root {
    /* A navy table, a cream board, a deep teal centre with gold. The board is the brightest thing on the
       screen on purpose: it is what you play on, and everything around it stays dark and quiet. */
    --bg: #0b1a2b; --panel: #11263d; --panel2: #173250; --line: #2c4a6e; --muted: #93abc7; --fg: #f3f6fb;
    --gold: #ffd54a; --good: #45c27a; --bad: #ff6b6b;
    --paper: #f6eedc; --paper2: #efe3c8; --ink: #2b2118; --grid: #b9a582; --teal: #0f3d3b; --teal2: #165754;
    --e: 30px; --c: 45px; --bs: 360px;
    --serif: "Rozha One", Georgia, "Times New Roman", serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .42; cursor: default; }

  /* ---- app frame: JS sets the board size and which way the panel sits (see layout()) ---- */
  #app { position: fixed; inset: 0; display: flex; gap: 8px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  #app.portrait { flex-direction: column; align-items: center; }
  #app.landscape { flex-direction: row; justify-content: center; align-items: center; }
  #side { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  #app.portrait #side { width: var(--bs); flex: 1; }
  #app.landscape #side { height: var(--bs); flex: 0 1 460px; min-width: 250px; }
  #app.portrait #top { order: -1; }
  #top { display: flex; align-items: center; gap: 8px; height: 46px; flex: none; padding-left: 52px; }
  #app.portrait #top { width: 100%; max-width: var(--bs); }
  #app.landscape #top { width: 100%; }
  .logo { font-family: var(--serif); font-weight: 400; font-size: 24px; letter-spacing: 2px; margin: 0; color: var(--gold); line-height: 1; flex: 1; }
  .logo small { display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 10px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }
  .iconbtn svg { width: 22px; height: 22px; }

  /* ---- the board ---- */
  #board { position: relative; width: var(--bs); height: var(--bs); flex: none; display: grid;
    grid-template-columns: var(--c) repeat(9, var(--e)) var(--c); grid-template-rows: var(--c) repeat(9, var(--e)) var(--c);
    background: var(--paper2); border-radius: calc(var(--e) * .28); box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 2px #8f7b58;
    color: var(--ink); user-select: none; -webkit-user-select: none; }
  .sp { position: relative; border: .5px solid var(--grid); background: var(--paper); overflow: hidden; cursor: pointer; padding: 0; color: var(--ink); font: inherit; }
  .sp:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; z-index: 2; }
  .sp .in { position: absolute; left: 50%; top: 50%; width: var(--e); height: var(--c); transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    display: flex; flex-direction: column; align-items: center; }
  .sp.corner .in { width: var(--c); height: var(--c); justify-content: center; }
  .sp.s-left { --rot: 90deg; } .sp.s-top { --rot: 180deg; } .sp.s-right { --rot: -90deg; }
  .sp.corner { --rot: 0deg; }
  .band { width: 100%; height: 24%; flex: none; position: relative; border-bottom: .5px solid rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; gap: 1px; }
  .lbl { font-size: calc(var(--e) * .18); line-height: 1.05; text-align: center; font-weight: 600; padding: 1px 1px 0; word-break: break-word; hyphens: auto; color: #3a2c1d; }
  .price { font-size: calc(var(--e) * .24); font-weight: 700; margin-top: auto; margin-bottom: 9%; color: #4a3925; }
  .sp .ico { width: 62%; height: 38%; margin-top: 8%; flex: none; }
  .sp.corner .ico { width: 58%; height: 58%; margin: 0; }
  .sp.corner .lbl { font-size: calc(var(--e) * .24); font-weight: 800; letter-spacing: .3px; }
  .sp .lbl.small { display: none; }
  #board.roomy .sp .lbl.small { display: block; }
  /* Owner marker: a disc in the owner's colour at the outer edge, so it never mixes with the group band
     at the inner edge even when owner and group are both red. */
  .owner { position: absolute; bottom: 4%; left: 50%; width: min(34%, 15px); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%;
    border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
  .sp.owned .price { visibility: hidden; }
  .sp.mort::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(60,40,20,.28) 0 3px, transparent 3px 7px); pointer-events: none; }
  .house { width: 18%; aspect-ratio: 1; background: #2ecc71; border: 1px solid #0b5e2e; border-radius: 1.5px; }
  .hotel { width: 52%; height: 62%; background: #e74c3c; border: 1px solid #7a1a12; border-radius: 2px; }
  .sp.pop { animation: pop .5s ease-out; }
  @keyframes pop { 0% { filter: brightness(1.6); } 100% { filter: none; } }
  .sp.hilite { box-shadow: inset 0 0 0 3px var(--gold); z-index: 1; }

  /* centre */
  #center { grid-column: 2 / 11; grid-row: 2 / 11; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, var(--teal2), var(--teal) 70%); border: .5px solid var(--grid);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f6f0e0; }
  #center .orn { position: absolute; inset: 6%; opacity: .16; pointer-events: none; }
  .brand { font-family: var(--serif); color: var(--gold); font-size: calc(var(--e) * 1.05); letter-spacing: calc(var(--e) * .05); line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .tag { font-size: calc(var(--e) * .3); letter-spacing: 3px; text-transform: uppercase; color: #cfe3dc; margin-top: 4px; }
  #dice { display: flex; gap: calc(var(--e) * .45); margin: calc(var(--e) * .45) 0 calc(var(--e) * .3); perspective: 600px; }
  .die { width: calc(var(--e) * 1.05); height: calc(var(--e) * 1.05); position: relative; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; background: #fffdf7; border-radius: 18%; box-shadow: inset 0 0 0 1px #d7cdb8, inset 0 -3px 5px rgba(0,0,0,.12);
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 14%; backface-visibility: hidden; }
  .pip { width: 72%; aspect-ratio: 1; border-radius: 50%; background: #2b2118; place-self: center; }
  .pip.r { background: #c0392b; }
  #status { font-size: calc(var(--e) * .36); font-weight: 600; text-align: center; padding: 0 8%; min-height: 1.3em; color: #fff; }
  #logmini { font-size: calc(var(--e) * .28); color: #bcd6cf; text-align: center; padding: 0 9%; margin-top: 4px; line-height: 1.35; max-height: 4.2em; overflow: hidden; }
  #logmini div:not(:last-child) { opacity: .55; }
  #focus { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; }
  #focus .deed { width: min(62%, calc(var(--e) * 5.2)); }
  #focus .auction { position: absolute; bottom: 7%; left: 0; right: 0; text-align: center; font-size: calc(var(--e) * .36); font-weight: 700; color: #fff; }
  #focus.auctioning { flex-direction: column; justify-content: flex-start; padding-top: 7%; }

  /* ---- tokens ---- */
  #tokens { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .tok { position: absolute; left: 0; top: 0; width: var(--tk); height: var(--tk); margin: calc(var(--tk) / -2) 0 0 calc(var(--tk) / -2); border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.5); display: grid; place-items: center; will-change: transform; }
  .tok svg { width: 64%; height: 64%; fill: #fff; }
  .tok.cur { box-shadow: 0 0 0 2px var(--gold), 0 3px 8px rgba(0,0,0,.6); z-index: 2; }
  .tok.out { display: none; }

  /* ---- cards ---- */
  #cardShow { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; perspective: 900px; cursor: pointer; }
  .card3 { width: min(76%, calc(var(--e) * 6.6)); aspect-ratio: 1.55; position: relative; transform-style: preserve-3d; }
  .card3 .side { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6% 8%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .card3 .back { transform: rotateY(180deg); }
  .card3 .kismat { background: linear-gradient(135deg, #7b2d8e, #b0397a); color: #fff; border: 3px solid #ffd54a; }
  .card3 .khazana { background: linear-gradient(135deg, #0f6c61, #1c8f6b); color: #fff; border: 3px solid #ffd54a; }
  .card3 .front { background: #fffaf0; color: var(--ink); border: 3px solid var(--deck, #7b2d8e); }
  .card3 h3 { font-family: var(--serif); font-weight: 400; margin: 0 0 4%; font-size: calc(var(--e) * .55); color: var(--deck, #7b2d8e); }
  .card3 p { margin: 0; font-size: calc(var(--e) * .36); line-height: 1.35; }
  .card3 .back h3 { color: #ffd54a; font-size: calc(var(--e) * .8); }
  .card3 svg { width: 22%; height: 30%; }

  /* ---- deed (title card) ---- */
  .deed { background: #fffdf6; color: var(--ink); border-radius: 8px; border: 1px solid #cdbb94; box-shadow: 0 6px 18px rgba(0,0,0,.35); overflow: hidden; font-size: 13px; }
  .deed .hd { padding: 8px 10px 7px; text-align: center; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .deed .hd .city { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .92; }
  .deed .hd .nm { font-family: var(--serif); font-size: 20px; line-height: 1.1; }
  .deed table { width: 100%; border-collapse: collapse; }
  .deed td { padding: 2px 10px; }
  .deed td:last-child { text-align: right; font-weight: 700; }
  .deed tr.on td { background: #fff1b8; }
  .deed .ft { padding: 6px 10px 8px; border-top: 1px solid #eadcbc; font-size: 12px; color: #6b5a41; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #focus .deed { font-size: calc(var(--e) * .3); }
  #focus .deed .hd .nm { font-size: calc(var(--e) * .55); }
  #focus .deed .hd .city { font-size: calc(var(--e) * .24); }
  #focus .deed td { padding: 1px 8px; }
  #focus .deed .ft { font-size: calc(var(--e) * .26); padding: 3px 8px 5px; }

  /* ---- players ---- */
  #players { display: grid; grid-template-columns: repeat(var(--pcols, 3), minmax(0, 1fr)); gap: 6px; flex: none; }
  .pl { display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 5px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: left; min-width: 0; position: relative; }
  .pl.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; background: var(--panel2); }
  .pl.out { opacity: .4; }
  .pl.out .nm { text-decoration: line-through; }
  .pl .disc { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; flex: none; }
  .pl .disc svg { width: 64%; height: 64%; fill: #fff; }
  .pl .tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
  .pl .nm { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .cash { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* Jail and get-out-card badges sit on the token disc, so they never cover the name or the cash on a
     narrow chip (they did at 360 px, over the last digit). */
  .pl .disc { position: relative; }
  .pl .badge { position: absolute; width: 15px; height: 15px; border-radius: 4px; border: 1px solid #0b1a2b; display: grid; place-items: center; }
  .pl .badge svg { width: 100%; height: 100%; }
  .pl .badge.jail { right: -7px; bottom: -6px; }
  .pl .badge.card { left: -7px; bottom: -6px; background: #ffd54a; border-radius: 3px; font-size: 9px; font-weight: 800; color: #3a2a00; }
  .pl .lv { font-size: 10px; color: var(--muted); opacity: .8; }
  .float { position: absolute; right: 8px; top: 50%; font-weight: 800; font-size: 14px; pointer-events: none; z-index: 5; text-shadow: 0 1px 2px #000; }
  .float.up { color: var(--good); } .float.down { color: var(--bad); }

  /* ---- actions ---- */
  #actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; flex: none; }
  #actions .msg { flex: 1 1 100%; font-size: 13px; color: var(--muted); min-height: 18px; }
  .btn { min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; font-size: 15px; }
  .btn.primary { background: linear-gradient(#ffdf6b, #f2b829); color: #2b1d00; border-color: #b8860b; font-weight: 800; }
  .btn.warn { background: #4a1f28; border-color: #8a3442; }
  .btn.grow { flex: 1 1 0; }
  .btn.small { min-height: 44px; padding: 6px 10px; font-size: 14px; }
  #logbox { flex: 1; min-height: 0; overflow: auto; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; line-height: 1.45; }
  #logbox div:last-child { color: var(--fg); }
  #logbox.tiny { display: none; }

  /* ---- sheets and dialogs ---- */
  .veil { position: fixed; inset: 0; background: rgba(3, 9, 18, .62); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .veil.mid { align-items: center; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: min(100%, 480px); max-height: 88%; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: rise .22s ease-out; }
  .veil.mid .sheet, body.wide .sheet { border-radius: 18px; max-height: 92%; }
  body.wide .sheet { width: min(94%, 600px); }
  body.wide .veil { align-items: center; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  .sheet .sh { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); flex: none; }
  .sheet .sh h2 { font-size: 16px; margin: 0; flex: 1; }
  .sheet .sb { overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .sheet .sf { display: flex; gap: 8px; padding: 10px 14px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--panel2); min-height: 48px; }
  .prow .sw { width: 10px; align-self: stretch; border-radius: 4px; flex: none; }
  .prow .pn { flex: 1; min-width: 0; font-size: 14px; }
  .prow .pn small { display: block; color: var(--muted); font-size: 12px; }
  .chipsel { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 44px; padding: 6px 10px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.on { border-color: var(--gold); background: #3a3410; color: #fff3c4; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cols h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  @media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper b { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .notice { padding: 8px 10px; border-radius: 10px; background: #2a2410; color: #ffe9a3; font-size: 13px; }

  /* ---- setup ---- */
  #setup { position: fixed; inset: 0; z-index: 40; background: radial-gradient(circle at 50% 0%, #17385a, var(--bg) 70%); overflow: auto; display: flex; justify-content: center; padding: max(62px, env(safe-area-inset-top)) 12px 16px; }
  #setup .card { width: min(100%, 460px); display: flex; flex-direction: column; gap: 12px; }
  #setup .hero { text-align: center; }
  #setup .hero .brand { font-size: 44px; }
  #setup .hero .tag { font-size: 12px; color: var(--muted); }
  .seat { display: flex; align-items: center; gap: 8px; }
  .seat .disc { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; flex: none; }
  .seat .disc svg { width: 64%; height: 64%; fill: #fff; }
  .seat input, .seat select, .opt select { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 6px 10px; font: inherit; min-width: 0; }
  .seat input { flex: 1; }
  .seat select { flex: none; width: 128px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; font-size: 14px; }
  .opt small { display: block; color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { min-width: 44px; min-height: 44px; border: 0; background: var(--panel2); font-weight: 700; }
  .seg button.on { background: var(--gold); color: #2b1d00; }
  .toggle { width: 58px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel2); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); transition: left .15s; }
  .toggle.on { background: #3a3410; border-color: var(--gold); }
  .toggle.on::after { left: 24px; background: var(--gold); }
  .box { background: rgba(17, 38, 61, .85); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .box h2 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }

  /* ---- toast ---- */
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 70; background: rgba(8, 18, 30, .92); border: 1px solid var(--gold); color: #fff; padding: 10px 18px; border-radius: 14px; font-weight: 700; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); max-width: 90%; text-align: center; }

  /* ---- win ---- */
  .podium { display: flex; flex-direction: column; gap: 6px; }
  .podium .pr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--panel2); }
  .podium .pr:first-child { background: linear-gradient(90deg, #4a3d0c, var(--panel2)); border: 1px solid var(--gold); }
  .podium .rk { width: 22px; font-weight: 800; color: var(--gold); }
  .podium .disc { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; }
  .podium .disc svg { width: 64%; height: 64%; fill: #fff; }
  .podium .w { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rules { font-size: 14px; line-height: 1.5; color: #d9e4f1; }
  .rules h3 { font-size: 14px; color: var(--gold); margin: 10px 0 2px; }
  .rules p { margin: 0 0 6px; }
</style>
</head>
<body>
<style>
  /* dgames: the way back, identical in every game. Four games had no way out at all; the rest used a
     ~16px inline link, and strike-force's sat underneath the touch stick where the pad ate the tap.
     A dark disc with a light ring reads on a bright pastel scene and on a black one without being
     re-themed per game. z-index 50 sits above every game UI here (rush-lane and strike-force both use
     40, ludo game-over 20) and below the high-score prompt at 9999, which is modal and should stay on
     top. It was 15, which grep reported as present and the eye reported as missing in two games. */
  .dg-home { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;

<script>
'use strict';
// ---------- RULES ----------
// Everything from here to the UI marker is pure: no DOM, no clock, no Math.random. The dice and the card
// shuffles draw from a seeded generator whose state lives inside the game state (S.rng), so a saved game
// resumes with the same future, and a test can replay any game from one number. Tests can also script
// the dice outright through S.script (a list of [a, b] pairs consumed before the generator).
const START_CASH = 1500, SALARY = 200, JAIL_FINE = 50, BANK_HOUSES = 32, BANK_HOTELS = 12;
const JAIL = 10, GO_TO_JAIL = 30, SAVE_VERSION = 3;

// Eight colour groups, one city each, cheapest first round the board. Jaipur gets the pink set because
// it is the Pink City; Mumbai is the dearest corner, as it is in life.
const GROUPS = {
  brown:  { city: 'Varanasi',  color: '#9a6a46', house: 50 },
  sky:    { city: 'Lucknow',   color: '#6cc6ee', house: 50 },
  pink:   { city: 'Jaipur',    color: '#e0679f', house: 100 },
  orange: { city: 'Hyderabad', color: '#f39237', house: 100 },
  red:    { city: 'Kolkata',   color: '#e4474b', house: 150 },
  yellow: { city: 'Bengaluru', color: '#f3cf3a', house: 150 },
  green:  { city: 'Delhi',     color: '#2fae66', house: 200 },
  navy:   { city: 'Mumbai',    color: '#3b5fd6', house: 200 },
};
const GROUP_KEYS = Object.keys(GROUPS);

// rent: [bare, 1 house, 2, 3, 4, hotel]. Bare rent doubles when one owner holds the whole group.
const st = (name, short, group, price, rent) => ({ type: 'street', name, short, group, price, rent });
const SPACES = [
  { type: 'go', name: 'Start', short: 'Start' },
  st('Assi Ghat', 'Assi', 'brown', 60, [2, 10, 30, 90, 160, 250]),
  { type: 'khazana', name: 'Khazana', short: 'Khazana' },
  st('Godowlia', 'Godowlia', 'brown', 60, [4, 20, 60, 180, 320, 450]),
  { type: 'tax', name: 'Income Tax', short: 'Tax', amount: 200 },
  { type: 'station', name: 'Chennai Central', short: 'Chennai', price: 200 },
  st('Aminabad', 'Aminabad', 'sky', 100, [6, 30, 90, 270, 400, 550]),
  { type: 'kismat', name: 'Kismat', short: 'Kismat' },
  st('Chowk', 'Chowk', 'sky', 100, [6, 30, 90, 270, 400, 550]),
  st('Hazratganj', 'Hazratganj', 'sky', 120, [8, 40, 100, 300, 450, 600]),
  { type: 'jail', name: 'Jail', short: 'Jail' },
  st('Johari Bazaar', 'Johari', 'pink', 140, [10, 50, 150, 450, 625, 750]),
  { type: 'utility', name: 'Power Grid', short: 'Power', price: 150 },
  st('Bapu Bazaar', 'Bapu', 'pink', 140, [10, 50, 150, 450, 625, 750]),
  st('MI Road', 'MI Road', 'pink', 160, [12, 60, 180, 500, 700, 900]),
  { type: 'station', name: 'Howrah Junction', short: 'Howrah', price: 200 },
  st('Charminar', 'Charminar', 'orange', 180, [14, 70, 200, 550, 750, 950]),
  { type: 'khazana', name: 'Khazana', short: 'Khazana' },
  st('Abids', 'Abids', 'orange', 180, [14, 70, 200, 550, 750, 950]),
  st('Banjara Hills', 'Banjara', 'orange', 200, [16, 80, 220, 600, 800, 1000]),
  { type: 'parking', name: 'Chai Break', short: 'Chai' },
  st('College Street', 'College St', 'red', 220, [18, 90, 250, 700, 875, 1050]),
  { type: 'kismat', name: 'Kismat', short: 'Kismat' },
  st('Esplanade', 'Esplanade', 'red', 220, [18, 90, 250, 700, 875, 1050]),
  st('Park Street', 'Park St', 'red', 240, [20, 100, 300, 750, 925, 1100]),
  { type: 'station', name: 'Delhi Junction', short: 'Delhi Jn', price: 200 },
  st('Malleshwaram', 'Mallesh.', 'yellow', 260, [22, 110, 330, 800, 975, 1150]),
  st('Koramangala', 'Kora.', 'yellow', 260, [22, 110, 330, 800, 975, 1150]),
  { type: 'utility', name: 'Jal Board', short: 'Water', price: 150 },
  st('Indiranagar', 'Indira.', 'yellow', 280, [24, 120, 360, 850, 1025, 1200]),
  { type: 'gotojail', name: 'Go to Jail', short: 'To Jail' },
  st('Chandni Chowk', 'Chandni', 'green', 300, [26, 130, 390, 900, 1100, 1275]),
  st('Khan Market', 'Khan Mkt', 'green', 300, [26, 130, 390, 900, 1100, 1275]),
  { type: 'khazana', name: 'Khazana', short: 'Khazana' },
  st('Connaught Place', 'CP', 'green', 320, [28, 150, 450, 1000, 1200, 1400]),
  { type: 'station', name: 'Mumbai Central', short: 'Mumbai C', price: 200 },
  { type: 'kismat', name: 'Kismat', short: 'Kismat' },
  st('Marine Drive', 'Marine Dr', 'navy', 350, [35, 175, 500, 1100, 1300, 1500]),
  { type: 'tax', name: 'Wealth Tax', short: 'Wealth', amount: 100 },
  st('Malabar Hill', 'Malabar', 'navy', 400, [50, 200, 600, 1400, 1700, 2000]),
];
SPACES.forEach((s, i) => { s.i = i; });
const OWNABLE = SPACES.filter((s) => s.price).map((s) => s.i);
const GROUP_SQ = {};
for (const g of GROUP_KEYS) GROUP_SQ[g] = SPACES.filter((s) => s.group === g).map((s) => s.i);
const STATIONS = SPACES.filter((s) => s.type === 'station').map((s) => s.i);
const UTILITIES = SPACES.filter((s) => s.type === 'utility').map((s) => s.i);
const isOwnable = (i) => !!SPACES[i].price;
const houseCost = (i) => (SPACES[i].group ? GROUPS[SPACES[i].group].house : 0);
const mortgageValue = (i) => SPACES[i].price / 2;
// Lifting a mortgage costs the loan plus 10% interest, rounded up to a whole rupee. Integer arithmetic on
// purpose: Math.ceil(200 * 0.55) is 111, because 200 * 0.55 is 110.00000000000001 in floating point.
const interest = (i) => Math.ceil(mortgageValue(i) / 10);
const unmortgageCost = (i) => mortgageValue(i) + interest(i);

// Two decks of sixteen, both original. Kismat ("fate") moves you about; Khazana ("treasury") is mostly money.
const CARDS = {
  kismat: [
    { text: 'The Rajdhani runs on time for once. Advance to Start.', to: 0 },
    { text: 'Book launch on Park Street. Go there — collect your salary if you pass Start.', to: 24 },
    { text: 'Wedding shopping. Advance to Johari Bazaar.', to: 11 },
    { text: 'A sea-view flat is up for viewing. Advance to Malabar Hill.', to: 39 },
    { text: 'Catch the night mail to Howrah Junction.', to: 15 },
    { text: 'Tatkal ticket! Go to the nearest station. If it is owned, pay the owner double fare.', nearest: 'station' },
    { text: 'Platform changed at the last minute. Hurry to the nearest station; if owned, pay double.', nearest: 'station' },
    { text: 'Power cut. Go to the nearest utility. If owned, roll the dice and pay ten times the roll.', nearest: 'utility' },
    { text: 'Your employer pays a festival bonus. Collect ₹50.', cash: 50 },
    { text: 'A sharp lawyer owes you a favour. Get out of jail free. Keep this card until you need it.', free: true },
    { text: 'Missed your exit on the flyover. Go back three spaces.', back: 3 },
    { text: 'Caught jumping a red light. Go straight to jail — do not pass Start.', jail: true },
    { text: 'The monsoon found every leak. Repairs: ₹25 per house, ₹100 per hotel.', repairs: [25, 100] },
    { text: 'Traffic challan. Pay ₹15.', cash: -15 },
    { text: 'Elected housing-society secretary. Pay every player ₹50 for the welcome party.', each: 50 },
    { text: 'Your startup closes its seed round. Collect ₹150.', cash: 150 },
  ],
  khazana: [
    { text: 'The family astrologer says go. Advance to Start.', to: 0 },
    { text: 'Ancestral land finally sold. Collect ₹200.', cash: 200 },
    { text: 'Dentist visit. Pay ₹50.', cash: -50 },
    { text: 'Old silver sold at the bazaar. Collect ₹50.', cash: 50 },
    { text: 'Friends in high places. Get out of jail free. Keep this card until you need it.', free: true },
    { text: 'Your paperwork is a mess. Go straight to jail — do not pass Start.', jail: true },
    { text: 'You host Diwali dinner. Every player brings ₹50.', fromEach: 50 },
    { text: 'Your fixed deposit matures. Collect ₹100.', cash: 100 },
    { text: 'Income-tax refund. Collect ₹20.', cash: 20 },
    { text: 'Your gully cricket team wins the league. Every player chips in ₹10.', fromEach: 10 },
    { text: 'A life-insurance policy matures. Collect ₹100.', cash: 100 },
    { text: 'Hospital bill. Pay ₹100.', cash: -100 },
    { text: 'School fees are due. Pay ₹50.', cash: -50 },
    { text: 'A consulting gig pays out. Collect ₹25.', cash: 25 },
    { text: 'Property tax reassessed: ₹40 per house, ₹115 per hotel.', repairs: [40, 115] },
    { text: 'Your mango pickle wins a ribbon at the mela. Collect ₹10.', cash: 10 },
  ],
};
const DECK_NAME = { kismat: 'Kismat', khazana: 'Khazana' };

// ---- random numbers (mulberry32; the whole generator state is one uint32 in S.rng) ----
function rand(S) {
  if (S.rngFn) return S.rngFn();
  let t = (S.rng = (S.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rollDice(S) {
  if (S.script && S.script.length) return S.script.shift();
  return [1 + Math.floor(rand(S) * 6), 1 + Math.floor(rand(S) * 6)];
}
function shuffle(S, a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---- events and the log: the UI animates the events, the log is what a person reads ----
function ev(S, e) { if (!S.quiet) S.ev.push(e); }
function log(S, text) {
  if (S.quiet) return;
  S.log.push(text);
  if (S.log.length > 120) S.log.splice(0, S.log.length - 120);
  ev(S, { t: 'log', text });
}
const nm = (S, p) => S.players[p].name;
const money = (n) => '₹' + n;

// ---- a new game ----
// opts: { players: [{ name, kind }], seed, auctions, parkingPot, rounds, dealTwo, maxTurns }
// kind is 'human' | 'easy' | 'normal' | 'hard'.
function newGame(o) {
  const n = o.players.length;
  const S = {
    v: SAVE_VERSION, rng: (o.seed >>> 0) || 1,
    opts: { auctions: o.auctions !== false, parkingPot: !!o.parkingPot, rounds: o.rounds | 0, dealTwo: !!o.dealTwo,
      // A hard ceiling so no game can run forever. Measured over 200 seeded 4-computer games (see
      // test/sim.js) the longest natural game was far below this; it exists for the pathological case.
      maxTurns: o.maxTurns || 1500 },
    players: o.players.map((p, i) => ({ name: p.name, kind: p.kind, cash: START_CASH, pos: 0, jail: false, jailTries: 0, cards: [], out: false, outAt: -1, seat: i })),
    own: Array(40).fill(-1), houses: Array(40).fill(0), mort: Array(40).fill(false),
    bankHouses: BANK_HOUSES, bankHotels: BANK_HOTELS, pot: 0,
    decks: { kismat: [], khazana: [] },
    cur: 0, phase: 'roll', again: false, hasRolled: false, doubles: 0, dice: [0, 0], lastRoll: 0, round: 1, turns: 0,
    pending: null, auction: null, auctionQueue: [], debts: [], offer: null,
    cool: Array(n * n).fill(0), standings: null, endReason: '', log: [], ev: [],
  };
  S.decks.kismat = shuffle(S, CARDS.kismat.map((_, i) => i));
  S.decks.khazana = shuffle(S, CARDS.khazana.map((_, i) => i));
  if (S.opts.dealTwo) dealTwo(S);
  log(S, 'A new game of Mahanagar. ' + nm(S, 0) + ' rolls first.');
  return S;
}
// Quick-game deal: two random streets each, re-drawn whenever one player would hold a whole group,
// because a set handed out at the start decides the game before anyone has rolled.
function dealTwo(S) {
  const pool = shuffle(S, OWNABLE.filter((i) => SPACES[i].type === 'street'));
  for (let p = 0; p < S.players.length; p++) {
    let got = 0;
    for (let k = 0; k < pool.length && got < 2; k++) {
      const i = pool[k];
      if (S.own[i] >= 0) continue;
      S.own[i] = p;
      if (hasSet(S, SPACES[i].group, p)) { S.own[i] = -1; continue; }
      got++;
    }
  }
}

// ---- ownership queries ----
const active = (S) => S.players.map((_, i) => i).filter((i) => !S.players[i].out);
const hasSet = (S, g, p) => GROUP_SQ[g].every((i) => S.own[i] === p);
const countOwned = (S, list, p) => list.reduce((n, i) => n + (S.own[i] === p ? 1 : 0), 0);
const groupHasBuildings = (S, g) => GROUP_SQ[g].some((i) => S.houses[i] > 0);
const groupHasMortgage = (S, g) => GROUP_SQ[g].some((i) => S.mort[i]);
const propsOf = (S, p) => OWNABLE.filter((i) => S.own[i] === p);

// Rent owed on landing. `roll` is the dice total that brought the player here (utilities); `special`
// comes from a Kismat card: 'station2' doubles a station's rent, 'util10' charges ten times the roll.
function rentFor(S, i, roll, special) {
  const sp = SPACES[i], o = S.own[i];
  if (o < 0 || S.mort[i]) return 0;
  if (sp.type === 'street') {
    const h = S.houses[i];
    if (h > 0) return sp.rent[h];
    return hasSet(S, sp.group, o) ? sp.rent[0] * 2 : sp.rent[0];
  }

// Net worth for a timed game: cash, printed price (half for a mortgaged lot) and buildings at cost.

// ---------------------------------------------------------------- the driver
// Every change goes through act(): the rules run instantly, then the events they queued are played
// back as animation, then the screen is redrawn from the true state and the next mover is scheduled.
function act(fn) {
  if (busy || !S) return;
  try { fn(); } catch (e) { console.error(e); }
  pump();
}
async function pump() {
  if (busy) return;
  busy = true;
  const g = gen;
  try { await playEvents(g); } catch (e) { console.error(e); if (S) S.ev.length = 0; }
  if (g !== gen) return;           // a new game began mid-animation; it owns the screen now
  busy = false;
  saveGame();
  render();
  schedule();
}
function schedule() {
  clearTimeout(timer);
  if (!S || S.phase === 'over') { if (S && S.phase === 'over') setTimeout(showWin, 400 * SPEED); return; }
  const a = M.actor(S);
  if (a < 0) return;
  if (isHumanSeat(a)) {
    if (a !== lastHumanActor && S.players.filter((P) => P.kind === 'human' && !P.out).length > 1) toast(S.players[a].name + ', your move');
    lastHumanActor = a;
    if (S.phase === 'trade' && !sheetRefresh) openOffer();
    return;
  }
  const delay = { roll: 520, buy: 650, auction: 380, debt: 600, done: 420, trade: 600 }[S.phase] || 500;
  timer = setTimeout(() => {
    if (busy || !S) return;
    try { M.aiStep(S, AUTO && S.players[a].kind === 'human' ? 'hard' : undefined); }
    catch (e) { console.error(e); try { M.forceStep(S); } catch (e2) { console.error(e2); } }
    pump();
  }, delay * SPEED);
}
const wait = (ms) => new Promise((r) => setTimeout(r, Math.max(0, ms * SPEED)));
async function playEvents(g) {
  while (g === gen && S.ev.length) {
    const e = S.ev.shift();
    switch (e.t) {
      case 'dice': await tumble(e.d); break;
      case 'move': await hop(e.p, e.path); break;
      case 'jump': await jump(e.p, e.to); break;
      case 'card': await showCard(e.deck, e.id, e.p); break;
      case 'cash': moneyFx(e.p, e.d); await wait(90); break;
      case 'log': renderLog(); break;
      case 'own': case 'build': renderCell(e.i); cells[e.i].classList.remove('pop'); void cells[e.i].offsetWidth; cells[e.i].classList.add('pop'); await wait(S.ev[0] && S.ev[0].t === e.t ? 40 : 120); break;
      case 'auction': render(); await wait(200); break;
      case 'bid': case 'bidpass': renderFocus(); await wait(140); break;
      case 'bankrupt': renderPlayers(); toast(S.players[e.p].name + ' is bankrupt'); await wait(900); break;
      case 'trade': toast('Trade done'); await wait(500); break;
      case 'turn': renderPlayers(); placeAllTokens(); break;
      default: break;
    }
  }
  S.players.forEach((P, p) => { shownCash[p] = P.cash; tokAt[p] = { i: P.pos, jail: P.jail }; });
}
async function tumble(d) {
  if (SPEED < 0.05) { setDie('d1', d[0]); setDie('d2', d[1]); return; }
  const go = (id, v, k) => {
    const [x, y] = SHOW_T[v];
    const el = $(id);
    const sx = x + 720 + 90 * ((v + k) % 3), sy = y + 540 + 90 * k;
    el.style.transform = 'rotateX(' + x + 'deg) rotateY(' + y + 'deg)';
    return el.animate([{ transform: 'translateY(-60%) rotateX(' + sx + 'deg) rotateY(' + sy + 'deg)' },
      { transform: 'translateY(8%) rotateX(' + (x + 20) + 'deg) rotateY(' + (y - 15) + 'deg)', offset: 0.75 },
      { transform: 'rotateX(' + x + 'deg) rotateY(' + y + 'deg)' }], { duration: 640 * SPEED, easing: 'cubic-bezier(.2,.7,.3,1)' }).finished.catch(() => {});
  };
  await Promise.all([go('d1', d[0], 1), go('d2', d[1], 2)]);
  await wait(120);
}
function moneyFx(p, d) {
  shownCash[p] = (shownCash[p] == null ? S.players[p].cash : shownCash[p]) + d;
  const chip = $('players').children[p];
  if (!chip) return;
  chip.querySelector('.cash').textContent = rupees(shownCash[p]);
  if (SPEED < 0.05) return;
  const f = document.createElement('span');
  f.className = 'float ' + (d > 0 ? 'up' : 'down');
  f.textContent = (d > 0 ? '+' : '−') + rupees(Math.abs(d));
  chip.appendChild(f);
  f.animate([{ transform: 'translateY(-50%)', opacity: 1 }, { transform: 'translateY(-160%)', opacity: 0 }], { duration: 1100, easing: 'ease-out' }).finished.then(() => f.remove(), () => f.remove());
}
// The card flips up out of the centre, face down first. A tap dismisses it; otherwise it stays long
// enough to read (about 13 words at 250 wpm is ~3 s for a person, less when a computer drew it).
function showCard(deck, id, p) {
  const c = M.CARDS[deck][id];
  const host = $('cardShow');
  const col = deck === 'kismat' ? '#7b2d8e' : '#0f6c61';
  host.innerHTML = '<div class="card3" style="--deck:' + col + '"><div class="side front"><h3>' + M.DECK_NAME[deck] + '</h3><p>' + esc(c.text) + '</p></div>' +
    '<div class="side back ' + deck + '"><svg viewBox="0 0 24 24"><use href="#i-' + deck + '"/></svg><h3>' + M.DECK_NAME[deck] + '</h3></div></div>';
  host.hidden = false;
  if (SPEED < 0.05) { host.hidden = true; return Promise.resolve(); }
  const card = host.firstChild;
  card.animate([{ transform: 'translateY(40%) scale(.5) rotateY(180deg)', opacity: 0 }, { transform: 'translateY(0) scale(1) rotateY(180deg)', opacity: 1, offset: 0.35 }, { transform: 'rotateY(0deg)', opacity: 1 }],
    { duration: 750 * SPEED, easing: 'ease-out', fill: 'both' });
  return new Promise((res) => {
    let done = false;
    const close = () => { if (done) return; done = true; host.removeEventListener('click', close); host.hidden = true; host.innerHTML = ''; res(); };
    host.addEventListener('click', close);

}
let toastT = 0;
function toast(text) {

      const col = sp.group ? M.GROUPS[sp.group].color : sp.type === 'station' ? '#6b5a41' : '#2c6e8f';
      const h = S.houses[i];
      const st = (S.mort[i] ? 'mortgaged' : h === 5 ? 'hotel' : h ? h + ' house' + (h > 1 ? 's' : '') : sp.group && M.hasSet(S, sp.group, p) ? 'whole city' : '') ;
      r.innerHTML = '<span class="sw" style="background:' + col + '"></span><span class="pn">' + esc(sp.name) + '<small>' + (sp.group ? M.GROUPS[sp.group].city : sp.type === 'station' ? 'Railway' : 'Utility') + (st ? ' · ' + st : '') + '</small></span>';
      if (manage) {
        if (sp.type === 'street' && M.hasSet(S, sp.group, p)) {
          r.append(btn('+', 'small', () => act(() => M.build(S, p, i)), !M.canBuild(S, p, i)), btn('−', 'small', () => act(() => M.sellHouse(S, p, i)), !M.canSell(S, p, i)));
        }
        r.append(S.mort[i] ? btn('Lift', 'small', () => act(() => M.unmortgage(S, p, i)), !M.canUnmortgage(S, p, i))
          : btn('Mortgage', 'small', () => act(() => M.mortgage(S, p, i)), !M.canMortgage(S, p, i)));
      } else {
        const v = document.createElement('button'); v.className = 'btn small'; v.textContent = 'Deed'; v.onclick = () => openSpace(i); r.append(v);
      }
      b.appendChild(r);
    }
    if (manage) b.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0">+ builds a house (hotel after four), − sells one back at half price. Build evenly across a city. Mortgage pays half the price; lifting it costs that plus 10%.</p>');
  }, { live: true });
}

// ---------------------------------------------------------------- trading
function sidePicker(owner, side, other) {
  const wrap = document.createElement('div');
  const tradeable = M.propsOf(S, owner).filter((i) => !(M.SPACES[i].group && M.GROUPS[M.SPACES[i].group] && S.houses && M.GROUP_SQ[M.SPACES[i].group].some((j) => S.houses[j] > 0)));
  const chips = document.createElement('div'); chips.className = 'chipsel';
  for (const i of tradeable) {
    const sp = M.SPACES[i];
    const c = document.createElement('button');
    c.className = 'chip' + (side.props.includes(i) ? ' on' : '');
    c.innerHTML = '<span class="dot" style="background:' + (sp.group ? M.GROUPS[sp.group].color : '#8a7a62') + '"></span>' + esc(sp.short) + (S.mort[i] ? ' (m)' : '');
    c.onclick = () => { const k = side.props.indexOf(i); if (k >= 0) side.props.splice(k, 1); else side.props.push(i); sheetRefresh(); };
    chips.appendChild(c);
  }
  if (!tradeable.length) chips.innerHTML = '<span class="muted">Nothing tradeable</span>';
  wrap.appendChild(chips);
  const cash = S.players[owner].cash;
  const st = document.createElement('div'); st.className = 'stepper'; st.style.marginTop = '6px';
  const set = (v) => { side.cash = Math.max(0, Math.min(cash, v)); sheetRefresh(); };
  st.append(btn('−50', 'small', () => set(side.cash - 50), side.cash <= 0));
  const v = document.createElement('b'); v.textContent = rupees(side.cash); st.appendChild(v);
  st.append(btn('+50', 'small', () => set(side.cash + 50), side.cash + 50 > cash), btn('+10', 'small', () => set(side.cash + 10), side.cash + 10 > cash));
  wrap.appendChild(st);
  if (S.players[owner].cards.length) {
    const c = document.createElement('button');
    c.className = 'chip' + (side.cards ? ' on' : ''); c.style.marginTop = '6px';
    c.textContent = 'Get-out card';
    c.onclick = () => { side.cards = side.cards ? 0 : 1; sheetRefresh(); };
    wrap.appendChild(c);
  }
  return wrap;
}
function openTrade(p) {
  const others = M.active(S).filter((q) => q !== p);
  if (!others.length) return;
  const T = { to: others[0], give: M.blankSide(), get: M.blankSide(), note: '', counter: null };
  openSheet('Trade', (b, f) => {
    const sel = document.createElement('div'); sel.className = 'chipsel';
    for (const q of others) {
      const c = document.createElement('button');
      c.className = 'chip' + (T.to === q ? ' on' : '');
      c.innerHTML = '<span class="dot" style="background:' + COLORS[q] + '"></span>' + esc(S.players[q].name);
      c.onclick = () => { T.to = q; T.get = M.blankSide(); T.note = ''; T.counter = null; sheetRefresh(); };
      sel.appendChild(c);
    }
    b.appendChild(sel);
    // The answer goes above the lists, where it is seen without scrolling on a short landscape screen.
    if (T.note) b.insertAdjacentHTML('beforeend', '<div class="notice">' + esc(T.note) + '</div>');
    const cols = document.createElement('div'); cols.className = 'cols';
    const c1 = document.createElement('div'), c2 = document.createElement('div');
    c1.innerHTML = '<h3>You give</h3>'; c2.innerHTML = '<h3>' + esc(S.players[T.to].name) + ' gives</h3>';
    c1.appendChild(sidePicker(p, T.give)); c2.appendChild(sidePicker(T.to, T.get));
    cols.append(c1, c2); b.appendChild(cols);
    const offer = { from: p, to: T.to, give: T.give, get: T.get };
    if (T.counter) {
      f.append(btn('Accept counter', 'primary grow', () => { const o = T.counter; closeSheet(); act(() => M.doTrade(S, o)); }),
        btn('Back', 'grow', () => { T.counter = null; T.note = ''; sheetRefresh(); }));
      return;
    }
    f.append(btn('Propose', 'primary grow', () => {
      const err = M.tradeError(S, offer);
      if (err) { T.note = err[0].toUpperCase() + err.slice(1) + '.'; sheetRefresh(); return; }
      const q = T.to;
      if (S.players[q].kind === 'human' && !AUTO) { closeSheet(); act(() => M.offerTrade(S, JSON.parse(JSON.stringify(offer)))); return; }
      const r = M.aiAnswer(S, offer);
      if (r.accept) { closeSheet(); act(() => M.doTrade(S, JSON.parse(JSON.stringify(offer)))); return; }
      if (r.counter) { T.counter = r.counter; T.note = S.players[q].name + ' counters: ' + M.describeTrade(S, r.counter) + '.'; }
      else T.note = S.players[q].name + ' says no.';
      sheetRefresh();
    }), btn('Cancel', 'grow', closeSheet));
  }, { live: true });
}
function openOffer() {
  if (!S || S.phase !== 'trade' || !S.offer) return;
  const o = S.offer;
  openSheet(S.players[o.from].name + ' offers a trade', (b, f) => {
    const list = (s) => esc(M.describeSide(S, s));
    b.innerHTML = '<p style="margin:0;font-size:15px">To <b>' + esc(S.players[o.to].name) + '</b>:</p>' +
      '<div class="prow"><span class="pn">You get<small style="color:var(--fg);font-size:14px">' + list(o.give) + '</small></span></div>' +
      '<div class="prow"><span class="pn">You give<small style="color:var(--fg);font-size:14px">' + list(o.get) + '</small></span></div>';
    for (const i of [...o.give.props, ...o.get.props]) {
      const d = document.createElement('div'); d.innerHTML = deedHTML(i, true); b.appendChild(d.firstChild);
    }
    f.append(btn('Accept', 'primary grow', () => { closeSheet(); act(() => M.answerOffer(S, true)); }),
      btn('Decline', 'grow', () => { closeSheet(); act(() => M.answerOffer(S, false)); }));
  }, { noClose: true });
}

// ---------------------------------------------------------------- menu, rules, results
$('menuBtn').addEventListener('click', () => {
  openSheet('Menu', (b, f) => {
    const row = (label, fn) => { const x = btn(label, 'grow', fn); x.style.width = '100%'; b.appendChild(x); };
    row('Rules', openRules);
    row('Game log', () => openSheet('Game log', (bb) => { bb.innerHTML = (S ? S.log.slice().reverse() : []).map((l) => '<div class="muted" style="color:var(--fg)">' + esc(l) + '</div>').join(''); }));
    row(opts.fast ? 'Speed: fast (tap for normal)' : 'Speed: normal (tap for fast)', () => { opts.fast = !opts.fast; SPEED = opts.fast ? 0.5 : 1; saveOpts(); closeSheet(); });
    row('New game', () => confirmSheet('Start a new game?', 'This game will be lost.', 'New game', toSetup));
    if (S) b.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0">Round ' + S.round + (S.opts.rounds ? ' of ' + S.opts.rounds : '') + ' · the game saves itself after every move.</p>');
  });
});
function openRules() {
  openSheet('How to play', (b) => {
    b.innerHTML = '<div class="rules">' +
      '<h3>Goal</h3><p>Buy streets across eight cities, build, and collect rent until everyone else is bankrupt. In a quick game the richest player when the rounds run out wins (cash + property + buildings).</p>' +
      '<h3>Your turn</h3><p>Roll two dice and move. Doubles roll again; a third double sends you to jail. Pass Start: collect ₹200.</p>' +
      '<h3>Buying</h3><p>Land on an unowned lot and buy it at its price — or decline and it goes to auction, where everyone (you too) can bid.</p>' +
      '<h3>Rent</h3><p>Owning a whole city doubles the bare rent. Houses and hotels raise it a lot. Railways: ₹25, 50, 100, 200 for one to four. Utilities: 4× the dice, 10× with both.</p>' +
      '<h3>Building</h3><p>Only on a whole city with nothing mortgaged, evenly: no lot may get two houses ahead of another. A hotel needs four houses everywhere in the city. The bank has 32 houses and 12 hotels; when they run out, nobody can build.</p>' +
      '<h3>Money trouble</h3><p>Sell buildings back at half price, mortgage lots for half their price (lift it later for that plus 10%), or trade. If you still cannot pay you are bankrupt: what you own goes to whoever you owe, or to auction if you owed the bank.</p>' +
      '<h3>Jail</h3><p>Pay ₹50 before rolling, use a get-out card, or roll for doubles (three tries; then the fine is compulsory). You still collect rent while inside.</p>' +
      '<h3>Trading</h3><p>Swap lots, cash and get-out cards with anyone on your turn. Computers judge a deal by how it changes the game, not by printed prices: a lot that finishes a city is worth far more than its price.</p></div>';
  });
}
function showWin() {
  if (!S || S.phase !== 'over') return;
  const why = { last: 'owns the city', rounds: 'is the richest when time runs out', cap: 'is richest at the turn limit' }[S.endReason] || 'wins';
  openSheet('Game over', (b, f) => {
    b.innerHTML = '<p style="margin:0;font-size:16px"><b style="color:var(--gold)">' + esc(S.players[S.winner].name) + '</b> ' + why + '.</p><div class="podium">' +
      S.standings.map((r, k) => '<div class="pr"><span class="rk">' + (k + 1) + '</span><span class="disc" style="background:' + COLORS[r.p] + '">' + glyph(r.p) + '</span><span>' + esc(S.players[r.p].name) + '</span><span class="w">' + (S.players[r.p].out ? 'bankrupt' : rupees(r.worth)) + '</span></div>').join('') + '</div>' +
      '<p class="muted" style="margin:0">' + S.round + ' rounds, ' + S.turns + ' turns.</p>';
    f.append(btn('New game', 'primary grow', toSetup), btn('See the board', 'grow', closeSheet));
  }, { mid: true });
}

// ---------------------------------------------------------------- setup
function toSetup() {
  clearTimeout(timer);
  closeSheet();
  if (S && S.phase !== 'over') { /* abandoning a game is explicit (confirmed), so drop its save */ }
  S = null; saveGame();
  buildSetup();
}
function buildSetup() {
  const el = $('setup');
  el.hidden = false;
  const saved = readSave();
  const segN = [2, 3, 4, 5, 6].map((n) => '<button data-n="' + n + '" class="' + (opts.n === n ? 'on' : '') + '">' + n + '</button>').join('');
  let seats = '';
  for (let k = 0; k < opts.n; k++) {
    seats += '<div class="seat"><span class="disc" style="background:' + COLORS[k] + '">' + glyph(k) + '</span><input data-k="' + k + '" maxlength="14" value="' + esc(opts.seats[k].name) + '" aria-label="Player ' + (k + 1) + ' name">' +
      '<select data-k="' + k + '" aria-label="Player ' + (k + 1) + ' is">' + KINDS.map(([v, l]) => '<option value="' + v + '"' + (opts.seats[k].kind === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>';
  }
  const tog = (key, label, sub) => '<div class="opt"><span>' + label + '<small>' + sub + '</small></span><button class="toggle' + (opts[key] ? ' on' : '') + '" data-t="' + key + '" aria-pressed="' + opts[key] + '" aria-label="' + label + '"></button></div>';
  el.innerHTML = '<div class="card"><div class="hero"><div class="brand">Mahanagar</div><div class="tag">Buy the city — eight Indian cities, two to six players</div></div>' +
    (saved ? '<button class="btn primary" id="resume">Resume game · round ' + saved.round + ', ' + saved.players.filter((P) => !P.out).length + ' players left</button>' : '') +
    (badSave ? '<div class="notice">Your saved game could not be read, so it was cleared. Start a fresh one below.</div>' : '') +
    '<div class="box"><div class="opt"><h2>Players</h2><div class="seg" id="segN">' + segN + '</div></div>' + seats + '</div>' +
    '<div class="box"><h2>Game</h2><div class="opt"><span>Length<small id="lenSub">' + LENGTHS.find((l) => l[0] === opts.rounds)[2] + '</small></span><select id="len" aria-label="Game length">' +
    LENGTHS.map(([v, l]) => '<option value="' + v + '"' + (opts.rounds === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
    tog('deal', 'Deal two streets each', 'a head start for a shorter game') +
    tog('auctions', 'Auctions', 'a lot nobody buys goes to the highest bidder') +
    tog('pot', 'Chai Break jackpot', 'house rule: taxes and fines pile up for whoever lands there') + '</div>' +
    '<button class="btn primary" id="go">Start game</button>' +
    '<button class="btn" id="rulesBtn">How to play</button></div>';
  el.querySelectorAll('#segN button').forEach((b) => b.addEventListener('click', () => { opts.n = +b.dataset.n; saveOpts(); buildSetup(); }));
  el.querySelectorAll('.seat input').forEach((inp) => inp.addEventListener('input', () => { opts.seats[+inp.dataset.k].name = inp.value.slice(0, 14); saveOpts(); }));
  el.querySelectorAll('.seat select').forEach((s) => s.addEventListener('change', () => { opts.seats[+s.dataset.k].kind = s.value; saveOpts(); }));
  el.querySelectorAll('.toggle').forEach((t) => t.addEventListener('click', () => { opts[t.dataset.t] = !opts[t.dataset.t]; saveOpts(); buildSetup(); }));
  $('len').addEventListener('change', (e) => { opts.rounds = +e.target.value; saveOpts(); buildSetup(); });
  $('go').addEventListener('click', () => startGame());
  $('rulesBtn').addEventListener('click', openRules);
  if (saved) $('resume').addEventListener('click', () => resumeGame(saved));
}
function startGame(over) {
  const o = { ...opts, ...(over || {}) };
  const players = [];
  for (let k = 0; k < o.n; k++) players.push({ name: (o.seats[k].name || '').trim() || ('Player ' + (k + 1)), kind: o.seats[k].kind });
  const seed = o.seed != null ? o.seed : (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  begin(M.newGame({ players, seed, auctions: o.auctions, parkingPot: o.pot, rounds: o.rounds, dealTwo: o.deal }));
}
function resumeGame(saved) { begin(saved); }
function begin(state) {
  gen++; busy = false; clearTimeout(timer);
  $('cardShow').hidden = true; $('cardShow').innerHTML = ''; $('toast').hidden = true;
  S = state; badSave = false;
  $('setup').hidden = true;
  shownCash = S.players.map((P) => P.cash);
  tokAt = S.players.map((P) => ({ i: P.pos, jail: P.jail }));
  lastHumanActor = -1;
  $('tokens').innerHTML = ''; $('players').innerHTML = '';
  S.ev.length = 0;
  layout();
  if (S.dice[0]) { setDie('d1', S.dice[0]); setDie('d2', S.dice[1]); } else { setDie('d1', 5); setDie('d2', 3); }
  saveGame(); render(); schedule();
}

// ---------------------------------------------------------------- boot
buildBoard();
window.addEventListener('resize', layout);
layout();
setDie('d1', 5); setDie('d2', 3);
buildSetup();

// Test hook: lets a script start a seeded game, hand every human seat to the Hard computer and run at
// near-zero animation time. Nothing in normal play touches it.
window.__mahanagarUI = {
  get state() { return S; },
  start: (over) => startGame(over),
  autoplay: (on, speed) => { AUTO = !!on; if (speed != null) SPEED = speed; if (S) { render(); schedule(); } },
  setSpeed: (s) => { SPEED = s; },
  act: (fn) => act(() => fn(S, M)),
  pump: () => pump(),
  openSpace, openTrade, openAssets, openOffer, showWin, closeSheet, layout,
  get busy() { return busy; },
};
</script>
