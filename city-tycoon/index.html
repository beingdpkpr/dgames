  if (S.mort[i]) f.append(btn('Lift mortgage −' + rupees(M.unmortgageCost(i)), 'small grow', () => act(() => M.unmortgage(S, p, i)), !M.canUnmortgage(S, p, i)));
  else f.append(btn('Mortgage +' + rupees(M.mortgageValue(i)), 'small grow', () => act(() => M.mortgage(S, p, i)), !M.canMortgage(S, p, i)));
}
function openAssets(p) {
  if (!S) return;
  openSheet(() => S.players[p].name + (S.players[p].kind !== 'human' ? ' (computer, ' + S.players[p].kind + ')' : '') + (canManage(p) ? ' — manage' : ''), (b) => {
    const P = S.players[p];
    const props = M.propsOf(S, p);
    b.insertAdjacentHTML('beforeend', '<div class="row wrap muted"><span>Cash <b style="color:var(--fg)">' + rupees(P.cash) + '</b></span><span>· Net worth ' + rupees(M.netWorth(S, p)) + '</span>' +
      (P.cards.length ? '<span>· ' + P.cards.length + ' get-out card' + (P.cards.length > 1 ? 's' : '') + '</span>' : '') + '<span>· Bank has ' + S.bankHouses + ' houses, ' + S.bankHotels + ' hotels</span></div>');
    if (!props.length) b.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0">No property yet.</p>');
    const manage = canManage(p);
    for (const i of props) {
      const sp = M.SPACES[i];
      const r = document.createElement('div'); r.className = 'prow';
      const col = sp.group ? M.GROUPS[sp.group].color : sp.type === 'station' ? '#6b5a41' : '#2c6e8f';
      const h = S.houses[i];
      const st = (S.mort[i] ? 'mortgaged' : h === 5 ? 'hotel' : h ? h + ' house' + (h > 1 ? 's' : '') : sp.group && M.hasSet(S, sp.group, p) ? 'whole city' : '') ;
      r.innerHTML = '<span class="sw" style="background:' + col + '"></span><span class="pn">' + esc(sp.name) + '<small>' + (sp.group ? M.GROUPS[sp.group].city : sp.type === 'station' ? 'Railway' : 'Utility') + (st ? ' · ' + st : '') + '</small></span>';
      if (manage) {
        if (sp.type === 'street' && M.hasSet(S, sp.group, p)) {
          r.append(btn('+', 'small', () => act(() => M.build(S, p, i)), !M.canBuild(S, p, i)), btn('−', 'small', () => act(() => M.sellHouse(S, p, i)), !M.canSell(S, p, i)));
        }
        r.append(S.mort[i] ? btn('Lift', 'small', () => act(() => M.unmortgage(S, p, i)), !M.canUnmortgage(S, p, i))
          : btn('Mortgage', 'small', () => act(() => M.mortgage(S, p, i)), !M.canMortgage(S, p, i)));
      } else {
        const v = document.createElement('button'); v.className = 'btn small'; v.textContent = 'Deed'; v.onclick = () => openSpace(i); r.append(v);
      }
      b.appendChild(r);
    }
    if (manage) b.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0">+ builds a house (hotel after four), − sells one back at half price. Build evenly across a city. Mortgage pays half the price; lifting it costs that plus 10%.</p>');
  }, { live: true });
}

// ---------------------------------------------------------------- trading
function sidePicker(owner, side, other) {
  const wrap = document.createElement('div');
  const tradeable = M.propsOf(S, owner).filter((i) => !(M.SPACES[i].group && M.GROUPS[M.SPACES[i].group] && S.houses && M.GROUP_SQ[M.SPACES[i].group].some((j) => S.houses[j] > 0)));
  const chips = document.createElement('div'); chips.className = 'chipsel';
  for (const i of tradeable) {
    const sp = M.SPACES[i];
    const c = document.createElement('button');
    c.className = 'chip' + (side.props.includes(i) ? ' on' : '');
    c.innerHTML = '<span class="dot" style="background:' + (sp.group ? M.GROUPS[sp.group].color : '#8a7a62') + '"></span>' + esc(sp.short) + (S.mort[i] ? ' (m)' : '');
    c.onclick = () => { const k = side.props.indexOf(i); if (k >= 0) side.props.splice(k, 1); else side.props.push(i); sheetRefresh(); };
    chips.appendChild(c);
  }
  if (!tradeable.length) chips.innerHTML = '<span class="muted">Nothing tradeable</span>';
  wrap.appendChild(chips);
  const cash = S.players[owner].cash;
  const st = document.createElement('div'); st.className = 'stepper'; st.style.marginTop = '6px';
  const set = (v) => { side.cash = Math.max(0, Math.min(cash, v)); sheetRefresh(); };
  st.append(btn('−50', 'small', () => set(side.cash - 50), side.cash <= 0));
  const v = document.createElement('b'); v.textContent = rupees(side.cash); st.appendChild(v);
  st.append(btn('+50', 'small', () => set(side.cash + 50), side.cash + 50 > cash), btn('+10', 'small', () => set(side.cash + 10), side.cash + 10 > cash));
  wrap.appendChild(st);
  if (S.players[owner].cards.length) {
    const c = document.createElement('button');
    c.className = 'chip' + (side.cards ? ' on' : ''); c.style.marginTop = '6px';
    c.textContent = 'Get-out card';
    c.onclick = () => { side.cards = side.cards ? 0 : 1; sheetRefresh(); };
    wrap.appendChild(c);
  }
  return wrap;
}
function openTrade(p) {
  const others = M.active(S).filter((q) => q !== p);
  if (!others.length) return;
  const T = { to: others[0], give: M.blankSide(), get: M.blankSide(), note: '', counter: null };
  openSheet('Trade', (b, f) => {
    const sel = document.createElement('div'); sel.className = 'chipsel';
    for (const q of others) {
      const c = document.createElement('button');
      c.className = 'chip' + (T.to === q ? ' on' : '');
      c.innerHTML = '<span class="dot" style="background:' + COLORS[q] + '"></span>' + esc(S.players[q].name);
      c.onclick = () => { T.to = q; T.get = M.blankSide(); T.note = ''; T.counter = null; sheetRefresh(); };
      sel.appendChild(c);
    }
    b.appendChild(sel);
    // The answer goes above the lists, where it is seen without scrolling on a short landscape screen.
    if (T.note) b.insertAdjacentHTML('beforeend', '<div class="notice">' + esc(T.note) + '</div>');
    const cols = document.createElement('div'); cols.className = 'cols';
    const c1 = document.createElement('div'), c2 = document.createElement('div');
    c1.innerHTML = '<h3>You give</h3>'; c2.innerHTML = '<h3>' + esc(S.players[T.to].name) + ' gives</h3>';
    c1.appendChild(sidePicker(p, T.give)); c2.appendChild(sidePicker(T.to, T.get));
    cols.append(c1, c2); b.appendChild(cols);
    const offer = { from: p, to: T.to, give: T.give, get: T.get };
    if (T.counter) {
      f.append(btn('Accept counter', 'primary grow', () => { const o = T.counter; closeSheet(); act(() => M.doTrade(S, o)); }),
        btn('Back', 'grow', () => { T.counter = null; T.note = ''; sheetRefresh(); }));
      return;
    }
    f.append(btn('Propose', 'primary grow', () => {
      const err = M.tradeError(S, offer);
      if (err) { T.note = err[0].toUpperCase() + err.slice(1) + '.'; sheetRefresh(); return; }
      const q = T.to;
      if (S.players[q].kind === 'human' && !AUTO) { closeSheet(); act(() => M.offerTrade(S, JSON.parse(JSON.stringify(offer)))); return; }
      const r = M.aiAnswer(S, offer);
      if (r.accept) { closeSheet(); act(() => M.doTrade(S, JSON.parse(JSON.stringify(offer)))); return; }
      if (r.counter) { T.counter = r.counter; T.note = S.players[q].name + ' counters: ' + M.describeTrade(S, r.counter) + '.'; }
      else T.note = S.players[q].name + ' says no.';
      sheetRefresh();
    }), btn('Cancel', 'grow', closeSheet));
  }, { live: true });
}
function openOffer() {
  if (!S || S.phase !== 'trade' || !S.offer) return;
  const o = S.offer;
  openSheet(S.players[o.from].name + ' offers a trade', (b, f) => {
    const list = (s) => esc(M.describeSide(S, s));
    b.innerHTML = '<p style="margin:0;font-size:15px">To <b>' + esc(S.players[o.to].name) + '</b>:</p>' +
      '<div class="prow"><span class="pn">You get<small style="color:var(--fg);font-size:14px">' + list(o.give) + '</small></span></div>' +
      '<div class="prow"><span class="pn">You give<small style="color:var(--fg);font-size:14px">' + list(o.get) + '</small></span></div>';
    for (const i of [...o.give.props, ...o.get.props]) {
      const d = document.createElement('div'); d.innerHTML = deedHTML(i, true); b.appendChild(d.firstChild);
    }
    f.append(btn('Accept', 'primary grow', () => { closeSheet(); act(() => M.answerOffer(S, true)); }),
      btn('Decline', 'grow', () => { closeSheet(); act(() => M.answerOffer(S, false)); }));
  }, { noClose: true });
}

// ---------------------------------------------------------------- menu, rules, results
$('menuBtn').addEventListener('click', () => {
  openSheet('Menu', (b, f) => {
    const row = (label, fn) => { const x = btn(label, 'grow', fn); x.style.width = '100%'; b.appendChild(x); };
    row('Rules', openRules);
    row('Game log', () => openSheet('Game log', (bb) => { bb.innerHTML = (S ? S.log.slice().reverse() : []).map((l) => '<div class="muted" style="color:var(--fg)">' + esc(l) + '</div>').join(''); }));
    row(opts.fast ? 'Speed: fast (tap for normal)' : 'Speed: normal (tap for fast)', () => { opts.fast = !opts.fast; SPEED = opts.fast ? 0.5 : 1; saveOpts(); closeSheet(); });
    if (can3d()) row(view === tableView ? 'Board: 3D table (tap for flat 2D)' : 'Board: flat 2D (tap for the 3D table)', () => { closeSheet(); setDim(view === tableView ? '2d' : '3d', true); });
    row('New game', () => confirmSheet('Start a new game?', 'This game will be lost.', 'New game', toSetup));
    if (S) b.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:0">Round ' + S.round + (S.opts.rounds ? ' of ' + S.opts.rounds : '') + ' · the game saves itself after every move.</p>');
  });
});
function openRules() {
  openSheet('How to play', (b) => {
    b.innerHTML = '<div class="rules">' +
      '<h3>Goal</h3><p>Buy streets across eight cities, build, and collect rent until everyone else is bankrupt. In a quick game the richest player when the rounds run out wins (cash + property + buildings).</p>' +
      '<h3>Your turn</h3><p>Roll two dice and move. Doubles roll again; a third double sends you to jail. Pass Start: collect ₹200.</p>' +
      '<h3>Buying</h3><p>Land on an unowned lot and buy it at its price — or decline and it goes to auction, where everyone (you too) can bid.</p>' +
      '<h3>Rent</h3><p>Owning a whole city doubles the bare rent. Houses and hotels raise it a lot. Railways: ₹25, 50, 100, 200 for one to four. Utilities: 4× the dice, 10× with both.</p>' +
      '<h3>Building</h3><p>Only on a whole city with nothing mortgaged, evenly: no lot may get two houses ahead of another. A hotel needs four houses everywhere in the city. The bank has 32 houses and 12 hotels; when they run out, nobody can build.</p>' +
      '<h3>Money trouble</h3><p>Sell buildings back at half price, mortgage lots for half their price (lift it later for that plus 10%), or trade. If you still cannot pay you are bankrupt: what you own goes to whoever you owe, or to auction if you owed the bank.</p>' +
      '<h3>Jail</h3><p>Pay ₹50 before rolling, use a get-out card, or roll for doubles (three tries; then the fine is compulsory). You still collect rent while inside.</p>' +
      '<h3>Trading</h3><p>Swap lots, cash and get-out cards with anyone on your turn. Computers judge a deal by how it changes the game, not by printed prices: a lot that finishes a city is worth far more than its price.</p></div>';
  });
}
function showWin() {
  if (!S || S.phase !== 'over') return;
  const why = { last: 'owns the city', rounds: 'is the richest when time runs out', cap: 'is richest at the turn limit' }[S.endReason] || 'wins';
  openSheet('Game over', (b, f) => {
    b.innerHTML = '<p style="margin:0;font-size:16px"><b style="color:var(--gold)">' + esc(S.players[S.winner].name) + '</b> ' + why + '.</p><div class="podium">' +
      S.standings.map((r, k) => '<div class="pr"><span class="rk">' + (k + 1) + '</span><span class="disc" style="background:' + COLORS[r.p] + '">' + glyph(r.p) + '</span><span>' + esc(S.players[r.p].name) + '</span><span class="w">' + (S.players[r.p].out ? 'bankrupt' : rupees(r.worth)) + '</span></div>').join('') + '</div>' +
      '<p class="muted" style="margin:0">' + S.round + ' rounds, ' + S.turns + ' turns.</p>';
    f.append(btn('New game', 'primary grow', toSetup), btn('See the board', 'grow', closeSheet));
  }, { mid: true });
}

// ---------------------------------------------------------------- setup
function toSetup() {
  clearTimeout(timer);
  closeSheet();
  if (S && S.phase !== 'over') { /* abandoning a game is explicit (confirmed), so drop its save */ }
  S = null; saveGame();
  buildSetup();
}
function buildSetup() {
  const el = $('setup');
  el.hidden = false;
  const saved = readSave();
  const segN = [2, 3, 4, 5, 6].map((n) => '<button data-n="' + n + '" class="' + (opts.n === n ? 'on' : '') + '">' + n + '</button>').join('');
  let seats = '';
  for (let k = 0; k < opts.n; k++) {
    seats += '<div class="seat"><span class="disc" style="background:' + COLORS[k] + '">' + glyph(k) + '</span><input data-k="' + k + '" maxlength="14" value="' + esc(opts.seats[k].name) + '" aria-label="Player ' + (k + 1) + ' name">' +
      '<select data-k="' + k + '" aria-label="Player ' + (k + 1) + ' is">' + KINDS.map(([v, l]) => '<option value="' + v + '"' + (opts.seats[k].kind === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>';
  }
  const tog = (key, label, sub) => '<div class="opt"><span>' + label + '<small>' + sub + '</small></span><button class="toggle' + (opts[key] ? ' on' : '') + '" data-t="' + key + '" aria-pressed="' + opts[key] + '" aria-label="' + label + '"></button></div>';
  el.innerHTML = '<div class="card"><div class="hero"><div class="brand">City Tycoon</div><div class="tag">Buy the city — eight Indian cities, two to six players</div></div>' +
    (saved ? '<button class="btn primary" id="resume">Resume game · round ' + saved.round + ', ' + saved.players.filter((P) => !P.out).length + ' players left</button>' : '') +
    (badSave ? '<div class="notice">Your saved game could not be read, so it was cleared. Start a fresh one below.</div>' : '') +
    '<div class="box"><div class="opt"><h2>Players</h2><div class="seg" id="segN">' + segN + '</div></div>' + seats + '</div>' +
    '<div class="box"><h2>Game</h2><div class="opt"><span>Length<small id="lenSub">' + LENGTHS.find((l) => l[0] === opts.rounds)[2] + '</small></span><select id="len" aria-label="Game length">' +
    LENGTHS.map(([v, l]) => '<option value="' + v + '"' + (opts.rounds === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
    tog('deal', 'Deal two streets each', 'a head start for a shorter game') +
    tog('auctions', 'Auctions', 'a lot nobody buys goes to the highest bidder') +
    tog('pot', 'Chai Break jackpot', 'house rule: taxes and fines pile up for whoever lands there') + '</div>' +
    '<button class="btn primary" id="go">Start game</button>' +
    '<button class="btn" id="rulesBtn">How to play</button></div>';
  el.querySelectorAll('#segN button').forEach((b) => b.addEventListener('click', () => { opts.n = +b.dataset.n; saveOpts(); buildSetup(); }));
  el.querySelectorAll('.seat input').forEach((inp) => inp.addEventListener('input', () => { opts.seats[+inp.dataset.k].name = inp.value.slice(0, 14); saveOpts(); }));
  el.querySelectorAll('.seat select').forEach((s) => s.addEventListener('change', () => { opts.seats[+s.dataset.k].kind = s.value; saveOpts(); }));
  el.querySelectorAll('.toggle').forEach((t) => t.addEventListener('click', () => { opts[t.dataset.t] = !opts[t.dataset.t]; saveOpts(); buildSetup(); }));
  $('len').addEventListener('change', (e) => { opts.rounds = +e.target.value; saveOpts(); buildSetup(); });
  $('go').addEventListener('click', () => startGame());
  $('rulesBtn').addEventListener('click', openRules);
  if (saved) $('resume').addEventListener('click', () => resumeGame(saved));
}
function startGame(over) {
  const o = { ...opts, ...(over || {}) };
  const players = [];
  for (let k = 0; k < o.n; k++) players.push({ name: (o.seats[k].name || '').trim() || ('Player ' + (k + 1)), kind: o.seats[k].kind });
  const seed = o.seed != null ? o.seed : (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  begin(M.newGame({ players, seed, auctions: o.auctions, parkingPot: o.pot, rounds: o.rounds, dealTwo: o.deal }));
}
function resumeGame(saved) { begin(saved); }
function begin(state) {
  gen++; busy = false; clearTimeout(timer);
  $('cardShow').hidden = true; $('cardShow').innerHTML = ''; $('toast').hidden = true;
  S = state; badSave = false;
  $('setup').hidden = true;
  shownCash = S.players.map((P) => P.cash);
  tokAt = S.players.map((P) => ({ i: P.pos, jail: P.jail }));
  shownOwn = S.own.slice(); view.reset(); fxEnd();
  lastHumanActor = -1;
  $('players').innerHTML = '';
  S.ev.length = 0;
  layout();
  view.setDice(S.dice[0] ? S.dice : [5, 3]);
  saveGame(); render(); schedule();
}

// ---------------------------------------------------------------- 2D or 3D
// The 3D table is the default wherever WebGL works. The flat 2D board stays as the fallback (no WebGL,
// ?no3d, a lost context, anything throwing while the scene is built) and as a choice in the menu. The
// choice and the camera are remembered in dgames.city-tycoon.view, apart from the game's save. A portrait
// phone opens top-down -- the angled view foreshortens the far row to a few pixels a space -- and
// everything else angled, as Ludo does.
const VIEW_KEY = 'dgames.city-tycoon.view';
const viewPref = (() => { try { const v = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } catch (e) { return {}; } })();
const saveView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(viewPref)); } catch (e) { /* ignore */ } };
const portraitPhone = () => innerHeight > innerWidth && innerWidth < 700;
const camDefault = () => viewPref.cam || (portraitPhone() ? 'top' : 'angled');
// ?no3d asks for the 2D board outright (the switch for testing the fallback), so it is no failure to report.
let no3d = !window.Tabletop || /[?&]no3d\b/.test(location.search);
const can3d = () => !no3d;
const mountOpts = { onTap: (i) => openSpace(i), speed: () => SPEED, reduced: () => RM.matches, onView: () => placeHud(),
  onLost: () => { no3d = true; setDim('2d', false); } };
function setDim(dim, remember) {
  // Never mid-animation: the old view's hops and dice would be awaited on a board that is gone.
  if (busy) { setTimeout(() => setDim(dim, remember), 120); return; }
  let next = domView;
  if (dim === '3d' && can3d()) { if (!tableView) tableView = makeTableBoard(); next = tableView; }
  if (next !== view || !board.firstChild) {
    if (view.unmount) view.unmount();
    board.classList.toggle('t3d', next === tableView);
    try { next.mount(board, mountOpts); } catch (e) {
      // Anything that goes wrong building the scene leaves the 2D game playable rather than a blank board.
      try { console.warn('3D board failed, using 2D:', e); } catch (e2) { /* ignore */ }
      no3d = true; next = domView; board.classList.remove('t3d'); next.mount(board, mountOpts);
    }
    view = next;
  }
  document.body.classList.toggle('t3d', view === tableView);
  if (remember) { viewPref.dim = view === tableView ? '3d' : '2d'; saveView(); }
  if (view === tableView) view.setCam(camDefault(), true);
  viewButton();
  view.reset();
  layout();
  view.setDice(S && S.dice[0] ? S.dice : [5, 3]);
  if (S) render();
}
function setCam(name, remember) {
  if (view !== tableView) return;
  view.setCam(name, false);
  if (remember) { viewPref.cam = name; saveView(); }
  viewButton();
}
// One button in the header: on the 3D board it flips the camera (Top / Angled, as in Ludo); on the 2D
// board it brings the 3D one back. The 2D choice itself lives in the menu, which keeps the header to the
// logo and two buttons -- three did not fit beside the logo on a phone held sideways.
function viewButton() {
  const b = $('viewBtn');
  if (view === tableView) {
    const top = tableView.cam === 'top';
    b.hidden = false; b.textContent = top ? 'Angled' : 'Top';
    b.setAttribute('aria-label', top ? 'Tilt the camera to an angled view' : 'Look straight down at the board');
  } else { b.hidden = !can3d(); b.textContent = '3D'; b.setAttribute('aria-label', 'Show the 3D board'); }
}
$('viewBtn').addEventListener('click', () => { if (view === tableView) setCam(tableView.cam === 'top' ? 'angled' : 'top', true); else setDim('3d', true); });

// ---------------------------------------------------------------- boot
window.addEventListener('resize', layout);
// Turning a phone over changes the default camera, unless someone picked one.
window.addEventListener('resize', () => { if (view === tableView && !viewPref.cam) setCam(camDefault(), false); });
setDim(viewPref.dim === '2d' ? '2d' : '3d', false);
buildSetup();

// Test hook: lets a script start a seeded game, hand every human seat to the Hard computer and run at
// near-zero animation time. Nothing in normal play touches it.
window.__cityTycoonUI = {
  get state() { return S; },
  start: (over) => startGame(over),
  autoplay: (on, speed) => { AUTO = !!on; if (speed != null) SPEED = speed; if (S) { render(); schedule(); } },
  setSpeed: (s) => { SPEED = s; },
  act: (fn) => act(() => fn(S, M)),
  pump: () => pump(),
  openSpace, openTrade, openAssets, openOffer, showWin, closeSheet, layout, setDim, setCam,
  get view() { return view; }, get tableView() { return tableView; }, get domView() { return domView; },
  get busy() { return busy; },
};
</script>
