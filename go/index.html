<!DOCTYPE html>
<html lang="en">

<script>
  /* Installable, and playable with no network once a game has been opened. Registered from every page so
     a deep link into one game works offline too, not only a visit that started at the launcher. Over
     file:// there is no service worker and register() rejects; the catch keeps that silent. */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
<meta name="description" content="Go on a wooden board: 9x9, 13x13 or 19x19, against a Monte-Carlo computer opponent or a friend on the same device. Area scoring, superko, dead-stone marking, SGF export.">
<title>Go</title>
<style>
  /* No web font: the page has to look the same offline on first open, and a serif from the OS is enough
     for one word of title. Everything else is the system UI face. */
  :root {
    --bg0: #12110f; --bg1: #1f1c18; --text: #f1ebe0; --muted: #b5ab9b; --line: rgba(255, 255, 255, .12);
    --btn: rgba(255, 255, 255, .07); --btn2: rgba(255, 255, 255, .13); --amber: #e8b665; --amber2: #c98f3a;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --serif: "Iowan Old Style", Palatino, Georgia, serif;
    --bs: 340px; --panel: 240px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: radial-gradient(110% 70% at 50% 0%, #2c2620 0%, transparent 60%), linear-gradient(170deg, var(--bg1), var(--bg0));
    color: var(--text); font: 15px/1.35 var(--ui); -webkit-font-smoothing: antialiased; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }

  /* ---- play area. layout() in the script sets --bs (board side) and --panel, and picks .stack (board
     between a status strip and a button row) or .side (a panel beside the board, sized from the height). */
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #app.stack { flex-direction: column; justify-content: flex-start; gap: 8px; }
  #app.side { flex-direction: row; gap: 20px; }
  #panel { display: flex; flex-direction: column; gap: 10px; }
  #app.stack #panel { display: contents; }
  #app.side #panel { width: var(--panel); align-self: stretch; padding-top: 64px; padding-bottom: 8px; justify-content: center; }
  #hud { display: flex; flex-direction: column; gap: 6px; width: var(--bs); }
  #app.side #hud { width: 100%; }
  #app.stack #hud { order: 1; }
  #boardBox { position: relative; width: var(--bs); height: var(--bs); flex: none; }
  #app.stack #boardBox { order: 2; }
  #app.stack #ctrls { order: 3; width: var(--bs); }
  #cv { display: block; width: 100%; height: 100%; border-radius: 6px; touch-action: none; cursor: pointer;
    box-shadow: 0 1px 0 rgba(255, 236, 200, .35) inset, 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4); }

  .players { display: flex; gap: 8px; }
  #app.side .players { flex-direction: column; }
  /* flex:1 shares the row in portrait; in this column it would set the basis to 0 and squash the chips to ~20px. */
  #app.side .pl { flex: none; }
  .pl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 12px; border-radius: 12px;
    background: var(--btn); border: 1px solid var(--line); transition: border-color .2s, background .2s; }
  .pl.on { border-color: rgba(232, 182, 101, .75); background: rgba(232, 182, 101, .1); }
  .pl .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .pl .cap { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .pl .cap b { color: var(--text); font-weight: 600; }
  .st { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  .st.sb { background: radial-gradient(circle at 35% 30%, #6a6b6f, #1d1d1f 55%, #050505); }
  .st.sw { background: radial-gradient(circle at 35% 30%, #fff, #eeebe4 55%, #c8c2b6); }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); animation: blink 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #status { min-height: 20px; font-size: 13px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app.side #status { text-align: left; padding-left: 2px; white-space: normal; }
  #status b { color: var(--text); font-weight: 600; }
  /* Messages (illegal move, a pass, the dead-stone proposal) take over the status line for a moment
     instead of floating over the board, where the first version hid the top row of stones. */
  #status.note, #status.note b { color: var(--amber); font-weight: 600; }

  #ctrls { display: flex; gap: 8px; }
  #app.side #ctrls { display: grid; grid-template-columns: 1fr 1fr; }
  .b { min-height: 48px; min-width: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--btn);
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  #ctrls .b { flex: 1; }
  #ctrls .b.icon { flex: 0 0 52px; }
  .b:hover { background: var(--btn2); }
  .b:disabled { opacity: .38; cursor: default; }
  .b.primary { background: linear-gradient(180deg, #f0c47c, #d79f4c); color: #2a1c08; border-color: rgba(255, 220, 160, .6); }
  .b.primary:hover { background: linear-gradient(180deg, #f5cd8b, #dfa957); }
  .b.on { border-color: rgba(232, 182, 101, .8); color: var(--amber); }
  /* [hidden] loses to any author display rule, so every toggled element that has one gets this back. */
  .b[hidden], #ctrls[hidden], .pl[hidden], .row[hidden], .ov[hidden], #menu[hidden] { display: none; }
  .b svg { width: 18px; height: 18px; }


  /* ---- menu: a small sheet above the controls */
  #menu { position: fixed; z-index: 30; min-width: 220px; padding: 6px; border-radius: 14px; background: #2a2620; border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .55); display: flex; flex-direction: column; gap: 2px; }
  #menu .b { justify-content: flex-start; border: 0; background: transparent; font-weight: 500; }
  #menu .b:hover { background: var(--btn); }

  /* ---- overlays (setup, result, SGF, confirm) */
  .ov { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 64px 12px 12px;
    background: rgba(10, 9, 8, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); overflow: auto; }
  .card { width: min(420px, 100%); margin: auto; padding: 18px; border-radius: 18px; background: linear-gradient(180deg, #2b2721, #211e19);
    border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
  .card h2 { margin: 0 0 4px; font: 600 26px/1.15 var(--serif); letter-spacing: .3px; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .row { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 8px; margin: 8px 0; }
  .row > span { color: var(--muted); font-size: 13px; }
  .seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); }
  .seg button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; cursor: pointer; padding: 0 4px; }
  .seg button[aria-pressed="true"] { background: #f1ebe0; color: #1d1a16; }
  .seg button:disabled { opacity: .35; cursor: default; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step output { min-width: 64px; text-align: center; font-weight: 600; }
  .step .b { width: 48px; padding: 0; }
  .acts { display: flex; gap: 8px; margin-top: 14px; }
  .acts .b { flex: 1; }
  #setupNote { min-height: 18px; margin: 4px 0 0; font-size: 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand small { color: var(--muted); font-size: 12px; }
  /* Phones on their side: options beside the title so the card fits 375px of height without scrolling. */
  @media (orientation: landscape) and (max-height: 520px) {
    .ov { padding: 8px 12px 8px 64px; }
    #setup .card { width: min(640px, 100%); display: grid; grid-template-columns: 180px 1fr; gap: 0 18px; }
    #setup .card .head { grid-column: 1; grid-row: 1; }
    #setup .card .opts { grid-column: 2; grid-row: 1 / span 2; }
    #setup .card .acts { grid-column: 1; grid-row: 2; flex-direction: column; align-self: end; }
    .row { margin: 6px 0; }
  }
  table.score { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  table.score th, table.score td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  table.score th:first-child, table.score td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
  table.score tr:last-child td { border-bottom: 0; font-weight: 700; font-size: 16px; }
  table.score thead th { font-weight: 600; }
  .hstone { display: inline-flex; align-items: center; gap: 6px; }
  #resTitle { font: 600 24px/1.2 var(--serif); margin: 0 0 2px; }
  #sgfText { width: 100%; height: 160px; resize: none; border-radius: 10px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3);
    color: var(--text); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; -webkit-user-select: text; user-select: text; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---- 3D table (body.v3d), drawn by ../lib/tabletop.js. The 2D canvas stays the fallback when WebGL is
     missing and the choice for anyone who prefers it; nothing in this block applies without .v3d. The stage
     is the whole space beside or under the HUD rather than the board's square (layout() sizes it). ---- */
  #c3d, #view3 { display: none; }
  body.v3d #cv { display: none; }
  body.v3d #c3d { display: block; width: 100%; height: 100%; border-radius: 14px; touch-action: none; outline: none; cursor: pointer;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35); }
  body.v3d #view3 { display: flex; position: absolute; top: 8px; right: 8px; gap: 6px; }
  #view3 button { min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid rgba(43, 47, 92, .25);
    background: rgba(255, 255, 255, .82); color: #2B2F5C; font: 700 13px var(--ui); cursor: pointer; }
  #view3 button:hover { background: #fff; }
</style>
</head>

  /* dgames: the way back, identical in every game. Four games had no way out at all; the rest used a
     ~16px inline link, and strike-force's sat underneath the touch stick where the pad ate the tap.
     A dark disc with a light ring reads on a bright pastel scene and on a black one without being
     re-themed per game. z-index 50 sits above every game UI here (rush-lane and strike-force both use

<script id="go-js">
'use strict';
// ---------- Go: the pure part (board, rules, superko, scoring, search) ----------
// Nothing above the UI marker touches the DOM, a clock it was not handed, or Math.random: test/*.js
// lift this text into node's vm, and the page hands the same text to a Web Worker built from a Blob.
const EMPTY = 0, BLACK = 1, WHITE = 2, EDGE = 3;
const PASS = -1, RESIGN = -2, NONE = 0;   // 0 is a border cell, so it can never be a real point
const KOMI = 7.5, HANDICAP_KOMI = 0.5;
const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

// xorshift32. Seeded everywhere so a test game is the same game on every run.
function rngFrom(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

// The board is padded with one ring of EDGE cells, so a neighbour lookup never needs a bounds check.
const GEOM = {};
function geom(N) {
  if (GEOM[N]) return GEOM[N];
  const W = N + 2, S = W * W;
  const pts = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) pts.push((y + 1) * W + x + 1);
  const zr = rngFrom(0x60d5eed ^ (N * 7919));
  // Two independent 32-bit Zobrist keys per (point, colour): 53 bits of them become the position key, so
  // a false superko hit needs a 1-in-2^53 collision.
  const z1 = new Int32Array(S * 3), z2 = new Int32Array(S * 3);
  for (let i = 0; i < S * 3; i++) { z1[i] = (zr() * 4294967296) | 0; z2[i] = (zr() * 4294967296) | 0; }
  const edgeDist = new Int8Array(S);
  for (const p of pts) { const x = p % W - 1, y = ((p / W) | 0) - 1; edgeDist[p] = Math.min(x, y, N - 1 - x, N - 1 - y); }
  return (GEOM[N] = { N, W, S, pts: Int16Array.from(pts), z1, z2, edgeDist, dirs: [-1, 1, -W, W], diag: [-W - 1, -W + 1, W - 1, W + 1] });
}
const toPt = (N, x, y) => (y + 1) * (N + 2) + x + 1;
const toXY = (N, p) => [p % (N + 2) - 1, ((p / (N + 2)) | 0) - 1];
const COLS = 'ABCDEFGHJKLMNOPQRST';   // no I, as on every goban
function ptName(N, p) { if (p === PASS) return 'pass'; const [x, y] = toXY(N, p); return COLS[x] + (N - y); }

// ---- Board: chains as circular linked lists with pseudo-liberty counts --------------------------------
// pl = pseudo-liberties (each stone-to-empty adjacency counted once), ls / lq = sum and sum of squares of
// those liberty indices. A chain is in atari exactly when every pseudo-liberty is the same point, which
// is when pl * lq == ls * ls (Cauchy-Schwarz with equality). That makes capture and atari checks O(1)
// with no liberty sets to maintain -- the difference between ~4k and ~20k playouts a second here.
function Board(N) {
  const g = geom(N), S = g.S;
  this.N = N; this.g = g;
  this.c = new Uint8Array(S).fill(EDGE);
  this.head = new Int16Array(S); this.nxt = new Int16Array(S); this.sz = new Int16Array(S);
  this.pl = new Int32Array(S); this.ls = new Float64Array(S); this.lq = new Float64Array(S);
  this.emp = new Int16Array(N * N); this.empAt = new Int16Array(S); this.nEmp = 0;
  for (const p of g.pts) { this.c[p] = EMPTY; this.empAt[p] = this.nEmp; this.emp[this.nEmp++] = p; }
  this.ko = -1; this.toMove = BLACK; this.h1 = 0; this.h2 = 0; this.caps = [0, 0, 0]; this.passes = 0; this.last = PASS;
}
Board.prototype.copyFrom = function (o) {
  this.c.set(o.c); this.head.set(o.head); this.nxt.set(o.nxt); this.sz.set(o.sz);
  this.pl.set(o.pl); this.ls.set(o.ls); this.lq.set(o.lq);
  this.emp.set(o.emp); this.empAt.set(o.empAt); this.nEmp = o.nEmp;
  this.ko = o.ko; this.toMove = o.toMove; this.h1 = o.h1; this.h2 = o.h2;
  this.caps[1] = o.caps[1]; this.caps[2] = o.caps[2]; this.passes = o.passes; this.last = o.last;
  return this;
};
Board.prototype.clone = function () { return new Board(this.N).copyFrom(this); };
// 53-bit position key (colours only -- positional superko ignores whose turn it is).
Board.prototype.key = function () { return (this.h1 >>> 0) * 2097152 + (this.h2 >>> 11); };
Board.prototype.inAtari = function (h) { const n = this.pl[h]; return n > 0 && n * this.lq[h] === this.ls[h] * this.ls[h]; };

    try { for (const c of [BLACK, WHITE]) { ghostMesh.material = matGhost[c]; kit.renderer.compile(kit.scene, kit.camera); } } catch (e) { /* only a warm-up */ }
    hidden.forEach((m) => { m.visible = false; });
  }
  function reset() {
    gen++; kit.finishAll();
    const n = game ? game.N : prefs.N;
    if (n !== N) buildBoard(n);
    if (!warmed) warm();
    nearC = cfg && cfg.mode === 'ai' ? cfg.human : BLACK;
    onBoard.clear(); flying.clear(); lidStones[BLACK] = []; lidStones[WHITE] = [];
    placeBowls(); fit(true);
    sync(); update();
  }
  const wait = (ms) => kit.tween({ ms, ease: 'linear' }).promise;
  // A move: the stone drops the last couple of centimetres, clicks as it lands and settles; then whatever it
  // captured lifts off one stone after another and flies to the mover's lid.
  function placed(p, mover, caps) {
    const my = gen;
    if (game.N !== N) { reset(); return; }
    const air = (c) => { let n = 0; flying.forEach((v) => { if (v.lid === c) n++; }); return n; };
    const prisoners = [];
    for (const q of caps) {
      const v = onBoard.get(q); if (!v) continue;
      onBoard.delete(q);
      v.kind = 'fly'; v.lid = mover; v.slot = lidStones[mover].length + air(mover);
      flying.add(v); prisoners.push(v);
    }
    const v = boardStone(mover, p), rest = v.position.y, tx = (hash(p, 4) - 0.5) * 0.25, tz = (hash(p, 5) - 0.5) * 0.25;
    onBoard.set(p, v);
    v.position.y = rest + 1.7; v.rotation.x = tx; v.rotation.z = tz; dirty = true;
    kit.tween({ ms: 150, ease: 'inQuad', update: (k) => { v.position.y = rest + 1.7 * (1 - k); v.rotation.x = tx * (1 - k); v.rotation.z = tz * (1 - k); dirty = true; } }).promise.then(() => {
      if (my !== gen) return;
      sfx.place();
      kit.tween({ ms: 130, ease: 'linear', update: (k) => { v.position.y = rest + 0.09 * Math.sin(Math.PI * k) * (1 - k); dirty = true; } });
      prisoners.forEach((s, i) => fly(s, i, my));
    });
  }
  function fly(v, i, my) {
    const a = v.position.clone(), lift = a.y + 1.5, spin = (hash(v.slot, 11) - 0.5) * 2;
    wait(70 + i * 55).then(() => {
      if (my !== gen) return null;
      return kit.tween({ ms: 130, ease: 'outQuad', update: (k) => { v.position.y = a.y + (lift - a.y) * k; v.rotation.x = 0.35 * k; dirty = true; } }).promise;
    }).then(() => {
      if (my !== gen) return null;
      const to = lidSlot(v.lid, v.slot), from = [v.position.x, v.position.y, v.position.z], dist = Math.hypot(to[0] - from[0], to[2] - from[2]);
      return kit.tween({ ms: 420 + dist * 9, ease: 'inOutQuad', update: (k) => {
        const s = M.flightSample(from, to, k, Math.max(4, dist * 0.35));
        v.position.set(s[0], s[1], s[2]); v.rotation.x = 0.35 * (1 - k); v.rotation.z = spin * Math.sin(Math.PI * k); dirty = true;

    }).then(() => {
      if (my !== gen) return;
      flying.delete(v);
      v.kind = 'lid'; v.rotation.set((hash(v.slot, 7) - 0.5) * 0.3, v.rotation.y, (hash(v.slot, 9) - 0.5) * 0.3);
      if (lidStones[v.lid].length < LID_MAX) lidStones[v.lid].push(v);
      if (i < 5) sfx.capture(1);

  }

  const dummy = new THREE.Object3D();
  let lastP = 0;
  function rebuild() {
    dirty = false;
    const n = { [BLACK]: 0, [WHITE]: 0 }, nd = { [BLACK]: 0, [WHITE]: 0 };
    const showDead = (phase === 'marking' || phase === 'over') && score && dead;
    const put = (v) => {
      dummy.position.copy(v.position); dummy.rotation.copy(v.rotation); dummy.updateMatrix();
      if (showDead && v.kind === 'board' && dead[v.p]) deadInst[v.c].setMatrixAt(nd[v.c]++, dummy.matrix);
      else if (n[v.c] < CAP) inst[v.c].setMatrixAt(n[v.c]++, dummy.matrix);
    };
    onBoard.forEach(put); flying.forEach(put);
    for (const c of [BLACK, WHITE]) { heaps[c].forEach(put); lidStones[c].forEach(put); }
    for (const c of [BLACK, WHITE]) {
      inst[c].count = n[c]; inst[c].instanceMatrix.needsUpdate = true;
      deadInst[c].count = nd[c]; deadInst[c].instanceMatrix.needsUpdate = true;
    }
    const lv = lastP && onBoard.get(lastP);
    ring.visible = !!lv;
    if (lv) {
      // on the crown, tilted with the stone while it is still settling
      ring.rotation.set(lv.rotation.x, 0, lv.rotation.z);
      ring.position.set(0, SH, 0).applyEuler(ring.rotation).add(lv.position);
      ringMat.color = col(lv.c === BLACK ? '#ffffff' : '#26262a');
    }
  }
  // Called by draw(): ghost, crosshair, last move and the count's markers follow the game's state.
  function update() {
    if (!game || game.N !== N) { kit.invalidate(); return; }
    sync();
    const b = game.board, preview = ghost && phase === 'play';
    const gAt = preview ? ghost : (hover && phase === 'play' && !thinking ? hover : 0);
    if (gAt && b.c[gAt] === EMPTY) {
      const [x, z] = ptXZ(gAt);
      ghostMesh.position.set(x, REST, z); ghostMesh.material = matGhost[b.toMove];
      matGhost[b.toMove].opacity = preview ? 0.62 : 0.4; ghostMesh.visible = true;
    } else ghostMesh.visible = false;
    crossH.visible = crossV.visible = !!(preview && b.c[ghost] === EMPTY);
    if (crossH.visible) { const [x, z] = ptXZ(ghost); crossH.position.set(0, TOP + 0.02, z); crossV.position.set(x, TOP + 0.02, 0); }
    lastP = phase === 'play' && b.last > 0 && b.c[b.last] !== EMPTY ? b.last : 0;
    const sco = (phase === 'marking' || phase === 'over') ? score : null, nm = { [BLACK]: 0, [WHITE]: 0 };
    if (sco) for (const p of b.g.pts) {
      const o = sco.owner[p];
      if (!o || (b.c[p] !== EMPTY && !(dead && dead[p]))) continue;
      const [x, z] = ptXZ(p);
      dummy.position.set(x, b.c[p] !== EMPTY ? REST + SH + 0.05 : TOP + 0.05, z); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
      markInst[o].setMatrixAt(nm[o]++, dummy.matrix);
    }
    for (const c of [BLACK, WHITE]) { markInst[c].count = nm[c]; markInst[c].instanceMatrix.needsUpdate = true; }
    dirty = true; kit.invalidate();
  }

  // ---- input: a tap is snapped to the nearest intersection on the plane through the stones' middles
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitV = new THREE.Vector3();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(TOP + SH * 0.8));
  function pointAt(cx, cy, slack) {
    if (!N) return 0;
    const r = canvas.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, kit.camera);
    if (!ray.ray.intersectPlane(plane, hitV)) return 0;
    const fx = hitV.x / CELL + half, fy = hitV.z / CELL + half, m = slack == null ? MARGIN / CELL : slack;
    if (fx < -m || fy < -m || fx > N - 1 + m || fy > N - 1 + m) return 0;
    return G.toPt(N, Math.max(0, Math.min(N - 1, Math.round(fx))), Math.max(0, Math.min(N - 1, Math.round(fy))));
  }
  // CSS px of an intersection on screen, and how far apart points look around it.
  function screenAt(x, z) {
    hitV.set(x, TOP + SH * 0.8, z).project(kit.camera);
    const r = canvas.getBoundingClientRect();
    return [r.left + ((hitV.x + 1) / 2) * r.width, r.top + ((1 - hitV.y) / 2) * r.height];
  }
  function screenOf(p) { const [x, z] = ptXZ(p); return screenAt(x, z); }
  // The typical gap between neighbouring points on screen: the median over a 3x3 sample of the board of
  // each sample's smaller gap (across or along). Angled, the far rows are smaller than this; the ghost's
  // crosshair is there for them.
  function spacing() {
    const m = [];
    for (const iy of [0, half, N - 1]) for (const ix of [0, half, N - 1]) {
      const x = (ix - half) * CELL, z = (iy - half) * CELL, a = screenAt(x, z), dx = ix < N - 1 ? CELL : -CELL, dz = iy < N - 1 ? CELL : -CELL;
      const bx = screenAt(x + dx, z), bz = screenAt(x, z + dz);
      m.push(Math.min(Math.hypot(bx[0] - a[0], bx[1] - a[1]), Math.hypot(bz[0] - a[0], bz[1] - a[1])));
    }
    return m.sort((p, q) => p - q)[4];
  }
  // Ghost-then-confirm is for fingers: a mouse plays where it clicks (as in 2D), so a mouse-only screen
  // never needs the Place button.
  const fingers = (() => { try { return matchMedia('(any-pointer: coarse)').matches || navigator.maxTouchPoints > 0; } catch (e) { return true; } })();
  const needConfirm = () => fingers && spacing() < 32;
  // Every drawn frame: re-instance the stones if anything moved, and when the camera has moved re-decide
  // whether points are small enough to need the ghost-then-confirm tap.
  let camKey = '';
  kit.onFrame(() => {
    if (dirty) rebuild();
    const c = kit.rig.state, key = [c.yaw, c.pitch, c.dist, c.tx, c.tz, canvas.clientWidth, canvas.clientHeight].map((v) => v.toFixed(3)).join();
    if (key !== camKey && N) { camKey = key; const cf = needConfirm(); if (cf !== L.confirm) { L.confirm = cf; renderHud(); } }
    return false;
  });
  canvas.addEventListener('pointerdown', () => audio());
  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || e.buttons || !game) return;
    const p = canHumanPlay() ? pointAt(e.clientX, e.clientY) : 0, h = p && !game.illegal(p) ? p : 0;

  return {
    ok: true, kit, reset, update, placed, pointAt, screenOf, spacing,
    resize() {
      kit.resize();
      const a = (canvas.clientWidth || 1) / (canvas.clientHeight || 1);

    setCam(name, instant) { kit.rig.setView(name, { instant }); if (N) fit(!!instant); else if (instant) kit.rig.step(1 / 60); },
    get cam() { return kit.rig.view; },
    probe: { onBoard, flying, REST, ring },
    get counts() { return { board: onBoard.size, flying: flying.size, lid: [lidStones[BLACK].length, lidStones[WHITE].length], inst: [inst[BLACK].count, inst[WHITE].count], dead: [deadInst[BLACK].count, deadInst[WHITE].count], marks: [markInst[BLACK].count, markInst[WHITE].count] }; },
  };
}

// A tap on the 3D board: the same decisions as a press on the 2D canvas.
function tap3d(x, y, ev) {
  if (!V3 || !game) return;
  const touch = !ev || ev.pointerType !== 'mouse';
  const p = V3.pointAt(x, y, touch ? 1.05 : undefined);
  if (!p) return;
  // The kit reports a tap on pointer-up, and the browser still sends that press's click afterwards, to
  // whatever is under the finger by then (City Tycoon found its cards closing as they opened). The one
  // click this tap still owes is dropped.
  const kill = (e) => { e.stopPropagation(); e.preventDefault(); off(); };
  const off = () => { removeEventListener('click', kill, true); clearTimeout(t); };
  addEventListener('click', kill, true);
  const t = setTimeout(off, 600);
  audio(); closeMenu();
  if (phase === 'marking') { toggleDead(p); return; }
  if (!canHumanPlay()) return;
  if (L.confirm && touch) { if (p === ghost) tryPlay(p); else setGhost(p); return; }
  tryPlay(p);
}

function setDim(dim, remember) {
  if (dim === '3d' && !view3d && can3d()) {
    // Anything that goes wrong building the scene leaves the 2D game playable rather than a blank board.
    try { view3d = makeView3d(); } catch (e) { view3d = { ok: false, reason: String(e) }; try { console.warn('3D board failed, using 2D:', e); } catch (e2) { /* ignore */ } }
  }
  const on = dim === '3d' && !!view3d && view3d.ok && !lost3d;
  document.body.classList.toggle('v3d', on);
  V3 = on ? view3d : null;
  if (remember) { viewPref.dim = on ? '3d' : '2d'; saveView(); }
  L.key = ''; layout();
  if (on) { setCam(camDefault(), false, true); V3.reset(); }
  renderHud(); draw();
}
function setCam(name, remember, instant) {
  if (!V3) return;
  V3.setCam(name, instant);
  if (remember) { viewPref.cam = name; saveView(); }
  $('camBtn').textContent = name === 'top' ? 'Angled' : 'Top';
  $('camBtn').setAttribute('aria-label', name === 'top' ? 'Tilt the camera to an angled view' : 'Look straight down at the board');
}
$('camBtn').addEventListener('click', () => setCam(V3 && V3.cam === 'top' ? 'angled' : 'top', true));
$('dimBtn').addEventListener('click', () => setDim('2d', true));
$('mView').onclick = () => { closeMenu(); setDim(V3 ? '2d' : '3d', true); };
// A double tap on the board is two taps on a point (a ghost, then its confirmation), not the kit's
// "reset the camera": that stays for a double click on the desk.
$('boardBox').addEventListener('dblclick', (e) => { if (V3 && V3.pointAt(e.clientX, e.clientY, 1.05)) e.stopPropagation(); }, true);
// Turning a phone over changes the default camera, unless someone picked one.
addEventListener('resize', () => { if (V3 && !viewPref.cam) setCam(camDefault(), false); });

// For the Playwright checks: read-only views plus the two entry points they drive.
window.__goUI = { get game() { return game; }, get phase() { return phase; }, get cfg() { return cfg; }, get thinking() { return thinking; },
  get layout() { return Object.assign({}, L); }, get dead() { return dead; }, get score() { return score; }, stats, get thinkerMode() { return thinker.mode; }, start };

// 3D by default wherever WebGL works; 2D if that was the last choice, or as the fallback.
if (viewPref.dim !== '2d' && can3d()) setDim('3d', false);
layout();
openSetup();
})();
</script>
