<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#16112a">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dgames">
<meta name="mobile-web-app-capable" content="yes">
<script>
  /* Installable, and playable with no network once a game has been opened. Registered from every page so
     a deep link into one game works offline too, not only a visit that started at the launcher. Over
     file:// there is no service worker and register() rejects; the catch keeps that silent. */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
<meta name="description" content="Whodunit: a deduction mystery in an old Indian mansion. Three to six detectives, human or computer, one sealed envelope.">
<title>Whodunit</title>
<!-- Yatra One for the title, room names and card names only. Offline it falls back to Georgia and every
     size still fits: the layout is computed from the viewport, not the font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
  :root {
    /* Night outside, lamplight inside: an indigo frame, a warm sandstone house. The board is the
       brightest thing on screen; everything around it stays dark and quiet. */
    --bg: #16112a; --panel: #211a3b; --panel2: #2b2350; --line: #3d3468; --muted: #a79fc8; --fg: #f6f1ff;
    --gold: #f2c14e; --good: #4cc38a; --bad: #ff6b6b; --paper: #f7ecd6; --ink: #2b1d12;
    --serif: "Yatra One", Georgia, "Times New Roman", serif;
    --bs: 360px;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  body { background: radial-gradient(120% 80% at 50% 0%, #2a1f4a 0%, var(--bg) 60%); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .42; cursor: default; }

  /* ---- frame: JS sets --bs and portrait/landscape (see layout()) ---- */
  #app { position: fixed; inset: 0; display: grid; gap: 6px; justify-content: center;
    padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  #app.portrait { grid-template-areas: "top" "board" "side"; grid-template-columns: var(--bs); grid-template-rows: 46px var(--bs) minmax(0, 1fr); }
  /* Landscape keeps a 52px lane on the left for the back button, so it never sits on the board. */
  #app.landscape { grid-template-areas: "gut board top" "gut board side"; grid-template-columns: 46px var(--bs) minmax(250px, 440px);
    grid-template-rows: 46px minmax(0, 1fr); align-content: center; height: 100%; }
  #app.landscape #side, #app.landscape #top { width: 100%; }
  #top { grid-area: top; display: flex; align-items: center; gap: 6px; min-width: 0; }
  #app.portrait #top { padding-left: 52px; }
  #boardWrap { grid-area: board; width: var(--bs); height: var(--bs); position: relative; }
  #side { grid-area: side; display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
  .logo { font-family: var(--serif); font-weight: 400; font-size: 23px; margin: 0; color: var(--gold); line-height: 1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo small { display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 9.5px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; padding: 0; position: relative; }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }

  /* ---- board ---- */
  #board { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    filter: drop-shadow(0 10px 28px rgba(0,0,0,.55)); }
  #board .lit { animation: glow 1.3s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
  #board .me-ring { animation: ring 1.1s ease-in-out infinite alternate; }
  @keyframes ring { from { stroke-opacity: .35; } to { stroke-opacity: 1; } }

  /* ---- side panel ---- */
  #status { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  #status .tok { width: 26px; height: 26px; border-radius: 50%; flex: none; border: 2px solid #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
  #status .txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.25; }
  #status .txt b { color: var(--gold); font-weight: 600; }
  .dice { display: flex; gap: 4px; flex: none; }
  .die { width: 30px; height: 30px; border-radius: 7px; background: #fbf4e4; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .die i { width: 5px; height: 5px; border-radius: 50%; background: #3a2412; place-self: center; visibility: hidden; }
  .die i.on { visibility: visible; }
  .die.roll { animation: tumble .5s ease-out; }
  @keyframes tumble { 0% { transform: rotate(-200deg) scale(.6); } 100% { transform: none; } }
  #actions { flex: none; display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; font-size: 15px; flex: 1 1 auto; }
  .btn.primary { background: linear-gradient(#f6cf6a, #e3a937); color: #2b1a05; border-color: #f6d27c; }
  .btn.danger { background: #4a1f33; border-color: #7a3352; color: #ffd5df; }
  .btn.ghost { background: transparent; }
  .hint { flex: 1 1 100%; font-size: 13px; color: var(--muted); padding: 2px 4px; }
  #hand { flex: none; display: flex; gap: 5px; align-items: stretch; min-height: 0; }
  #hand .lab { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-align: center; }
  #hand .mini { flex: 1 1 0; max-width: 64px; min-width: 0; }
  @media (min-width: 1000px) and (min-height: 700px) { #hand .mini { max-width: 86px; height: 104px; } .card.mini .nm { font-size: 12px; } }
  #hand .hid { flex: 1; font-size: 13px; color: var(--muted); display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 10px; min-height: 52px; }
  #logMini { flex: 1 1 auto; min-height: 0; overflow: hidden; border-radius: 12px; background: rgba(0,0,0,.18); padding: 6px 10px; font-size: 13px; line-height: 1.35; color: #d9d2f0; display: flex; flex-direction: column; justify-content: flex-start; gap: 5px; cursor: pointer; }
  #logMini:empty { display: none; }
  .lg .nm { font-weight: 600; }
  .lg .muted { color: var(--muted); }
  .lg .seen { color: var(--gold); }

  /* ---- cards ---- */
  .card { --c: #888; position: relative; border-radius: 9px; background: var(--paper); color: var(--ink); overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 2px var(--c); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card .band { width: 100%; background: var(--c); color: #fff; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 0 1px; font-weight: 700; }
  .card .art { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; padding: 3px; }
  .card .art svg { width: 100%; height: 100%; max-width: 92px; }
  .card .nm { font-family: var(--serif); font-size: 13px; line-height: 1.05; padding: 0 3px; }
  .card .sub { font-size: 10px; color: #6b5a48; padding: 1px 3px 4px; }
  .card.mini { height: 72px; border-radius: 7px; }
  .card.mini .band { display: none; }
  .card.mini .nm { font-size: 10.5px; font-family: "Segoe UI", system-ui, sans-serif; font-weight: 600; padding-bottom: 4px; }
  .card.mini .sub { display: none; }
  .card.big { width: 168px; height: 236px; border-radius: 14px; }
  .card.big .band { font-size: 11px; padding: 4px 0 3px; }
  .card.big .nm { font-size: 22px; }
  .card.big .sub { font-size: 13px; padding-bottom: 10px; }
  .t-wea { --c: #6d4c2f; } .t-room { --c: #2f6e74; }
  .card.out { opacity: .38; filter: grayscale(.6); }

  /* ---- sheets (dialogs) ---- */
  /* Sheets keep clear of the fixed back button: below it in portrait, to its right in landscape. */
  .veil { position: fixed; inset: 0; z-index: 30; background: rgba(8, 5, 20, .62); display: flex; align-items: flex-end; justify-content: center; padding-top: 58px; }
  @media (orientation: landscape) { .veil { padding-top: 0; padding-left: 58px; } }
  .sheet { width: 100%; max-width: 560px; max-height: calc(100% - 8px); background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 6px 16px; flex: none; }
  .sheet header h2 { font-family: var(--serif); font-weight: 400; font-size: 20px; margin: 0; flex: 1; color: var(--gold); line-height: 1.15; }
  .sheet .body { overflow-y: auto; padding: 0 14px 10px; min-height: 0; flex: 1 1 auto; overscroll-behavior: contain; }
  .sheet footer { display: flex; gap: 8px; padding: 8px 14px max(10px, env(safe-area-inset-bottom)); flex: none; border-top: 1px solid var(--line); }
  .sheet p { margin: 6px 0; line-height: 1.45; font-size: 14px; color: #ddd6f5; }
  .sec { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 8px 2px 5px; }
  .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pick.rooms { grid-template-columns: repeat(3, 1fr); }
  .opt { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); display: flex; align-items: center; gap: 6px; padding: 4px 6px; text-align: left; font-size: 13px; line-height: 1.1; min-width: 0; }
  .opt svg { width: 30px; height: 30px; flex: none; }
  .opt span { min-width: 0; overflow-wrap: break-word; hyphens: manual; }
  .opt[aria-pressed="true"] { border-color: var(--gold); background: #4a3b1c; box-shadow: 0 0 0 2px var(--gold) inset; }
  .opt.struck span { text-decoration: line-through; color: var(--muted); }
  .opt .tag { font-size: 10px; color: var(--muted); display: block; }
  .veil.wide .sheet { max-width: 760px; }
  @media (min-width: 900px), (min-height: 560px) and (min-width: 600px) {
    .veil { align-items: center; }
    .sheet { border-radius: 18px; border-bottom: 1px solid var(--line); max-height: min(92%, 760px); }
  }
  /* Landscape phones: six across, so a picker is two short rows rather than four tall ones. */
  @media (orientation: landscape) and (max-height: 500px) {
    .pick { grid-template-columns: repeat(6, 1fr); }
    .pick.rooms { grid-template-columns: repeat(5, 1fr); }
    .opt { min-height: 44px; font-size: 11.5px; gap: 4px; padding: 3px 4px; }
    .sheet .lead { display: none; }
    .opt svg { width: 24px; height: 24px; }
    .sheet header { padding-top: 4px; padding-bottom: 2px; }
    .sheet header h2 { font-size: 17px; }
    .sec { margin: 4px 2px 3px; }
    .sheet footer { padding-top: 5px; padding-bottom: max(5px, env(safe-area-inset-bottom)); }
  }
  /* Notebook: a drawer on the right on wide screens, a sheet from the bottom on phones. */
  #noteVeil.drawer { align-items: stretch; justify-content: flex-end; background: rgba(8,5,20,.35); }
  #noteVeil.drawer .sheet { max-width: 440px; max-height: none; height: 100%; border-radius: 18px 0 0 18px; border: 1px solid var(--line); animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .nb { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .nb th { position: sticky; top: 0; background: var(--panel); z-index: 1; font-size: 11px; font-weight: 600; padding: 4px 0 6px; color: #e8e2ff; }
  .nb th .tok { display: block; margin: 0 auto 2px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; }
  .nb th.cname { width: 34%; text-align: left; padding-left: 4px; }
  .nb td { border-bottom: 1px solid rgba(255,255,255,.07); padding: 0; height: 44px; }
  .nb td.cname { font-size: 13px; line-height: 1.1; padding: 0 4px; }
  .nb td.cname.no { text-decoration: line-through; color: var(--muted); }
  .nb td.cname.yes { color: var(--gold); font-weight: 700; }
  .nb tr.grp td { height: 26px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 8px 4px 0; border: 0; }
  .nb button { width: 100%; height: 44px; min-width: 0; border: 0; background: transparent; font-size: 18px; font-weight: 700; padding: 0; border-left: 1px solid rgba(255,255,255,.06); }
  .nb button.a-yes { color: #0f2a1c; background: var(--good); }
  .nb button.a-no { color: #8d86ad; background: rgba(0,0,0,.22); }
  .nb button.m-yes { color: var(--good); } .nb button.m-no { color: #ff9a9a; } .nb button.m-q { color: var(--gold); }
  .nb tr.mine td.cname::after { content: " (yours)"; color: var(--muted); font-size: 11px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: transparent; font-size: 13px; padding: 0 6px; }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--gold); font-weight: 700; }
  .legend { font-size: 12px; color: var(--muted); margin: 6px 0 8px; line-height: 1.4; }

  /* ---- setup ---- */
  #setup .seat { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #setup .seat .who { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; flex: none; padding: 0; }
  #setup .seat .nm { flex: 1; min-width: 0; font-size: 14px; line-height: 1.15; }
  #setup .seat .nm small { display: block; color: var(--muted); font-size: 11px; }
  #setup select { min-height: 44px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); padding: 0 8px; flex: none; width: 112px; }
  #setup .x { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; flex: none; }
  #setup .story { font-style: italic; color: #e3dcf7; }
  .row2 { display: flex; gap: 8px; align-items: center; margin: 4px 0 8px; }
  .row2 > span { width: 92px; font-size: 13px; color: var(--muted); flex: none; }
  .row2 .seg { flex: 1; }

  /* ---- pass-and-play cover ---- */
  #cover { position: fixed; inset: 0; z-index: 60; background: radial-gradient(circle at 50% 35%, #33275e, #120d24 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #cover .tok { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: #fff; }
  #cover h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0; color: var(--gold); }
  #cover p { margin: 0; color: var(--muted); max-width: 320px; line-height: 1.4; }
  #cover .btn { flex: none; padding: 0 28px; }

  /* ---- the private card reveal and the final reveal ---- */
  #reveal { position: fixed; inset: 0; z-index: 40; background: rgba(12,8,28,.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  #reveal h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0; color: var(--gold); }
  #reveal p { margin: 0; color: #ddd6f5; max-width: 360px; line-height: 1.4; font-size: 14px; }
  .flip { perspective: 900px; }
  .flip .inner { position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.7,.3,1); }
  .flip.on .inner { transform: rotateY(180deg); }
  .flip .back, .flip .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip .face { position: absolute; inset: 0; transform: rotateY(180deg); }
  .cardback { border-radius: 14px; background: #3b1630; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 0 0 3px #d9a441; display: grid; place-items: center; overflow: hidden; }
  .cardback svg { width: 100%; height: 100%; }
  .trio { display: flex; gap: 10px; justify-content: center; }
  .trio .flip, .trio .card.big, .trio .cardback { width: var(--cw, 150px); height: calc(var(--cw, 150px) * 1.4); }
  .trio .card.big .nm { font-size: calc(var(--cw, 150px) * .13); }
  .trio .card.big .sub { font-size: calc(var(--cw, 150px) * .08); }
  .story { font-size: 14px; line-height: 1.5; color: #e6dff9; max-width: 560px; }
  #final .verdict { font-family: var(--serif); font-size: 20px; color: var(--gold); text-align: center; margin: 8px 0 4px; line-height: 1.25; }
  #final .who { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .toast { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); z-index: 70; background: #2b2350; border: 1px solid var(--gold); color: var(--fg); padding: 8px 14px; border-radius: 12px; font-size: 14px; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  @media (prefers-reduced-motion: reduce) {
    #board .lit, #board .me-ring, .die.roll, .sheet, #noteVeil.drawer .sheet { animation: none; }
    .flip .inner { transition: none; }
  }
</style>
</head>
<body>
<style>
  /* dgames: the way back, identical in every game. Four games had no way out at all; the rest used a
     ~16px inline link, and strike-force's sat underneath the touch stick where the pad ate the tap.
     A dark disc with a light ring reads on a bright pastel scene and on a black one without being
     re-themed per game. z-index 50 sits above every game UI here (rush-lane and strike-force both use
     40, ludo game-over 20) and below the high-score prompt at 9999, which is modal and should stay on
     top. It was 15, which grep reported as present and the eye reported as missing in two games. */
  .dg-home { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(8, 18, 30, .72); border: 2px solid rgba(255, 255, 255, .62); color: #fff;
    font-size: 21px; line-height: 1; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .dg-home:hover, .dg-home:focus-visible { background: rgba(8, 18, 30, .92); border-color: #ffd54a; color: #ffd54a; }
</style>
<a class="dg-home" href="../index.html" title="All games" aria-label="Back to all games">&#8592;</a>
<div id="app" class="portrait">
  <header id="top">
    <h1 class="logo">Whodunit<small>murder in the old house</small></h1>
    <button class="iconbtn" id="btnLog" aria-label="Case log" title="Case log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <button class="iconbtn" id="btnNote" aria-label="Detective notebook" title="Detective notebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 19a2 2 0 0 1 2-2h12M9 7h6M9 11h6"/></svg><i class="dot" id="noteDot" hidden></i></button>
    <button class="iconbtn" id="btnMenu" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div id="boardWrap"><svg id="board" viewBox="-3 -3 196 196" aria-label="The house: rooms and the gallery between them"></svg></div>
  <section id="side">
    <div id="status"></div>
    <div id="actions"></div>
    <div id="hand"></div>
    <div id="logMini" title="Open the case log"></div>
  </section>
</div>

<div class="veil" id="setupVeil"><div class="sheet" id="setup"></div></div>
<div class="veil" id="dlgVeil" hidden><div class="sheet" id="dlg"></div></div>
<div class="veil" id="noteVeil" hidden><div class="sheet" id="note"></div></div>
<div id="cover" hidden></div>
<div id="reveal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
// Whodunit — pure logic. Rules, the board graph, the deduction engine and the computer detectives.
// Nothing above the UI marker touches the DOM, a clock or Math.random: the tests lift this section into
// node's vm and play whole games with it.

const VERSION = 1;
const W = 19, H = 19;
const MAX_TURNS = 900;

// ---- the cast, the weapons and the house (all original to this game) ----
const SUSPECTS = [
  { id: 'devika', name: 'Devika', title: 'the Dowager', color: '#b3243c', start: [6, 0],
    blurb: 'The old man\'s widow. She has run this house for thirty years and has no plans to stop.',

        else {
          const m = marks[c + ':' + p] || '';
          h += '<td><button class="m-' + (m === 'y' ? 'yes' : m === 'n' ? 'no' : m === 'q' ? 'q' : '') + '" data-k="' + c + ':' + p + '" aria-label="your mark">' + (m === 'y' ? '✓' : m === 'n' ? '✗' : m === 'q' ? '?' : '') + '</button></td>';
        }
      }
      h += '</tr>';
    }
  }
  h += '</tbody></table></div>';
  const body = $('note').querySelector('.body');
  const top = body ? body.scrollTop : 0;
  $('note').innerHTML = h;
  $('note').querySelector('.body').scrollTop = top;
  $('nbX').onclick = () => { $('noteVeil').hidden = true; renderAll(); };
  $('note').querySelectorAll('button[data-k]').forEach((b) => {
    if (b.closest('#nbHelp')) b.onclick = () => { opts.help = b.dataset.k; saveOpts(); renderNotebook(); };
    else b.onclick = () => { const k = b.dataset.k; const nx = MARK_CYCLE[marks[k] || '']; if (nx) marks[k] = nx; else delete marks[k]; save(); renderNotebook(); };
  });
}
$('noteVeil').addEventListener('click', (e) => { if (e.target.id === 'noteVeil') { $('noteVeil').hidden = true; renderAll(); } });

function openLog() {
  if (!S) return;
  const items = S.log.slice().reverse();
  openDialog('Case log', items.length ? items.map((e) => '<p class="lg">' + (e.turn ? '<span class="muted">Turn ' + e.turn + ' · </span>' : '') + logLine(e) + '</p>').join('') : '<p>No suggestions yet.</p>', '', false);
}
function openRules() {
  openDialog('How to play', '<p class="story">' + esc(storyText()) + '</p>' +
    '<p><b>The envelope</b> holds one suspect, one weapon and one room. Every other card is dealt out; a card in your hand cannot be in the envelope.</p>' +
    '<p><b>Move</b>: roll and move up to that many squares through the gallery, or into a room through a door (stepping in ends your move). Corner rooms have secret passages to the opposite corner — taking one is your move. You cannot re-enter the room you just left in the same turn.</p>' +
    '<p><b>Suggest</b>: when you enter a room, name a suspect and a weapon; both are brought to that room. Going round to your left, the first player holding any of the three shows you one of them, privately. Everyone sees who answered, and who could not.</p>' +
    '<p>If a suggestion brings your token to a room, on your next turn you may suggest there without moving.</p>' +
    '<p><b>Accuse</b> on your turn when you are sure. Right, you win; wrong, you are out — you keep answering suggestions but cannot win.</p>' +
    '<p><b>The notebook</b> fills in what you know for certain; pencil in the rest. Computer detectives are Easy (guesses), Normal (tracks who passes) or Hard (tracks every answer and reasons it through; never accuses wrongly).</p>', '', false);
}
function openMenu() {
  openDialog('Menu', '<div style="display:flex;flex-direction:column;gap:8px">' +
    '<button class="btn" id="mNew">New game…</button><button class="btn" id="mRules">How to play</button>' +
    '<div class="row2"><span>Speed</span><div class="seg" id="mSpeed"><button data-v="0" aria-pressed="' + !opts.fast + '">Normal</button><button data-v="1" aria-pressed="' + opts.fast + '">Fast</button></div></div></div>', '', false);
  $('mNew').onclick = () => { closeDialog(); openSetup(); };
  $('mRules').onclick = openRules;
  $('mSpeed').querySelectorAll('button').forEach((b) => { b.onclick = () => { opts.fast = b.dataset.v === '1'; saveOpts(); openMenu(); }; });
}
$('btnNote').onclick = openNotebook;
$('btnLog').onclick = openLog;
$('logMini').onclick = openLog;
$('btnMenu').onclick = openMenu;

// ------------------------------------------------------------------ pass-and-play cover
function showCover(p) {
  const el = $('cover'), P = S.players[p];
  const why = S.phase === 'refute' ? 'answer ' + S.players[S.cur].name + '\'s suggestion' : S.phase === 'reveal' ? 'see the answer to your suggestion' : 'take your turn';
  el.innerHTML = '<div class="tok" style="background:' + SUSPECTS[P.suspect].color + '">' + initial(P.suspect) + '</div><h2>Pass to ' + esc(P.name) + '</h2>' +
    '<p>Time to ' + esc(why) + '. Everyone else, look away — your cards are on the next screen.</p><button class="btn primary" id="cvGo">I am ' + esc(P.name) + '</button>';
  el.hidden = false;
  $('cvGo').onclick = () => { el.hidden = true; viewer = p; notesSeen = knownCount(); renderAll(); pump(); };
}

// ------------------------------------------------------------------ setup
function storyText() {
  return 'The monsoon feast is over. At dawn ' + M.VICTIM + ', is found dead, and the gates were barred all night. ' +
    'Six people slept under his roof. One of them did it, with something from this house, in one of its nine rooms. The answer is sealed in an envelope. ' +
    'Move through the house, make suggestions, note who cannot answer — and be the first to name all three.';
}
const KIND_LABEL = { human: 'Human', easy: 'Easy', normal: 'Normal', hard: 'Hard' };
function openSetup() {
  clearTimeout(timer);
  const saved = S && S.phase !== 'over' ? S : loadSave();
  const el = $('setup');
  let h = '<header><h2>Whodunit</h2></header><div class="body">';
  if (badSave) { h += '<p style="color:#ffb4b4">Your saved case could not be read, so a fresh one is ready.</p>'; badSave = false; }
  h += '<p class="story">' + esc(storyText()) + '</p>';
  if (saved) h += '<button class="btn primary" id="suResume" style="width:100%;margin:4px 0 8px">Resume the case in progress</button>';
  h += '<div class="sec">Detectives (play in this order)</div><div id="seats"></div>' +
    '<button class="btn ghost" id="suAdd" style="width:100%">+ Add a detective</button>' +
    '<div class="sec">Options</div>' +
    '<div class="row2"><span>Dice</span><div class="seg" id="suDice"><button data-v="1" aria-pressed="' + (opts.dice === 1) + '">One die</button><button data-v="2" aria-pressed="' + (opts.dice === 2) + '">Two (quicker)</button></div></div>' +
    '<div class="row2"><span>Notebook</span><div class="seg" id="suHelp">' + [['cards', 'Cards seen'], ['passes', '+ Passes'], ['full', 'Full']].map(([k, l]) => '<button data-v="' + k + '" aria-pressed="' + (opts.help === k) + '">' + l + '</button>').join('') + '</div></div>' +
    '</div><footer>' + (saved ? '<button class="btn ghost" id="suBack">Back</button>' : '') + '<button class="btn primary" id="suGo">' + (saved ? 'Start a new case' : 'Start the case') + '</button></footer>';
  el.innerHTML = h;
  $('setupVeil').hidden = false;
  const drawSeats = () => {
    $('seats').innerHTML = opts.seats.map((s, i) => '<div class="seat"><button class="who" data-i="' + i + '" style="background:' + SUSPECTS[s.suspect].color + '" aria-label="Change character">' + initial(s.suspect) + '</button>' +
      '<div class="nm">' + esc(SUSPECTS[s.suspect].name) + '<small>' + esc(SUSPECTS[s.suspect].title) + '</small></div>' +
      '<select data-i="' + i + '" aria-label="Who plays ' + esc(SUSPECTS[s.suspect].name) + '">' + Object.keys(KIND_LABEL).map((k) => '<option value="' + k + '"' + (k === s.kind ? ' selected' : '') + '>' + (k === 'human' ? 'Human' : 'Computer · ' + KIND_LABEL[k]) + '</option>').join('') + '</select>' +
      (opts.seats.length > 3 ? '<button class="x" data-i="' + i + '" aria-label="Remove">✕</button>' : '') + '</div>').join('');
    $('suAdd').hidden = opts.seats.length >= 6;
    $('seats').querySelectorAll('.who').forEach((b) => { b.onclick = () => {
      const i = +b.dataset.i, used = new Set(opts.seats.map((s) => s.suspect));
      let s = opts.seats[i].suspect;
      do { s = (s + 1) % NS; } while (used.has(s) && s !== opts.seats[i].suspect);
      opts.seats[i].suspect = s; drawSeats();
    }; });
    $('seats').querySelectorAll('select').forEach((b) => { b.onchange = () => { opts.seats[+b.dataset.i].kind = b.value; }; });
    $('seats').querySelectorAll('.x').forEach((b) => { b.onclick = () => { opts.seats.splice(+b.dataset.i, 1); drawSeats(); }; });
  };
  drawSeats();
  $('suAdd').onclick = () => { const used = new Set(opts.seats.map((s) => s.suspect)); let s = 0; while (used.has(s)) s++; opts.seats.push({ kind: 'normal', suspect: s }); drawSeats(); };
  $('suDice').querySelectorAll('button').forEach((b) => { b.onclick = () => { opts.dice = +b.dataset.v; $('suDice').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; });
  $('suHelp').querySelectorAll('button').forEach((b) => { b.onclick = () => { opts.help = b.dataset.v; $('suHelp').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; });
  if (saved) {
    $('suResume').onclick = () => { $('setupVeil').hidden = true; resume(saved); };
    if ($('suBack')) $('suBack').onclick = () => { $('setupVeil').hidden = true; resume(saved); };
  }
  $('suGo').onclick = () => { saveOpts(); $('setupVeil').hidden = true; startGame({ seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 }); };
}
function startGame(o) {
  clearTimeout(timer);
  const seats = o.seats || opts.seats;
  S = M.newGame({ seed: o.seed, dice: o.dice || opts.dice, players: seats.map((s) => ({ kind: s.kind, suspect: s.suspect, name: SUSPECTS[s.suspect].name })) });
  S.notes = {};
  begin();
}
function resume(s) { S = s; S.notes = S.notes || {}; begin(); }
function begin() {
  busy = false;
  $('reveal').hidden = true; $('dlgVeil').hidden = true; $('noteVeil').hidden = true; $('cover').hidden = true;
  const hs = humans();
  viewer = hs.length === 1 ? hs[0] : (hs.length ? (S.players[actor()].kind === 'human' ? -1 : hs[0]) : -1);
  if (hs.length > 1) viewer = -1;
  notesSeen = 0;
  save();
  layout();
  renderAll();
  pump();
}

// ------------------------------------------------------------------ board taps
$('board').addEventListener('click', (e) => {
  if (!S || busy || S.phase !== 'move' || actor() !== viewer || autoplay) return;
  const key = view.hit(e.clientX, e.clientY, S.targets);
  if (key) act(() => M.moveTo(S, key));
});

// ------------------------------------------------------------------ boot
view = makeBoardView($('board'));
layout();
{
  const s = loadSave();
  if (s) { S = s; S.notes = S.notes || {}; viewer = -1; renderAll(); }
  else { S = M.newGame({ seed: 1, players: opts.seats.map((x) => ({ kind: x.kind, suspect: x.suspect, name: SUSPECTS[x.suspect].name })) }); S.notes = {}; renderAll(); S = null; }
  openSetup();
}

// Hooks for browser-driven checks: start a seeded game, let the Hard detective play the human seats,
// speed things up, and read the state.
window.__whodunitUI = {
  start(o) { $('setupVeil').hidden = true; if (o.seats) opts.seats = o.seats; if (o.fast !== undefined) opts.fast = o.fast; startGame(o); },
  state: () => S,
  autoplay(on) { autoplay = !!on; renderAll(); pump(); },
  view: () => view,
  viewer: () => viewer,
};
})();
</script>
</body>
</html>
